<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e5f1ef">
  <title>借一双翅膀 · 摩托车骑着鹈鹕</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #29434b;
      --sky: #e5f1ef;
      --sea: #acd7d2;
      --paper: #fffbed;
      --orange: #ed7353;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; width: 100%; height: 100%; }

    body {
      overflow: hidden;
      color: var(--ink);
      background: var(--sky);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .world {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 360px;
      overflow: hidden;
      isolation: isolate;
      background: linear-gradient(180deg, #dcecea 0%, var(--sky) 47%, #f0f5e9 76%);
    }

    .masthead {
      position: absolute;
      z-index: 3;
      top: 36px;
      left: clamp(24px, 4.3vw, 72px);
      display: flex;
      align-items: flex-start;
      gap: 13px;
      user-select: none;
    }

    .masthead > svg { width: 34px; height: 34px; margin-top: 1px; }

    h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.5;
      font-weight: 700;
      letter-spacing: .1em;
    }

    .masthead p {
      margin: 7px 0 0;
      color: #6c888b;
      font-size: 12px;
      letter-spacing: .12em;
    }

    .sun {
      position: absolute;
      top: 17%;
      right: 17%;
      width: clamp(70px, 8.6vw, 122px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #f6ce78;
      box-shadow: 0 0 0 15px #f6ce7816, 0 0 0 36px #f6ce780b;
    }

    .cloud {
      position: absolute;
      color: #f9fcf4;
      animation: cloud-drift 26s ease-in-out infinite alternate;
    }

    .cloud-one { width: 230px; top: 23%; left: 9%; }
    .cloud-two { width: 155px; top: 11%; left: 51%; opacity: .72; animation-delay: -13s; }
    .cloud-three { width: 192px; top: 39%; right: -3%; opacity: .78; animation-delay: -8s; }

    .distant-gulls {
      position: absolute;
      top: 23%;
      right: 32%;
      width: 98px;
      color: #83a7aa;
      animation: gull-drift 9s ease-in-out infinite;
    }

    .coast {
      position: absolute;
      bottom: calc(34% - 2px);
      width: 100%;
      height: 150px;
    }

    .ocean {
      position: absolute;
      inset: 66% 0 0;
      background: linear-gradient(#b8dbd4, var(--sea) 38%, #92c7c3);
      border-top: 2px solid #f5f9e8;
    }

    .ocean > svg { width: 100%; height: 100%; overflow: hidden; }
    .water-far { animation: water-pass 34s linear infinite; }
    .water-near { animation: water-pass 15s linear infinite; }

    .illustration {
      position: absolute;
      z-index: 1;
      top: 47%;
      left: 50%;
      width: min(1110px, 94vw);
      height: auto;
      overflow: visible;
      transform: translate(-50%, -43%);
    }

    .flight { animation: flight 3.6s ease-in-out infinite; }
    .motorcycle { transform-origin: 611px 544px; animation: suspension 1.8s ease-in-out infinite; }
    .near-wing { transform-origin: 649px 604px; animation: near-flap 1.8s ease-in-out infinite; }
    .far-wing { transform-origin: 648px 590px; animation: far-flap 1.8s ease-in-out infinite; }
    .feet { transform-origin: 595px 725px; animation: feet-sway 3.6s ease-in-out infinite; }
    .scarf { transform-origin: 721px 349px; animation: scarf-wave .9s ease-in-out infinite alternate; }
    .scarf-tail { transform-origin: 645px 333px; animation: scarf-tip .9s ease-in-out infinite alternate; }
    .rear-spokes { transform-origin: 483px 497px; animation: wheel-turn 12s linear infinite; }
    .front-spokes { transform-origin: 744px 496px; animation: wheel-turn 12s linear infinite; }
    .bird-eye { transform-origin: 880px 461px; animation: blink 7.2s linear infinite; }
    .headlamp-eye { transform-origin: 756px 373px; animation: blink 9s linear infinite; animation-delay: -2s; }
    .flight-shadow { transform-origin: 684px 822px; animation: shadow-breathe 3.6s ease-in-out infinite; }
    .wind { animation: wind-pass 2.8s ease-in-out infinite; }
    .wind-two { animation-delay: -1s; }
    .wind-three { animation-delay: -1.8s; }
    .rein { animation: rein-sway 1.8s ease-in-out infinite; transform-origin: 865px 508px; }

    .page-footer {
      position: absolute;
      z-index: 3;
      bottom: 28px;
      left: clamp(24px, 4.3vw, 72px);
      right: clamp(24px, 4.3vw, 72px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .caption {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #446e74;
      font-size: 11px;
      letter-spacing: .16em;
    }

    .caption svg { width: 31px; height: 20px; }

    .playback {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 44px;
      padding: 10px 17px;
      border: 1px solid #527e7830;
      border-radius: 28px;
      color: var(--ink);
      background: #f8fbedb8;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      letter-spacing: .05em;
      transition: background .2s, transform .2s;
      -webkit-tap-highlight-color: transparent;
    }

    .playback:hover { background: #fffbed; transform: translateY(-2px); }
    .playback:active { transform: translateY(0); }
    .playback:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
    .playback svg { width: 14px; height: 14px; }
    .play-icon { display: none; }
    .is-paused .pause-icon { display: none; }
    .is-paused .play-icon { display: block; }
    .is-paused *, .is-paused *::before, .is-paused *::after { animation-play-state: paused !important; }

    @keyframes flight {
      0%, 100% { transform: translate(0, 4px) rotate(-.5deg); }
      50% { transform: translate(0, -12px) rotate(.5deg); }
    }

    @keyframes suspension {
      0%, 100% { transform: translateY(1px) rotate(-.6deg); }
      42% { transform: translateY(-5px) rotate(.5deg); }
      68% { transform: translateY(3px) rotate(-.2deg); }
    }

    @keyframes near-flap {
      0%, 100% { transform: rotate(17deg) scaleY(.91); }
      48% { transform: rotate(-16deg) scaleY(1.04); }
    }

    @keyframes far-flap {
      0%, 100% { transform: rotate(9deg) scaleY(1.05); }
      48% { transform: rotate(-14deg) scaleY(.82); }
    }

    @keyframes feet-sway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(6deg); }
    }

    @keyframes scarf-wave { from { transform: rotate(-3deg); } to { transform: rotate(5deg); } }
    @keyframes scarf-tip { from { transform: rotate(-6deg); } to { transform: rotate(5deg); } }
    @keyframes wheel-turn { to { transform: rotate(360deg); } }
    @keyframes blink { 0%, 43%, 46%, 100% { transform: scaleY(1); } 44%, 45% { transform: scaleY(.08); } }
    @keyframes cloud-drift { to { transform: translateX(-65px); } }
    @keyframes gull-drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-18px, -7px); } }
    @keyframes water-pass { to { transform: translateX(-1440px); } }
    @keyframes shadow-breathe { 0%, 100% { transform: scaleX(1); opacity: .16; } 50% { transform: scaleX(.86); opacity: .1; } }
    @keyframes wind-pass { 0% { transform: translateX(24px); opacity: 0; } 25%, 65% { opacity: .7; } 100% { transform: translateX(-53px); opacity: 0; } }
    @keyframes rein-sway { 0%, 100% { transform: skewX(0deg); } 45% { transform: skewX(1.1deg); } }

    @media (max-width: 600px) {
      .masthead { top: 27px; left: 23px; gap: 10px; }
      .masthead > svg { width: 29px; height: 29px; }
      h1 { font-size: 20px; }
      .masthead p { font-size: 11px; margin-top: 6px; }
      .sun { top: 23%; right: 16%; width: 70px; }
      .cloud-one { width: 145px; left: -10%; top: 30%; }
      .cloud-two { width: 110px; left: 56%; top: 15%; }
      .cloud-three { width: 130px; top: 42%; right: -19%; }
      .distant-gulls { width: 62px; top: 27%; right: 40%; }
      .illustration { top: 48%; width: 102vw; transform: translate(-50%, -45%); }
      .ocean { top: 55%; }
      .coast { bottom: calc(45% - 2px); height: 82px; }
      .page-footer { bottom: 24px; left: 23px; right: 23px; }
      .caption { font-size: 10px; letter-spacing: .1em; gap: 7px; }
      .playback { padding: 10px 14px; }
    }

    @media (max-height: 560px) and (min-width: 601px) {
      .masthead { top: 20px; }
      h1 { font-size: 19px; }
      .illustration { top: 46%; width: min(72vw, 760px); max-height: 92vh; }
      .page-footer { bottom: 17px; }
      .sun { top: 16%; width: 70px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .playback { transition: none; }
    }
  </style>
</head>

  <script>
    const world = document.getElementById('world');
    const playback = document.getElementById('playback');
    const playbackLabel = document.getElementById('playback-label');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    function setPaused(paused) {
      world.classList.toggle('is-paused', paused);
      playback.setAttribute('aria-pressed', String(paused));
      playback.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
      playbackLabel.textContent = paused ? '继续飞' : '暂停';
    }

    playback.addEventListener('click', () => {
      setPaused(!world.classList.contains('is-paused'));
    });

    reducedMotion.addEventListener('change', event => setPaused(event.matches));
    setPaused(reducedMotion.matches);
  </script>
