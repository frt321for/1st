<!DOCTYPE html>
<!--
DIRECTION CONTRACT
THESIS         仪表盘的价值不是把数字摆出来，而是回答「和什么比」。
               每个指标必须同时给出对比基准与差值，四张 KPI 不等大——
               主指标占双倍宽并自带趋势图。拒绝「四张一样大的卡 + 迷你折线 + 柔和投影」。
OWN-WORLD      冷白工作面 + 墨蓝结构色 + 语义双色（升绿降红）；
               图表只用一条受控的蓝阶，绝不用彩虹色板；
               所有数字走等宽表格数字，分隔靠发丝线不靠卡片阴影。
STORY          先在顶栏确认「看的是哪段时间、和谁比」，再从主指标读出偏离，
               然后到渠道与漏斗里找偏离出在哪一环，最后在订单表里落到具体单据。
FIRST VIEWPORT 顶栏的时间范围与对比基准是第一眼；主 KPI 与其趋势图占据右上最大面积；
               三个次级指标压在同一行，全部带同口径的对比值。
SIGNATURE      对比基准是全局状态：切换「较昨日 / 较上周同期 / 较目标」时，
               四张卡的差值、趋势图的虚线基准、漏斗的对比条会一起改口径。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse 脉搏 · 运营总览</title>
<style>
/* ==========================================================================
   Pulse 脉搏 · 电商运营分析仪表盘
   ========================================================================== */

:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --surface-2:#eef1f4;
  --surface-3:#e2e7ec;

  --ink:#121820;
  --ink-2:#4a5663;
  --ink-3:#5e6b78;

  --hair:#dde3e9;
  --hair-2:#c3ccd6;

  --navy:#1e4a73;
  --navy-2:#163a5c;
  --navy-soft:#e7eef5;

  --up:#146b45;
  --up-soft:#e6f2ec;
  --down:#a8352a;
  --down-soft:#fbecea;

  /* 受控蓝阶：只在图表里使用 */
  --c1:#1e4a73;
  --c2:#3a6f9e;
  --c3:#6294bd;
  --c4:#93b7d3;
  --c5:#c2d5e5;

  --r-sm:4px; --r-md:8px; --r-lg:12px;

  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",
         ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; overflow-x:clip; }
html{ color-scheme:light; }

body{
  min-height:100dvh;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,h4,p,ul,ol,dl,dd,dt,figure,table{ margin:0; padding:0; }
ul,ol{ list-style:none; }
button,input,select{ font:inherit; }

:focus-visible{ outline:2px solid var(--navy); outline-offset:2px; border-radius:3px; }

.mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.sr{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0;
}

/* ==========================================================================
   骨架
   ========================================================================== */
.shell{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  min-height:100dvh;
}

/* ---- 侧边栏 ---- */
.side{
  width:232px;
  background:var(--surface);
  border-right:1px solid var(--hair);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100dvh;
  transition:width .22s var(--ease);
}
.side[data-collapsed="true"]{ width:64px; }
.side[data-collapsed="true"] .side__txt,
.side[data-collapsed="true"] .side__label,
.side[data-collapsed="true"] .shop__meta,
.side[data-collapsed="true"] .side__foot span{ display:none; }
.side[data-collapsed="true"] .navlink{ justify-content:center; padding-inline:0; }
.side[data-collapsed="true"] .side__head{ justify-content:center; }

.side__head{
  display:flex; align-items:center; gap:.6rem;
  padding:0 .85rem;
  height:56px;
  border-bottom:1px solid var(--hair);
}
.logo{
  display:inline-flex; align-items:center; gap:.55ch;
  font-weight:700; font-size:1rem; letter-spacing:-.015em;
  white-space:nowrap;
}
.logo__mark{
  width:22px; height:22px; flex:0 0 auto;
  border-radius:6px; background:var(--navy);
  display:grid; place-items:center;
}
.logo__mark svg{ width:14px; height:14px; }

.side__toggle{
  margin-left:auto;
  width:30px; height:30px;
  border:1px solid var(--hair); border-radius:var(--r-sm);
  background:var(--surface); color:var(--ink-2);
  cursor:pointer; display:grid; place-items:center;
}
.side__toggle:hover{ background:var(--surface-2); }

.shop{
  margin:.7rem .7rem 0;
  padding:.55rem .65rem;
  border:1px solid var(--hair);
  border-radius:var(--r-md);
  background:var(--surface-2);
  display:flex; align-items:center; gap:.6rem;
  cursor:pointer; width:calc(100% - 1.4rem);
  text-align:left;
}
.shop:hover{ background:var(--surface-3); }
.shop__badge{
  width:26px; height:26px; flex:0 0 auto;
  border-radius:var(--r-sm);
  background:var(--navy); color:#fff;
  display:grid; place-items:center;
  font-size:.75rem; font-weight:700;
}
.shop__meta b{ display:block; font-size:.8125rem; font-weight:620; }
.shop__meta span{ display:block; font-size:.6875rem; color:var(--ink-3); }

.side__nav{ padding:.7rem .55rem; overflow-y:auto; flex:1 1 auto; }
.side__label{
  padding:.6rem .6rem .3rem;
  font-size:.625rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-3); font-weight:640;
}
.navlink{
  display:flex; align-items:center; gap:.7rem;
  min-height:40px;
  padding:0 .6rem;
  border-radius:var(--r-md);
  border:0; background:transparent;
  color:var(--ink-2);
  font-size:.875rem;
  cursor:pointer; width:100%;
  text-align:left;
  transition:background-color .15s var(--ease), color .15s var(--ease);
}
.navlink svg{ width:17px; height:17px; flex:0 0 auto; }
.navlink:hover{ background:var(--surface-2); color:var(--ink); }
.navlink[aria-current="page"]{
  background:var(--navy-soft); color:var(--navy); font-weight:620;
}
.navlink .badge{
  margin-left:auto;
  font-family:var(--mono); font-size:.6875rem;
  background:var(--down-soft); color:var(--down);
  padding:.05rem .35rem; border-radius:99px;
}

.side__foot{
  border-top:1px solid var(--hair);
  padding:.7rem;
  display:flex; align-items:center; gap:.6rem;
  font-size:.8125rem;
}
.side__foot .av{
  width:28px; height:28px; border-radius:50%;
  background:var(--surface-3); color:var(--ink-2);
  display:grid; place-items:center; font-weight:700; font-size:.75rem;
  flex:0 0 auto;
}

/* ---- 主区 ---- */
.main{ min-width:0; display:flex; flex-direction:column; }

/* ---- 顶栏 ---- */
.top{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--hair);
}
.top__row{
  display:flex; align-items:center; gap:.8rem; flex-wrap:wrap;
  padding:.7rem clamp(.9rem,2vw,1.5rem);
}
.top h1{ font-size:1.05rem; font-weight:660; letter-spacing:-.018em; }
.top__demo{
  font-size:.6875rem; color:var(--ink-3);
  border:1px dashed var(--hair-2);
  padding:.1rem .45rem; border-radius:var(--r-sm);
}
.top__spacer{ flex:1 1 auto; }

.seg{
  display:inline-flex;
  border:1px solid var(--hair-2);
  border-radius:var(--r-md);
  overflow:hidden;
  background:var(--surface);
}
.seg button{
  min-height:38px;
  padding:0 .7rem;
  border:0; border-right:1px solid var(--hair);
  background:transparent;
  color:var(--ink-2);
  font-size:.8125rem;
  cursor:pointer;
  white-space:nowrap;
  transition:background-color .15s var(--ease), color .15s var(--ease);
}
.seg button:last-child{ border-right:0; }
.seg button:hover{ background:var(--surface-2); color:var(--ink); }
.seg button[aria-pressed="true"]{ background:var(--navy); color:#fff; font-weight:600; }

.ctl{
  min-height:38px;
  display:inline-flex; align-items:center; gap:.45ch;
  padding:0 .75rem;
  border:1px solid var(--hair-2);
  border-radius:var(--r-md);
  background:var(--surface);
  color:var(--ink);
  font-size:.8125rem;
  cursor:pointer;
}
.ctl:hover{ background:var(--surface-2); }
.ctl svg{ width:14px; height:14px; }
select.ctl{ appearance:none; padding-right:1.8rem;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),
                   linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 14px) 17px, calc(100% - 9px) 17px;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat; }

.top__meta{
  padding:0 clamp(.9rem,2vw,1.5rem) .65rem;
  font-size:.75rem; color:var(--ink-3);
  display:flex; flex-wrap:wrap; gap:.3rem 1.2rem;
}

/* ---- 内容 ---- */
.body{ padding:clamp(.9rem,2vw,1.5rem); display:grid; gap:clamp(.75rem,1.6vw,1.15rem); }

.panel{
  background:var(--surface);
  border:1px solid var(--hair);
  border-radius:var(--r-lg);
}
.panel__head{
  display:flex; align-items:center; gap:.7rem; flex-wrap:wrap;
  padding:.8rem 1rem;
  border-bottom:1px solid var(--hair);
}
.panel__head h2{ font-size:.9375rem; font-weight:640; }
.panel__head p{ font-size:.75rem; color:var(--ink-3); width:100%; }
.panel__body{ padding:1rem; }

/* ==========================================================================
   KPI
   ========================================================================== */
.kpis{
  display:grid;
  grid-template-columns:minmax(0,1.9fr) repeat(3, minmax(0,1fr));
  gap:clamp(.75rem,1.6vw,1.15rem);
}
.kpi{
  background:var(--surface);
  border:1px solid var(--hair);
  border-radius:var(--r-lg);
  padding:1rem 1.05rem 1.05rem;
  display:flex; flex-direction:column;
  min-width:0;
}
.kpi__t{
  display:flex; align-items:center; gap:.5rem;
  font-size:.8125rem; color:var(--ink-3);
}
.kpi__t b{ font-weight:560; color:var(--ink-2); }
.kpi__val{
  margin-top:.5rem;
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:1.85rem; font-weight:700; letter-spacing:-.035em; line-height:1.05;
}
.kpi--lead .kpi__val{ font-size:2.5rem; }
.kpi__val small{ font-size:.5em; font-weight:600; color:var(--ink-3); margin-left:.3ch; }

.delta{
  display:inline-flex; align-items:center; gap:.35ch;
  margin-top:.5rem;
  padding:.14rem .45rem;
  border-radius:var(--r-sm);
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:.8125rem; font-weight:640;
  width:max-content;
}
.delta[data-dir="up"]{ background:var(--up-soft); color:var(--up); }
.delta[data-dir="down"]{ background:var(--down-soft); color:var(--down); }
.delta[data-dir="flat"]{ background:var(--surface-2); color:var(--ink-3); }
.delta::before{
  content:""; width:0; height:0;
  border-left:4px solid transparent; border-right:4px solid transparent;
}
.delta[data-dir="up"]::before{ border-bottom:6px solid currentColor; }
.delta[data-dir="down"]::before{ border-top:6px solid currentColor; }
.delta[data-dir="flat"]::before{ border:0; width:7px; height:2px; background:currentColor; }

.kpi__base{ margin-top:.35rem; font-size:.75rem; color:var(--ink-3); }
.kpi__hint{
  margin-top:.7rem; padding-top:.6rem;
  border-top:1px solid var(--hair);
  font-size:.75rem; color:var(--ink-2);
}
.kpi__hint a{
  color:var(--navy); background:none; border:0; padding:0;
  cursor:pointer; font:inherit; text-decoration:underline; text-underline-offset:2px;
}
.kpi__chart{ margin-top:.9rem; flex:1 1 auto; min-height:150px; }
.kpi__chart svg{ width:100%; height:100%; display:block; }

/* 图表通用 */
.axis{ stroke:var(--hair); stroke-width:1; }
.gridline{ stroke:var(--hair); stroke-width:1; stroke-dasharray:2 4; }
.axtxt{ fill:var(--ink-3); font-size:10px; font-family:var(--mono); }
.serieA{ fill:none; stroke:var(--c1); stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round; }
.serieB{ fill:none; stroke:var(--c4); stroke-width:1.6; stroke-dasharray:4 3; }
.area{ fill:url(#areaFill); }
.dot{ fill:var(--c1); }
.hoverline{ stroke:var(--ink-3); stroke-width:1; stroke-dasharray:2 3; }

.tip{
  position:absolute;
  pointer-events:none;
  background:var(--ink); color:#fff;
  border-radius:var(--r-md);
  padding:.5rem .6rem;
  font-size:.75rem;
  white-space:nowrap;
  box-shadow:0 10px 22px -12px rgba(0,0,0,.7);
  opacity:0;
  translate:-50% calc(-100% - 10px);
  transition:opacity .12s var(--ease);
  z-index:10;
}
.tip[data-on="true"]{ opacity:1; }
.tip b{ display:block; font-family:var(--mono); font-size:.875rem; }
.tip span{ color:rgba(255,255,255,.72); }

/* ==========================================================================
   下半区
   ========================================================================== */
.grid2{
  display:grid;
  grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);
  gap:clamp(.75rem,1.6vw,1.15rem);
}

/* ---- 渠道堆叠条 ---- */
.chan{ display:grid; gap:.7rem; }
.chan__row{
  display:grid;
  grid-template-columns:minmax(0,5.5em) minmax(0,1fr) minmax(0,5.5em);
  gap:.8rem; align-items:center;
}
.chan__name{ font-size:.8125rem; color:var(--ink-2); }
.chan__bar{
  height:22px; border-radius:var(--r-sm);
  background:var(--surface-2);
  overflow:hidden; display:flex;
}
.chan__bar i{ display:block; height:100%; }
.chan__val{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:.8125rem; text-align:right;
}
.legend{
  display:flex; flex-wrap:wrap; gap:.4rem .9rem;
  margin-top:.9rem; padding-top:.8rem;
  border-top:1px solid var(--hair);
  font-size:.75rem; color:var(--ink-2);
}
.legend span{ display:inline-flex; align-items:center; gap:.4ch; }
.legend i{ width:10px; height:10px; border-radius:2px; }

/* ---- 漏斗 ---- */
.funnel{ display:grid; gap:.55rem; }
.step{
  border:1px solid var(--hair);
  border-radius:var(--r-md);
  padding:.6rem .75rem;
  position:relative;
  overflow:hidden;
}
.step__fill{
  position:absolute; inset:0 auto 0 0;
  background:var(--navy-soft);
}
.step__in{ position:relative; display:flex; align-items:baseline; gap:.6rem; }
.step__in b{ font-size:.8125rem; font-weight:600; }
.step__in .n{
  margin-left:auto;
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:.9375rem; font-weight:660;
}
.step__rate{
  display:block; margin-top:.2rem;
  font-size:.6875rem; color:var(--ink-3);
  position:relative;
}
.step__rate b{ color:var(--ink-2); font-family:var(--mono); }
.step[data-worst="true"]{ border-color:var(--down); }
.step[data-worst="true"] .step__fill{ background:var(--down-soft); }
.step[data-worst="true"] .step__rate b{ color:var(--down); }

/* ==========================================================================
   订单表
   ========================================================================== */
.tools{
  display:flex; flex-wrap:wrap; gap:.5rem; align-items:center;
  padding:.7rem 1rem;
  border-bottom:1px solid var(--hair);
}
.search{
  position:relative; flex:1 1 200px; max-width:280px;
}
.search input{
  width:100%; min-height:38px;
  padding:0 .7rem 0 2.1rem;
  border:1px solid var(--hair-2); border-radius:var(--r-md);
  background:var(--surface); color:var(--ink);
  font-size:.8125rem;
}
.search input:focus{ outline:none; border-color:var(--navy); box-shadow:0 0 0 3px var(--navy-soft); }
.search svg{
  position:absolute; left:.6rem; top:50%; translate:0 -50%;
  width:14px; height:14px; color:var(--ink-3); pointer-events:none;
}

.bulk{
  display:none;
  align-items:center; gap:.6rem;
  padding:.55rem 1rem;
  background:var(--navy-soft);
  border-bottom:1px solid var(--hair);
  font-size:.8125rem;
}
.bulk[data-on="true"]{ display:flex; }
.bulk b{ font-family:var(--mono); }

.tablewrap{ overflow-x:auto; overscroll-behavior-x:contain; }
table{ width:100%; border-collapse:collapse; min-width:820px; }
th,td{ text-align:left; padding:.6rem .8rem; border-bottom:1px solid var(--hair); }
th{
  font-size:.6875rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:640;
  background:var(--surface);
  position:sticky; top:0; z-index:1;
  white-space:nowrap;
}
th button{
  display:inline-flex; align-items:center; gap:.35ch;
  border:0; background:none; padding:0; cursor:pointer;
  font:inherit; color:inherit; letter-spacing:inherit; text-transform:inherit;
}
th button::after{
  content:""; width:0; height:0;
  border-left:3.5px solid transparent; border-right:3.5px solid transparent;
  border-top:5px solid var(--hair-2);
  opacity:.6;
}
th[aria-sort="ascending"] button::after{ border-top:0; border-bottom:5px solid var(--navy); opacity:1; }
th[aria-sort="descending"] button::after{ border-top:5px solid var(--navy); opacity:1; }
td{ font-size:.8125rem; }
td.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; }
tbody tr:hover{ background:var(--surface-2); }
tbody tr[data-sel="true"]{ background:var(--navy-soft); }
td:first-child,th:first-child{ width:38px; padding-right:0; }
input[type="checkbox"]{ width:16px; height:16px; accent-color:var(--navy); cursor:pointer; }

.chip{
  display:inline-flex; align-items:center; gap:.35ch;
  padding:.1rem .45rem;
  border-radius:99px;
  font-size:.75rem;
  border:1px solid transparent;
  white-space:nowrap;
}
.chip::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.chip[data-s="paid"]{ background:var(--up-soft); color:var(--up); }
.chip[data-s="shipped"]{ background:var(--navy-soft); color:var(--navy); }
.chip[data-s="pending"]{ background:#fdf3e3; color:#8a5b12; }
.chip[data-s="refund"]{ background:var(--down-soft); color:var(--down); }

.rowact{
  border:1px solid var(--hair-2); border-radius:var(--r-sm);
  background:var(--surface); color:var(--ink-2);
  min-height:30px; padding:0 .55rem;
  font-size:.75rem; cursor:pointer;
}
.rowact:hover{ background:var(--surface-2); color:var(--ink); }

.pager{
  display:flex; flex-wrap:wrap; align-items:center; gap:.5rem;
  padding:.7rem 1rem;
  font-size:.8125rem; color:var(--ink-3);
}
.pager__btns{ margin-left:auto; display:flex; gap:.35rem; }
.pgbtn{
  min-width:34px; min-height:34px;
  border:1px solid var(--hair-2); border-radius:var(--r-sm);
  background:var(--surface); color:var(--ink);
  cursor:pointer; font-size:.8125rem;
  font-family:var(--mono);
}
.pgbtn:hover{ background:var(--surface-2); }
.pgbtn[aria-current="page"]{ background:var(--navy); border-color:var(--navy); color:#fff; font-weight:640; }
.pgbtn[aria-disabled="true"]{ opacity:.4; pointer-events:none; }

.empty{ padding:2.5rem 1rem; text-align:center; color:var(--ink-3); font-size:.875rem; }

/* ==========================================================================
   响应式
   ========================================================================== */
@media (max-width:1180px){
  .kpis{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .kpi--lead{ grid-column:1 / -1; }
  .grid2{ grid-template-columns:minmax(0,1fr); }
}
@media (max-width:860px){
  .side{ position:fixed; z-index:50; box-shadow:0 0 0 100vmax rgba(0,0,0,.4); transform:translateX(-100%); }
  .side[data-open="true"]{ transform:none; }
  .shell{ grid-template-columns:minmax(0,1fr); }
  .mobtoggle{ display:inline-flex !important; }
}
@media (max-width:600px){
  .kpis{ grid-template-columns:minmax(0,1fr); }
  .top__row{ gap:.5rem; }
  .seg button{ padding:0 .5rem; font-size:.75rem; }
}
.mobtoggle{ display:none; }

@media (prefers-reduced-motion:reduce){
  .side,.navlink,.seg button,.tip{ transition:none; }
}

<body>

<div class="tip" id="tip" role="status" aria-live="off"></div>

<script>
(function () {
  'use strict';

  function $(id){ return document.getElementById(id); }
  function money(n){ return '¥' + n.toLocaleString('zh-CN', { maximumFractionDigits:0 }); }
  function pad(n){ return String(n).padStart(2,'0'); }

  /* ======================================================================
     演示数据：由固定种子生成，刷新前后一致
     ====================================================================== */
  function mk(seed){
    var s = seed >>> 0;
    return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  function buildSeries(days){
    var rnd = mk(20260823 + days);
    var out = [];
    var base = 128000;
    for (var i = days - 1; i >= 0; i--){
      var d = new Date();
      d.setDate(d.getDate() - i);
      var weekend = (d.getDay() === 0 || d.getDay() === 6) ? 1.22 : 1;
      var wobble = 0.82 + rnd() * 0.4;
      var gmv = Math.round(base * weekend * wobble);
      var orders = Math.round(gmv / (268 + rnd() * 90));
      out.push({
        date: d,
        gmv: gmv,
        orders: orders,
        refundRate: 2.1 + rnd() * 2.6,
        prev: Math.round(gmv * (0.86 + rnd() * 0.28))
      });
    }
    return out;
  }

  var state = { range:7, base:'wow', series:[], sortK:'time', sortDir:'desc', status:'all', q:'', page:1, per:8, sel:{} };

  var BASE_LABEL = { dod:'较昨日', wow:'较上周同期', target:'较目标' };

  /* ======================================================================
     KPI
     ====================================================================== */
  function sum(arr, k){ return arr.reduce(function(a,b){ return a + b[k]; }, 0); }

  function baselineOf(cur, kind, key){
    var s = state.series;
    if (kind === 'target'){
      var TARGET = { gmv: 132000 * state.range, orders: 470 * state.range, aov: 292, refundRate: 3.0 };
      return TARGET[key];
    }
    if (kind === 'dod'){
      var last = s[s.length - 1], prev = s[s.length - 2] || last;
      if (key === 'gmv') return prev.gmv;
      if (key === 'orders') return prev.orders;
      if (key === 'aov') return prev.gmv / prev.orders;
      return prev.refundRate;
    }
    // wow：与上一个等长区间比
    if (key === 'gmv') return sum(s, 'prev');
    if (key === 'orders') return Math.round(sum(s, 'prev') / (sum(s,'gmv') / sum(s,'orders')));
    if (key === 'aov') return sum(s,'prev') / Math.max(1, Math.round(sum(s,'prev') / (sum(s,'gmv')/sum(s,'orders'))));
    return s.reduce(function(a,b){ return a + b.refundRate; },0) / s.length * 1.08;
  }

  function setDelta(el, cur, base, opts){
    opts = opts || {};
    var diff = cur - base;
    var pct = base ? (diff / base * 100) : 0;
    var dir = Math.abs(pct) < 0.35 ? 'flat' : (diff > 0 ? 'up' : 'down');
    // 退款率上升是坏事，反转语义色
    var good = opts.inverse ? (diff < 0) : (diff > 0);
    el.dataset.dir = dir === 'flat' ? 'flat' : (good ? 'up' : 'down');
    el.textContent = (diff > 0 ? '+' : '') + pct.toFixed(1) + '%';
    el.setAttribute('aria-label',
      (good ? '优于' : '低于') + '基准 ' + Math.abs(pct).toFixed(1) + '%');
  }

  function renderKPI(){
    var s = state.series;
    var gmv = sum(s,'gmv'), ord = sum(s,'orders');
    var aov = gmv / ord;
    var ref = s.reduce(function(a,b){ return a + b.refundRate; },0) / s.length;

    var bGmv = baselineOf(gmv, state.base, 'gmv');
    var bOrd = baselineOf(ord, state.base, 'orders');
    var bAov = state.base === 'target' ? 292 : (bGmv / Math.max(1,bOrd));
    var bRef = baselineOf(ref, state.base, 'refundRate');

    $('kGmv').innerHTML = money(gmv);
    $('kOrd').textContent = ord.toLocaleString('zh-CN');
    $('kAov').innerHTML = money(Math.round(aov));
    $('kRef').innerHTML = ref.toFixed(1) + '<small>%</small>';

    setDelta($('dGmv'), gmv, bGmv);
    setDelta($('dOrd'), ord, bOrd);
    setDelta($('dAov'), aov, bAov);
    setDelta($('dRef'), ref, bRef, { inverse:true });

    var lbl = BASE_LABEL[state.base];
    $('bGmv').textContent = lbl + '基准 ' + money(Math.round(bGmv));
    $('bOrd').textContent = lbl + '基准 ' + Math.round(bOrd).toLocaleString('zh-CN') + ' 单';
    $('bAov').textContent = lbl + '基准 ' + money(Math.round(bAov));
    $('bRef').textContent = lbl + '基准 ' + bRef.toFixed(1) + '%';

    // 只有偏离超过阈值才给出下一步入口，而不是每张卡都挂一句
    hint($('hOrd'), ord, bOrd, '订单数', '流量与渠道', false);
    hint($('hAov'), aov, bAov, '客单价', '商品表现', false);
    hint($('hRef'), ref, bRef, '退款率', '退款明细', true);
  }

  function hint(el, cur, base, name, target, inverse){
    var pct = base ? (cur - base) / base * 100 : 0;
    var bad = inverse ? pct > 6 : pct < -6;
    if (!bad){ el.textContent = ''; el.style.display = 'none'; return; }
    el.style.display = '';
    el.textContent = name + '偏离超过 6%，';
    var a = document.createElement('button');
    a.type = 'button';
    a.textContent = '查看' + target;
    a.addEventListener('click', function(){
      alert('演示页面：这里会跳转到「' + target + '」并带上当前的时间范围与对比基准。');
    });
    el.appendChild(a);
  }

  /* ======================================================================
     主折线图
     ====================================================================== */
  function renderChart(){
    var host = $('chartGmv');
    var s = state.series;
    var W = 640, H = 190, P = { t:14, r:10, b:22, l:46 };

    var max = Math.max.apply(null, s.map(function(d){ return Math.max(d.gmv, d.prev); })) * 1.1;
    var min = 0;
    var iw = W - P.l - P.r, ih = H - P.t - P.b;

    function X(i){ return P.l + (s.length === 1 ? iw/2 : i / (s.length - 1) * iw); }
    function Y(v){ return P.t + ih - (v - min) / (max - min) * ih; }

    function path(key){
      return s.map(function(d,i){ return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(d[key]).toFixed(1); }).join(' ');
    }

    var ticks = 4, gy = '', gt = '';
    for (var t = 0; t <= ticks; t++){
      var v = min + (max - min) * t / ticks;
      var y = Y(v).toFixed(1);
      gy += '<line class="gridline" x1="' + P.l + '" y1="' + y + '" x2="' + (W - P.r) + '" y2="' + y + '"/>';
      gt += '<text class="axtxt" x="' + (P.l - 7) + '" y="' + (+y + 3.4) + '" text-anchor="end">' +
            (v >= 10000 ? (v/10000).toFixed(0) + '万' : Math.round(v)) + '</text>';
    }

    var xt = '';
    s.forEach(function(d,i){
      var every = s.length > 14 ? 5 : (s.length > 7 ? 2 : 1);
      if (i % every !== 0 && i !== s.length - 1) return;
      xt += '<text class="axtxt" x="' + X(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' +
            (d.date.getMonth()+1) + '/' + d.date.getDate() + '</text>';
    });

    host.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" ' +
      'aria-label="成交金额趋势折线图，实线为本期，虚线为对比基准">' +
        '<defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="#1e4a73" stop-opacity=".18"/>' +
          '<stop offset="100%" stop-color="#1e4a73" stop-opacity="0"/>' +
        '</linearGradient></defs>' +
        gy + gt + xt +
        '<line class="axis" x1="' + P.l + '" y1="' + (H - P.b) + '" x2="' + (W - P.r) + '" y2="' + (H - P.b) + '"/>' +
        '<path class="area" d="' + path('gmv') + ' L' + X(s.length-1) + ' ' + (H-P.b) + ' L' + X(0) + ' ' + (H-P.b) + ' Z"/>' +
        '<path class="serieB" d="' + path('prev') + '"/>' +
        '<path class="serieA" d="' + path('gmv') + '"/>' +
        '<line class="hoverline" id="hv" x1="0" y1="' + P.t + '" x2="0" y2="' + (H-P.b) + '" style="opacity:0"/>' +
        '<circle class="dot" id="hd" r="4" cx="0" cy="0" style="opacity:0"/>' +
      '</svg>';

    var svg = host.querySelector('svg');
    var tip = $('tip');

    function onMove(e){
      var r = svg.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width * W;
      var i = Math.round((px - P.l) / iw * (s.length - 1));
      i = Math.max(0, Math.min(s.length - 1, i));
      var d = s[i];
      var x = X(i), y = Y(d.gmv);
      var hv = host.querySelector('#hv'), hd = host.querySelector('#hd');
      hv.setAttribute('x1', x); hv.setAttribute('x2', x); hv.style.opacity = '1';
      hd.setAttribute('cx', x); hd.setAttribute('cy', y); hd.style.opacity = '1';

      tip.dataset.on = 'true';
      tip.style.left = (r.left + x / W * r.width) + 'px';
      tip.style.top = (r.top + y / H * r.height + window.scrollY) + 'px';
      tip.innerHTML = '<b>' + money(d.gmv) + '</b>' +
        '<span>' + (d.date.getMonth()+1) + '月' + d.date.getDate() + '日 · ' +
        d.orders + ' 单</span><span>基准 ' + money(d.prev) + '</span>';
    }
    function onLeave(){
      tip.dataset.on = 'false';
      host.querySelector('#hv').style.opacity = '0';
      host.querySelector('#hd').style.opacity = '0';
    }
    svg.addEventListener('pointermove', onMove);
    svg.addEventListener('pointerleave', onLeave);
  }

  /* ======================================================================
     渠道
     ====================================================================== */
  var CHANNELS = [
    { n:'直播间',   v:0.34, split:[0.42,0.44,0.14] },
    { n:'搜索',     v:0.26, split:[0.55,0.33,0.12] },
    { n:'短视频',   v:0.17, split:[0.63,0.28,0.09] },
    { n:'私域社群', v:0.14, split:[0.16,0.61,0.23] },
    { n:'站外投放', v:0.09, split:[0.78,0.16,0.06] }
  ];

  function renderChannels(){
    var total = sum(state.series,'gmv');
    var host = $('chanList');
    host.textContent = '';
    var maxV = Math.max.apply(null, CHANNELS.map(function(c){ return c.v; }));

    CHANNELS.forEach(function(c){
      var row = document.createElement('div');
      row.className = 'chan__row';

      var name = document.createElement('span');
      name.className = 'chan__name';
      name.textContent = c.n;

      var barWrap = document.createElement('span');
      barWrap.className = 'chan__bar';
      barWrap.style.width = (c.v / maxV * 100).toFixed(1) + '%';
      var cols = ['var(--c1)','var(--c3)','var(--c5)'];
      c.split.forEach(function(p, i){
        var seg = document.createElement('i');
        seg.style.width = (p * 100).toFixed(1) + '%';
        seg.style.background = cols[i];
        barWrap.appendChild(seg);
      });

      var outer = document.createElement('span');
      outer.style.width = '100%';
      outer.appendChild(barWrap);
      barWrap.style.maxWidth = '100%';

      var val = document.createElement('span');
      val.className = 'chan__val';
      val.textContent = money(Math.round(total * c.v));

      row.setAttribute('role','img');
      row.setAttribute('aria-label',
        c.n + '：' + money(Math.round(total*c.v)) + '，占比 ' + (c.v*100).toFixed(0) +
        '%，其中新客 ' + (c.split[0]*100).toFixed(0) + '%');

      row.appendChild(name); row.appendChild(outer); row.appendChild(val);
      host.appendChild(row);
    });
  }

  /* ======================================================================
     漏斗
     ====================================================================== */
  function renderFunnel(){
    var ord = sum(state.series,'orders');
    var steps = [
      { n:'访问',     v: Math.round(ord * 41.5), drop:null },
      { n:'商品详情', v: Math.round(ord * 18.2), drop:-4.1 },
      { n:'加入购物车', v: Math.round(ord * 5.6), drop:-9.8 },
      { n:'提交订单', v: Math.round(ord * 1.34), drop:-2.2 },
      { n:'支付完成', v: ord,                    drop:-1.1 }
    ];
    var worst = steps.reduce(function(a,b){
      return (b.drop !== null && (!a || b.drop < a.drop)) ? b : a;
    }, null);

    var host = $('funnel');
    host.textContent = '';
    steps.forEach(function(s, i){
      var el = document.createElement('div');
      el.className = 'step';
      if (s === worst) el.dataset.worst = 'true';

      var fill = document.createElement('span');
      fill.className = 'step__fill';
      fill.style.width = (s.v / steps[0].v * 100).toFixed(1) + '%';

      var inn = document.createElement('span');
      inn.className = 'step__in';
      var b = document.createElement('b'); b.textContent = s.n;
      var n = document.createElement('span'); n.className = 'n';
      n.textContent = s.v.toLocaleString('zh-CN');
      inn.appendChild(b); inn.appendChild(n);

      var rate = document.createElement('span');
      rate.className = 'step__rate';
      if (i === 0){
        rate.textContent = '起点';
      } else {
        var conv = (s.v / steps[i-1].v * 100).toFixed(1);
        rate.innerHTML = '转化 <b>' + conv + '%</b>　' +
          BASE_LABEL[state.base] + ' <b>' + (s.drop > 0 ? '+' : '') + s.drop + ' pt</b>';
      }

      el.appendChild(fill); el.appendChild(inn); el.appendChild(rate);
      host.appendChild(el);
    });
  }

  /* ======================================================================
     订单表
     ====================================================================== */
  var ITEMS = ['禾野 冷萃壶 600ml','禾野 手冲滤杯 01','禾野 双层玻璃杯 ×2','禾野 咖啡豆 埃塞 200g',
               '禾野 电子秤 Pro','禾野 手摩磨豆机','禾野 保温提壶 400ml','禾野 滤纸 100 张'];
  var NAMES = ['周*明','李*华','陈*一','赵*安','孙*婷','吴*波','郑*可','王*林','刘*洋','黄*'];
  var CH = ['直播间','搜索','短视频','私域社群','站外投放'];
  var ST = ['pending','paid','shipped','refund'];
  var ST_TXT = { pending:'待付款', paid:'已付款', shipped:'已发货', refund:'退款中' };

  var ORDERS = (function(){
    var rnd = mk(777001);
    var out = [];
    for (var i = 0; i < 46; i++){
      var d = new Date();
      d.setDate(d.getDate() - Math.floor(rnd() * 7));
      d.setHours(Math.floor(rnd()*24), Math.floor(rnd()*60), 0, 0);
      var qty = 1 + Math.floor(rnd() * 4);
      out.push({
        id: 'PS' + (20260800000 + Math.floor(rnd() * 899999)),
        time: d,
        item: ITEMS[Math.floor(rnd() * ITEMS.length)],
        who: NAMES[Math.floor(rnd() * NAMES.length)],
        chan: CH[Math.floor(rnd() * CH.length)],
        status: ST[Math.floor(rnd() * (rnd() > .82 ? 4 : 3))],
        qty: qty,
        amt: Math.round((88 + rnd() * 460) * qty)
      });
    }
    return out;
  })();

  function filtered(){
    var q = state.q.trim().toLowerCase();
    return ORDERS.filter(function(o){
      if (state.status !== 'all' && o.status !== state.status) return false;
      if (!q) return true;
      return (o.id + o.item + o.who).toLowerCase().indexOf(q) !== -1;
    }).sort(function(a,b){
      var k = state.sortK, dir = state.sortDir === 'asc' ? 1 : -1;
      var va = a[k], vb = b[k];
      if (k === 'time'){ return (va - vb) * dir; }
      if (typeof va === 'number'){ return (va - vb) * dir; }
      return String(va).localeCompare(String(vb), 'zh-CN') * dir;
    });
  }

  function renderTable(){
    var rows = filtered();
    var pages = Math.max(1, Math.ceil(rows.length / state.per));
    if (state.page > pages) state.page = pages;
    var slice = rows.slice((state.page - 1) * state.per, state.page * state.per);

    var tb = $('tbody');
    tb.textContent = '';

    if (!slice.length){
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.colSpan = 9; td.className = 'empty';
      td.textContent = state.q ? ('没有匹配「' + state.q + '」的订单。换个关键词，或清空状态筛选。')
                               : '当前筛选下没有订单。';
      tr.appendChild(td); tb.appendChild(tr);
    } else {
      slice.forEach(function(o){
        var tr = document.createElement('tr');
        if (state.sel[o.id]) tr.dataset.sel = 'true';

        var c0 = document.createElement('td');
        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = !!state.sel[o.id];
        cb.setAttribute('aria-label', '选择订单 ' + o.id);
        cb.addEventListener('change', function(){
          if (cb.checked) state.sel[o.id] = true; else delete state.sel[o.id];
          renderTable(); renderBulk();
        });
        c0.appendChild(cb);

        var c1 = document.createElement('td'); c1.className = 'mono'; c1.textContent = o.id;
        var c2 = document.createElement('td'); c2.className = 'mono';
        c2.textContent = (o.time.getMonth()+1) + '/' + o.time.getDate() + ' ' +
                         pad(o.time.getHours()) + ':' + pad(o.time.getMinutes());
        var c3 = document.createElement('td');
        c3.innerHTML = '';
        var it = document.createElement('span'); it.textContent = o.item;
        var wh = document.createElement('span');
        wh.style.cssText = 'display:block;color:var(--ink-3);font-size:.75rem';
        wh.textContent = o.who;
        c3.appendChild(it); c3.appendChild(wh);

        var c4 = document.createElement('td'); c4.textContent = o.chan;
        var c5 = document.createElement('td');
        var chip = document.createElement('span');
        chip.className = 'chip'; chip.dataset.s = o.status;
        chip.textContent = ST_TXT[o.status];
        c5.appendChild(chip);
        var c6 = document.createElement('td'); c6.className = 'num'; c6.textContent = o.qty;
        var c7 = document.createElement('td'); c7.className = 'num'; c7.textContent = money(o.amt);
        var c8 = document.createElement('td');
        var act = document.createElement('button');
        act.className = 'rowact'; act.type = 'button';
        act.textContent = o.status === 'paid' ? '发货' : '详情';
        act.setAttribute('aria-label', act.textContent + ' 订单 ' + o.id);
        c8.appendChild(act);

        [c0,c1,c2,c3,c4,c5,c6,c7,c8].forEach(function(c){ tr.appendChild(c); });
        tb.appendChild(tr);
      });
    }

    $('tblCount').textContent = '共 ' + rows.length + ' 单' +
      (state.status === 'all' ? '' : ' · ' + ST_TXT[state.status]);
    $('pageInfo').textContent = '第 ' + state.page + ' / ' + pages + ' 页，每页 ' + state.per + ' 条';

    var pg = $('pager'); pg.textContent = '';
    function btn(label, page, dis, cur){
      var b = document.createElement('button');
      b.className = 'pgbtn'; b.type = 'button'; b.textContent = label;
      if (dis) b.setAttribute('aria-disabled','true');
      if (cur) b.setAttribute('aria-current','page');
      b.addEventListener('click', function(){ state.page = page; renderTable(); });
      pg.appendChild(b);
    }
    btn('‹', Math.max(1, state.page - 1), state.page === 1);
    for (var p = 1; p <= pages; p++){
      if (pages > 7 && p > 2 && p < pages - 1 && Math.abs(p - state.page) > 1) {
        if (p === 3) { var e = document.createElement('span'); e.textContent = '…'; e.style.padding = '0 .2rem'; pg.appendChild(e); }
        continue;
      }
      btn(String(p), p, false, p === state.page);
    }
    btn('›', Math.min(pages, state.page + 1), state.page === pages);

    var all = slice.length > 0 && slice.every(function(o){ return state.sel[o.id]; });
    $('selAll').checked = all;
    $('selAll').indeterminate = !all && slice.some(function(o){ return state.sel[o.id]; });
  }

  function renderBulk(){
    var n = Object.keys(state.sel).length;
    $('bulk').dataset.on = String(n > 0);
    $('bulkN').textContent = n;
  }

  $('selAll').addEventListener('change', function(){
    var rows = filtered().slice((state.page - 1) * state.per, state.page * state.per);
    rows.forEach(function(o){
      if ($('selAll').checked) state.sel[o.id] = true; else delete state.sel[o.id];
    });
    renderTable(); renderBulk();
  });
  $('bulkClear').addEventListener('click', function(){ state.sel = {}; renderTable(); renderBulk(); });
  $('bulkShip').addEventListener('click', function(){
    var n = Object.keys(state.sel).length;
    alert('演示页面：这里会把选中的 ' + n + ' 单提交发货，并在成功后刷新表格。');
  });

  document.querySelectorAll('th[data-k] button').forEach(function(b){
    b.addEventListener('click', function(){
      var th = b.closest('th'), k = th.dataset.k;
      if (state.sortK === k) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else { state.sortK = k; state.sortDir = 'desc'; }
      document.querySelectorAll('th[data-k]').forEach(function(x){ x.removeAttribute('aria-sort'); });
      th.setAttribute('aria-sort', state.sortDir === 'asc' ? 'ascending' : 'descending');
      state.page = 1;
      renderTable();
    });
  });

  var qTimer = null;
  $('q').addEventListener('input', function(){
    clearTimeout(qTimer);
    var v = this.value;
    qTimer = setTimeout(function(){ state.q = v; state.page = 1; renderTable(); }, 180);
  });

  $('statusSeg').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    state.status = b.dataset.s; state.page = 1;
    Array.prototype.forEach.call(this.children, function(x){
      x.setAttribute('aria-pressed', String(x.dataset.s === state.status));
    });
    renderTable();
  });

  /* ======================================================================
     顶栏控制
     ====================================================================== */
  $('rangeSeg').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    state.range = +b.dataset.range;
    Array.prototype.forEach.call(this.children, function(x){
      x.setAttribute('aria-pressed', String(+x.dataset.range === state.range));
    });
    refresh();
  });

  $('baseSel').addEventListener('change', function(){
    state.base = this.value;
    renderKPI(); renderFunnel(); renderMeta();
  });

  $('refreshBtn').addEventListener('click', refresh);
  $('exportBtn').addEventListener('click', function(){
    var rows = filtered();
    alert('演示页面：这里会导出当前筛选下的 ' + rows.length + ' 条订单为 CSV。');
  });

  $('collapse').addEventListener('click', function(){
    var s = $('side');
    var c = s.dataset.collapsed !== 'true';
    s.dataset.collapsed = String(c);
    this.setAttribute('aria-label', c ? '展开侧边栏' : '折叠侧边栏');
  });
  $('mobBtn').addEventListener('click', function(){
    var s = $('side');
    s.dataset.open = String(s.dataset.open !== 'true');
  });

  function renderMeta(){
    var s = state.series;
    var a = s[0].date, b = s[s.length-1].date;
    $('metaRange').textContent = '统计区间 ' +
      (a.getMonth()+1) + '.' + a.getDate() + ' – ' + (b.getMonth()+1) + '.' + b.getDate() +
      '（' + state.range + ' 天）';
    $('metaBase').textContent = '对比基准 ' + BASE_LABEL[state.base];
    var n = new Date();
    $('metaTime').textContent = '数据更新于 ' + pad(n.getHours()) + ':' + pad(n.getMinutes());
  }

  function refresh(){
    state.series = buildSeries(state.range);
    renderKPI(); renderChart(); renderChannels(); renderFunnel(); renderMeta();
  }

  /* 启动 */
  refresh();
  renderTable();
  renderBulk();
  window.addEventListener('resize', function(){ renderChart(); });
})();
</script>

</body>
</html>
