<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瓶中沧海 · SEA IN A BOTTLE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#0c0a08;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
#app{position:fixed;inset:0}
canvas{display:block}
#veil{position:fixed;inset:0;background:#0c0a08;z-index:40;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#cfc2a8;transition:opacity .9s;visibility:visible}
#veil.done{opacity:0;visibility:hidden}
#veil b{font-size:clamp(20px,3.4vw,30px);letter-spacing:.6em;text-indent:.6em;font-family:Georgia,"Songti SC",serif}
#veil i{font-style:normal;width:130px;height:2px;background:rgba(207,194,168,.15);position:relative;overflow:hidden;border-radius:2px}
#veil i::after{content:"";position:absolute;inset:0;width:40%;background:#c9a86a;animation:ld 1.1s infinite}
@keyframes ld{from{transform:translateX(-110%)}to{transform:translateX(280%)}}
#hud{
  position:fixed;left:22px;bottom:20px;z-index:20;color:#c9bda4;font-size:11.5px;line-height:2.1;letter-spacing:.1em;
  background:rgba(12,10,8,.6);border:1px solid rgba(201,168,106,.2);border-radius:14px;padding:12px 17px;
  backdrop-filter:blur(8px);pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.8);
}
#hud b{color:#e8c98a;font-weight:600}
#hud .key{border:1px solid rgba(201,168,106,.45);border-radius:5px;padding:0 6px;font-family:Consolas,monospace}
#title{position:fixed;right:24px;top:22px;z-index:20;text-align:right;pointer-events:none}
#title b{display:block;color:#e6d6b4;font-size:17px;letter-spacing:.42em;font-family:Georgia,"Songti SC",serif;text-shadow:0 2px 12px rgba(0,0,0,.8)}
#title span{font-size:10px;letter-spacing:.3em;color:#8f8470}
#speed{
  position:fixed;right:22px;bottom:20px;z-index:20;display:flex;gap:4px;
  background:rgba(12,10,8,.6);border:1px solid rgba(201,168,106,.2);border-radius:13px;padding:5px;backdrop-filter:blur(8px);
}
#speed button{
  font:inherit;font-size:12px;letter-spacing:.1em;color:#b9ad92;border:none;background:none;
  padding:8px 14px;border-radius:9px;cursor:pointer;transition:.16s;
}
#speed button:hover{color:#f0e4c8;background:rgba(255,255,255,.06)}
#speed button.on{background:linear-gradient(135deg,#c9a86a,#a8823e);color:#241c0c;font-weight:700}
@media (max-width:640px){#hud{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="veil"><b>瓶中沧海</b><i></i></div>
<div id="title"><b>瓶中沧海</b><span>SEA IN A BOTTLE · 三桅帆船 · 环岛航行</span></div>
<div id="hud">
  <b>拖动</b> 环视 · <b>滚轮</b> 推近 · 闲置自动旋转<br>
  <b>按住 <span class="key">SPACE</span></b> 掀起风暴 —— 瓶摇，海不摇<br>
  <b>右下角</b> 延时摄影：昼夜流转 ×4 / ×12
</div>
<div id="speed" role="group" aria-label="时间流速">
  <button data-v="0">⏸ 暂停</button>
  <button data-v="1" class="on">×1</button>
  <button data-v="4">×4</button>
  <button data-v="12">×12</button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   基础舞台
   ============================================================ */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.05,50);
camera.position.set(1.6,.78,2.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(.1,.42,0);
controls.enableDamping=true;controls.dampingFactor=.06;
controls.minDistance=1.2;controls.maxDistance=5.5;
controls.maxPolarAngle=Math.PI*.54;
controls.autoRotate=true;controls.autoRotateSpeed=.7;
controls.addEventListener('start',()=>{controls.autoRotate=false;idleT=0});

const hemi=new THREE.HemisphereLight(0xd8c4a8,0x2c241a,.55);scene.add(hemi);
const roomSun=new THREE.DirectionalLight(0xffd9a8,1.6);
roomSun.position.set(-3,2.6,2.4);roomSun.castShadow=true;
roomSun.shadow.mapSize.set(2048,2048);
roomSun.shadow.camera.left=-2.5;roomSun.shadow.camera.right=2.5;
roomSun.shadow.camera.top=2;roomSun.shadow.camera.bottom=-1;
scene.add(roomSun);
scene.add(new THREE.AmbientLight(0x38302a,.7));
/* 瓶内小世界灯光 */
const seaLight=new THREE.PointLight(0x88c8ff,0,2.2);scene.add(seaLight);
const lampLight=new THREE.PointLight(0xffb35c,0,1.1);scene.add(lampLight);
const beaconLight=new THREE.PointLight(0xfff2cc,0,1.6);scene.add(beaconLight);

/* ============================================================
   书房：桌面 / 旧书 / 望远镜 / 托架
   ============================================================ */
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:o.r??.8,metalness:o.m??.05,...(o.e?{emissive:o.e,emissiveIntensity:o.ei??1}:{})});
function box(w,h,d,mat,x=0,y=0,z=0,parent=scene,shadow=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);if(shadow){m.castShadow=true;m.receiveShadow=true}
  parent.add(m);return m;
}
const deskY=0;
const desk=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.6,.08,48),M(0x6e4c2c,{r:.72}));
desk.position.y=deskY;desk.receiveShadow=true;scene.add(desk);
/* 背景暖房光晕 */
scene.background=new THREE.Color(0x191410);
scene.fog=new THREE.Fog(0x191410,4.5,9);
/* 旧书 */
const book=new THREE.Group();book.position.set(-.95,deskY+.045,.62);book.rotation.y=.5;scene.add(book);
box(.46,.05,.32,M(0x7a3c2c,{r:.8}),0,0,0,book);
box(.43,.055,.29,M(0xe8dcc0,{r:.9}),0,.05,0,book);
box(.02,.06,.29,M(0x8a4a38),.225,.005,0,book,false);
/* 黄铜望远镜 */
const scope=new THREE.Group();scope.position.set(.9,deskY+.09,.66);scope.rotation.set(0,-.7,-.18);scene.add(scope);
const brass=M(0xb08c3c,{m:.9,r:.3});
const tube=new THREE.Mesh(new THREE.CylinderGeometry(.05,.062,.5,18),brass);
tube.rotation.z=Math.PI/2;tube.castShadow=true;scope.add(tube);
const eyep=new THREE.Mesh(new THREE.CylinderGeometry(.032,.045,.1,14),brass);
eyep.rotation.z=Math.PI/2;eyep.position.x=.29;scope.add(eyep);
[-.14,.02].forEach(x=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(.056,.008,8,20),M(0x8a6a2c,{m:.9,r:.35}));ring.rotation.y=Math.PI/2;ring.position.x=x;scope.add(ring)});
const tripod=box(.02,.16,.02,brass,.05,-.11,.03,scope);
/* 瓶托架 */
const cradle=new THREE.Group();cradle.position.set(.1,deskY,0);scene.add(cradle);
const cradleMat=M(0x5e4023,{r:.75});
box(1.9,.05,.5,cradleMat,0,.03,0,cradle);
[-.62,.62].forEach(x=>{
  const sup=new THREE.Mesh(new THREE.CylinderGeometry(.13,.15,.14,18,1,true,Math.PI,Math.PI),cradleMat);
  sup.position.set(x,.12,0);sup.castShadow=true;sup.receiveShadow=true;cradle.add(sup);
});

/* ============================================================
   瓶体（自定义 shader 玻璃）+ 木塞 + 蜡封 + 吊牌
   ============================================================ */
const BOTTLE_LEN=2.2, BOTTLE_R=.5;
const bottleGroup=new THREE.Group();
bottleGroup.position.set(.1,deskY+.4,0);
scene.add(bottleGroup);
/* 轮廓（x: -1.1 瓶底 → +1.1 瓶口），lathe 绕 y 生成后躺倒 */
const profile=[];
for(let i=0;i<=40;i++){
  const t=i/40, x=(t-.5)*BOTTLE_LEN;      // -1.1..1.1
  let r;
  if(x<-.95)r=BOTTLE_R*.72;                       // 底肩
  else if(x<-.8)r=BOTTLE_R*(.72+(x+.95)/.15*.28); // 底部收弧
  else if(x<.42)r=BOTTLE_R;                       // 主体
  else if(x<.62)r=BOTTLE_R*(1-(x-.42)/.2*.62);    // 肩
  else r=BOTTLE_R*.38-((x-.62)/.48)*BOTTLE_R*.1;  // 颈
  profile.push(new THREE.Vector2(Math.max(r,.06),x));
}
profile.push(new THREE.Vector2(.14,1.12));
const glassGeo=new THREE.LatheGeometry(profile,64);
glassGeo.rotateZ(-Math.PI/2);   /* +y → +x：瓶口朝右 */
const glassUniforms={
  uTime:{value:0},
  uTint:{value:new THREE.Color(0x9fd8e8)},
  uWarm:{value:new THREE.Color(0xffd9a8)},
};
const glassMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,side:THREE.DoubleSide,
  uniforms:glassUniforms,
  vertexShader:`
    varying vec3 vN; varying vec3 vP;
    void main(){
      vN=normalize(normalMatrix*normal);
      vec4 wp=modelMatrix*vec4(position,1.);
      vP=wp.xyz;
      gl_Position=projectionMatrix*viewMatrix*wp;
    }`,
  fragmentShader:`
    uniform vec3 uTint; uniform vec3 uWarm; uniform float uTime;
    varying vec3 vN; varying vec3 vP;
    void main(){
      vec3 V=normalize(cameraPosition-vP);
      float fres=pow(1.-abs(dot(normalize(vN),V)),2.6);
      float band=sin(vP.y*42.+uTime*.6)*.5+.5;         /* 玻璃纵向高光条 */
      float spec=pow(max(dot(normalize(vN),normalize(vec3(.6,.8,.5))),0.),24.);
      vec3 col=mix(uTint,uWarm,fres*.6);
      float a=fres*.55+spec*.5+band*.05;
      gl_FragColor=vec4(col+vec3(spec),clamp(a,.03,.85));
    }`
});
const glass=new THREE.Mesh(glassGeo,glassMat);
glass.renderOrder=30;         /* 最后画玻璃 */
bottleGroup.add(glass);
/* 瓶内轮廓约束（世界 x 相对瓶心） */
function innerClamp(p){ /* p: Vector3（瓶组局部坐标） */
  const R=BOTTLE_R-.075;
  const x=p.x;
  let rMax=R;
  if(x>.28)rMax=R-(x-.28)/.34*(R-.16);   /* 靠近瓶肩收窄 */
  if(x>.68)rMax=.13;                     /* 瓶颈 */
  const len=Math.hypot(p.y,p.z);
  if(len>rMax){const s=rMax/len;p.y*=s;p.z*=s}
  p.x=Math.max(-1.02,Math.min(1.02,p.x));
  return p;
}
/* 木塞 + 红蜡封 + 吊牌 */
box(.14,.11,.14,M(0xc8a06a,{r:.9}),1.18,.02,0,bottleGroup);
const wax=new THREE.Mesh(new THREE.CylinderGeometry(.085,.105,.05,18),M(0xb03228,{r:.55}));
wax.rotation.z=Math.PI/2;wax.position.set(1.09,0,0);wax.castShadow=true;bottleGroup.add(wax);
/* 颈绳 */
const ropeMat=new THREE.MeshStandardMaterial({color:0xc8b088,roughness:.9});
for(let i=0;i<5;i++){
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.115-i*.004,.006,6,16),ropeMat);
  ring.rotation.y=Math.PI/2;ring.position.set(1.02-i*.012,0,0);bottleGroup.add(ring);
}
/* 吊牌 */
const tag=new THREE.Group();tag.position.set(1.04,-.18,.06);tag.rotation.z=.5;bottleGroup.add(tag);
const tagCord=new THREE.Mesh(new THREE.CylinderGeometry(.004,.004,.2,6),ropeMat);
tagCord.position.y=.1;tag.add(tagCord);
box(.12,.08,.008,M(0xe8dcc0,{r:.9}),0,-.05,0,tag);
box(.1,.005,.01,M(0x8a6a4c),0,-.05,.006,tag,false);

/* ============================================================
   海：浪面 shader + 深水体 shader
   ============================================================ */
const SEA_Y=.06;
let stormK=0;        /* 0 平静 → 1 风暴 */
const oceanUniforms={
  uTime:{value:0},uAmp:{value:.014},uStorm:{value:0},
  uCrest:{value:new THREE.Color(0xdff4ff)},
  uDeep:{value:new THREE.Color(0x0a3d66)},
  uShallow:{value:new THREE.Color(0x1e78b0)},
};
/* 与 JS 侧完全一致的波高函数（四点采样浮力用） */
function waveH(x,z,t){
  const A=oceanUniforms.uAmp.value*(1+stormK*3.2);
  return Math.sin(x*7.5+t*1.7)*A + Math.sin(z*9.3-t*1.35)*A*.7
       + Math.sin((x+z)*5.1+t*2.2)*A*.45*(1+stormK*1.6);
}
const waterGeo=new THREE.PlaneGeometry(1.91,.87,110,50);
const waterMat=new THREE.ShaderMaterial({
  transparent:true,
  uniforms:oceanUniforms,
  vertexShader:`
    uniform float uTime; uniform float uAmp; uniform float uStorm;
    varying vec3 vP; varying float vH;
    float wH(vec2 p,float t){
      float A=uAmp*(1.+uStorm*3.2);
      return sin(p.x*7.5+t*1.7)*A + sin(p.y*9.3-t*1.35)*A*.7
           + sin((p.x+p.y)*5.1+t*2.2)*A*.45*(1.+uStorm*1.6);
    }
    void main(){
      vec3 pos=position;
      float h=wH(pos.xy,uTime);
      pos.z+=h;                      /* plane 尚未旋转，z 即未来的上方向 */
      vH=h;
      vec4 wp=modelMatrix*vec4(pos,1.);
      vP=wp.xyz;
      gl_Position=projectionMatrix*viewMatrix*wp;
    }`,
  fragmentShader:`
    uniform vec3 uCrest; uniform vec3 uDeep; uniform vec3 uShallow; uniform float uStorm;
    varying vec3 vP; varying float vH;
    void main(){
      float crest=smoothstep(.012,.045,vH+uStorm*.03);
      float edge=smoothstep(.42,.05,abs(vP.x-.05));       /* 越靠瓶壁越深 */
      vec3 col=mix(uShallow,uDeep,edge*.8);
      col=mix(col,uCrest,crest*.85);
      float sparkle=pow(max(sin(vP.x*160.+vP.z*140.)*sin(vP.z*130.),0.),8.)*.12;
      /* 贴瓶渐隐：右端进颈、两侧沿壁收 */
      float sideFade=1.-smoothstep(.35,.428,abs(vP.z));
      float headFade=1.-smoothstep(.6,.94,vP.x-.05);
      float a=(.72+crest*.2)*sideFade*headFade;
      if(a<.01)discard;
      gl_FragColor=vec4(col+sparkle,a);
    }`
});
const water=new THREE.Mesh(waterGeo,waterMat);
water.rotation.x=-Math.PI/2;
water.position.set(.045,SEA_Y,0);
bottleGroup.add(water);
const waterSpin=new THREE.Group();       /* 风暴时抵消瓶体摇晃，保持水面水平 */
waterSpin.add(water);bottleGroup.add(waterSpin);
/* 深水体：半透明渐变，无海床；片元贴瓶渐隐避免穿壁 */
const deepMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,
  uniforms:{uTop:{value:new THREE.Color(0x1e78b0)},uBot:{value:new THREE.Color(0x03203c)}},
  vertexShader:`varying vec3 vP;void main(){vec4 wp=modelMatrix*vec4(position,1.);vP=wp.xyz;gl_Position=projectionMatrix*viewMatrix*wp;}`,
  fragmentShader:`
    uniform vec3 uTop; uniform vec3 uBot;
    varying vec3 vP;
    void main(){
      float k=smoothstep(.06,-.42,vP.y);
      float sideFade=1.-smoothstep(.34,.425,abs(vP.z));
      float headFade=1.-smoothstep(.2,.52,vP.x-.05);
      float botFade=1.-smoothstep(-.5,-.43,vP.y);
      float a=.82*sideFade*headFade*botFade;
      if(a<.01)discard;
      gl_FragColor=vec4(mix(uTop,uBot,k),a);
    }`
});
const deepGeo=new THREE.BoxGeometry(1.9,.5,.86);
const deep=new THREE.Mesh(deepGeo,deepMat);
deep.position.set(-.06,-.19,0);
deep.renderOrder=5;
bottleGroup.add(deep);

/* ============================================================
   珊瑚岛 + 灯塔 + 村落 + 码头
   ============================================================ */
const island=new THREE.Group();island.position.set(-.34,-.02,0);bottleGroup.add(island);
/* 砂丘（两层锥台，紧凑不越航线） */
const sand=new THREE.Mesh(new THREE.ConeGeometry(.28,.28,20),M(0xd8c496,{r:.9}));
sand.position.y=.02;sand.castShadow=true;sand.receiveShadow=true;island.add(sand);
const sand2=new THREE.Mesh(new THREE.ConeGeometry(.16,.18,16),M(0xe0d0a2,{r:.9}));
sand2.position.set(.05,.1,.04);island.add(sand2);
/* 岛缘礁石 */
for(let i=0;i<7;i++){
  const a=i/7*Math.PI*2;
  const rock=box(.05,.035,.05,M(0x8a8072,{flat:true}),Math.cos(a)*.2,.05,Math.sin(a)*.22,island);
  rock.rotation.set(Math.random(),a,Math.random());
}
/* 灯塔（红白条纹） */
const lighthouse=new THREE.Group();lighthouse.position.set(-.06,.18,.02);island.add(lighthouse);
const stripeMatW=M(0xf2ece0,{r:.6}),stripeMatR=M(0xc0392b,{r:.6});
for(let i=0;i<6;i++){
  const seg=new THREE.Mesh(new THREE.CylinderGeometry(.052-i*.003,.055-i*.003,.032,16),i%2?stripeMatW:stripeMatR);
  seg.position.y=.02+i*.032;seg.castShadow=true;lighthouse.add(seg);
}
const lanternRoom=new THREE.Mesh(new THREE.CylinderGeometry(.036,.04,.03,14),M(0x2c3138,{r:.4,m:.4}));
lanternRoom.position.y=.22;lighthouse.add(lanternRoom);
const lampBulb=new THREE.Mesh(new THREE.SphereGeometry(.02,10,10),M(0xfff2cc,{e:0xffe9b0,ei:2}));
lampBulb.position.y=.225;lighthouse.add(lampBulb);
const roofCone=new THREE.Mesh(new THREE.ConeGeometry(.045,.035,14),M(0x8a2f22));
roofCone.position.y=.255;lighthouse.add(roofCone);
/* 旋转光束（两束反向半透明扇面） */
const beamMat=new THREE.MeshBasicMaterial({color:0xfff2cc,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending});
const beamGeo=new THREE.ConeGeometry(.055,.65,14,1,true);
const beam1=new THREE.Mesh(beamGeo,beamMat);
beam1.rotation.z=Math.PI/2;beam1.position.set(.32,0,0);
const beaconSpin=new THREE.Group();beaconSpin.position.y=.225;lighthouse.add(beaconSpin);
beaconSpin.add(beam1);
const beam2=beam1.clone();beam2.rotation.z=-Math.PI/2;beam2.position.x=-.32;beaconSpin.add(beam2);
beaconLight.position.set(-.4,deskY+.85,.02);
/* 棕榈 ×2 */
function palm(x,z,s=1){
  const g=new THREE.Group();g.position.set(x,.16,z);g.scale.setScalar(s);island.add(g);
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.006,.012,.2,6),M(0x8a6a44));
  trunk.position.y=.1;trunk.rotation.z=.12;trunk.castShadow=true;g.add(trunk);
  for(let i=0;i<6;i++){
    const leaf=box(.09,.006,.024,M(0x3e7c4a,{r:.8}),0,0,0,g);
    const a=i/6*Math.PI*2;
    leaf.position.set(Math.cos(a)*.05,.2+Math.sin(a*2)*.004,Math.sin(a)*.05);
    leaf.rotation.y=-a;leaf.rotation.z=-.35;
  }
}
palm(-.14,.07,1.1);palm(.13,-.05,.85);
/* 渔民小屋（暖窗） */
const hutWin=new THREE.MeshStandardMaterial({color:0x443,emissive:0xffb35c,emissiveIntensity:0});
const hut=new THREE.Group();hut.position.set(-.12,.2,-.12);hut.rotation.y=.4;island.add(hut);
box(.11,.07,.08,M(0xd8c8a8,{r:.85}),0,.035,0,hut);
const hutRoof=new THREE.Mesh(new THREE.ConeGeometry(.09,.05,4),M(0x8a5c3c));
hutRoof.position.y=.085;hutRoof.rotation.y=Math.PI/4;hutRoof.castShadow=true;hut.add(hutRoof);
box(.02,.024,.005,hutWin,0,.036,.041,hut,false);
lampLight.position.set(-.46,deskY+.62,-.12);
/* 码头 + 小艇 */
const pier=new THREE.Group();pier.position.set(.2,.07,.16);island.add(pier);
box(.16,.006,.035,M(0x8a6a44),.06,0,0,pier);
[.0,.06,.12].forEach(x=>box(.008,.03,.008,M(0x6a4c2c),x,-.017,0,pier));
const dinghy=new THREE.Group();dinghy.position.set(.34,.015,.3);dinghy.rotation.y=-.6;island.add(dinghy);
const dh=new THREE.Mesh(new THREE.CylinderGeometry(.02,.014,.07,8,1,true,0,Math.PI),M(0xc8b088,{r:.85,side:THREE.DoubleSide}));

function sailTexture(striped){
  const cv=document.createElement('canvas');cv.width=128;cv.height=128;
  const c=cv.getContext('2d');
  c.fillStyle=striped?'#f2ead8':'#f5efe2';c.fillRect(0,0,128,128);
  if(striped){
    c.fillStyle='#c0392b';
    for(let i=0;i<4;i++)c.fillRect(0,14+i*30,128,14);
  }
  c.strokeStyle='rgba(120,90,50,.5)';c.lineWidth=3;
  c.beginPath();c.moveTo(0,2);c.lineTo(128,2);c.moveTo(0,126);c.lineTo(128,126);c.stroke();
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t;
}

function skyAt(t){ /* 四段插值 */
  const seg=t*4%1, idx=Math.floor(t*4)%4;
  const keys=[SKY.dawn,SKY.noon,SKY.dusk,SKY.night];
  const fogs=[FOG.dawn,FOG.noon,FOG.dusk,FOG.night];
  const k=seg*seg*(3-2*seg);
  return{sky:keys[idx].clone().lerp(keys[(idx+1)%4],k),fog:fogs[idx].clone().lerp(fogs[(idx+1)%4],k),
    night:(t>.62&&t<.95)?1:(t<.06?1:0)};
}

/* ============================================================
   主循环
   ============================================================ */
const clock=new THREE.Clock();
let idleT=0;
const V=new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  const t=clock.elapsedTime;
  oceanUniforms.uTime.value=t;
  glassUniforms.uTime.value=t;
  /* 风暴过渡 */
  const target=stormOn?1:0;
  stormK+=(target-stormK)*Math.min(1,dt*2.4);
  oceanUniforms.uStorm.value=stormK;
  /* 闲置自动旋转 */
  if(!controls.autoRotate){
    idleT+=dt;
    if(idleT>3)controls.autoRotate=true;
  }
  /* 延时摄影昼夜 */
  dayT=(dayT+dt*daySpeed*.008)%1;
  const sky=skyAt(dayT);
  scene.background=sky.sky;
  scene.fog.color=sky.fog;
  const nightK=sky.night;
  starMat.opacity=nightK*(1-stormK*.8);
  /* 太阳月亮绕转 */
  const sa=dayT*Math.PI*2-Math.PI/2;
  sunMesh.position.set(Math.cos(sa)*2.4,Math.sin(sa)*1.8+.5,1.5);
  moonMesh.position.set(Math.cos(sa+Math.PI)*2.4,Math.sin(sa+Math.PI)*1.8+.5,1.4);
  skyLight.position.copy(sunMesh.position).multiplyScalar(1);
  skyLight.intensity=.25+Math.max(0,Math.sin(sa))*1.1+(nightK*.15);
  skyLight.color.setHSL(.09,.5,.62-Math.max(0,Math.sin(sa))*.1);
  sunMesh.visible=Math.sin(sa)>-.1;moonMesh.visible=!sunMesh.visible;
  /* 灯火：夜晚更浓 */
  const lampK=nightK;
  hutWin.emissiveIntensity=lampK*1.6+stormK*.4;
  lampLight.intensity=lampK*.5;
  chestLight.intensity=.25+nightK*.3+stormK*.2;
  glowBox.material.emissiveIntensity=1.2+Math.sin(t*3)*.4+nightK;
  lampBulb.material.emissiveIntensity=1.2+nightK*1.2;
  beamMat.opacity=.05+nightK*.3;
  beaconSpin.rotation.y=t*1.4;
  beaconLight.intensity=nightK*.8;
  seaLight.intensity=.1+nightK*.35;
  seaLight.position.set(0,deskY+.75,0);
  /* 闪电 */
  if(stormK>.5){
    flashTimer-=dt;
    if(flashTimer<=0){flashTimer=.4+Math.random()*1.6;makeBolt();flashK=1}
  }
  flashK=Math.max(0,flashK-dt*6);
  boltMat.opacity=flashK;
  flash.intensity=flashK*4*stormK;
  darkMat.opacity=stormK*.85;
  cloudGrp.children.forEach(c=>{c.traverse(o=>{if(o.isMesh)o.material.opacity=.9-stormK*.55})});
  /* 风暴瓶体摇晃（水面反向旋转保持水平） */
  const rockA=stormK*.05;
  bottleGroup.rotation.z=Math.sin(t*3.1)*rockA;
  bottleGroup.rotation.x=Math.sin(t*2.3+1)*rockA*.6;
  bottleGroup.position.y=deskY+.4+Math.sin(t*2.7)*rockA*.4;
  waterSpin.rotation.z=-bottleGroup.rotation.z;
  waterSpin.rotation.x=-bottleGroup.rotation.x;
  waterSpin.position.y=-Math.sin(t*2.7)*rockA*.4;
  /* 帆船：绕岛 + 四点采样浮力 */
  routeT=(routeT+dt*.14*(1+stormK*.8))%1;
  const sp=route.getPoint(routeT);
  const st=route.getTangent(routeT);
  const sw=waveH(sp.x,sp.y,t);
  const shipY=SEA_Y+.02+sw;
  ship.position.set(sp.x,shipY,sp.y);
  const heading=Math.atan2(st.y,st.x);
  ship.rotation.set(0,heading,0);
  /* 纵摇 / 横摇：前后与左右两点波高差 */
  const bow=waveH(sp.x+st.x*.1,sp.y+st.y*.1,t);
  const stern=waveH(sp.x-st.x*.1,sp.y-st.y*.1,t);
  const left=waveH(sp.x-st.y*.05,sp.y+st.x*.05,t);
  const right=waveH(sp.x+st.y*.05,sp.y-st.x*.05,t);
  shipBody.rotation.z=Math.atan2(bow-stern,.2)*(1+stormK);
  shipBody.rotation.x=Math.atan2(left-right,.1)*.8;
  shipBody.position.y=Math.sin(t*1.4)*.004*(1+stormK*2);
  /* 帆鼓风（风暴时帆面外凸） */
  sails.forEach((s,i)=>{s.rotation.y=Math.sin(t*1.8+i)*.04*(1+stormK*2)});
  /* 尾迹 + 飞沫 */
  for(let i=0;i<SPRAY_N;i++){
    const p=sprayP[i];
    p.life-=dt*p.v*(1+stormK*1.5);
    if(p.life<=0){
      p.life=1;
      const bx=sp.x-st.x*.14+(Math.random()-.5)*.02;
      const bz=sp.y-st.y*.14+(Math.random()-.5)*.02;
      sprayPos[i*3]=bx;sprayPos[i*3+1]=SEA_Y+.01;sprayPos[i*3+2]=bz;
    }else{
      sprayPos[i*3+1]+=dt*p.v*.4;
      sprayPos[i*3]+=dt*p.v*.1*(Math.random()-.3);
    }
  }
  sprayGeo.attributes.position.needsUpdate=true;
  spray.material.opacity=.4+stormK*.5;
  /* 海鸥盘旋 */
  gulls.forEach(g=>{
    g.ph+=dt*g.sp;
    const gx=Math.cos(g.ph)*g.r-.06, gz=Math.sin(g.ph)*g.r;
    const gy=g.h+Math.sin(g.ph*2.3)*.02;
    const pp=innerClamp(new THREE.Vector3(gx,gy,gz));
    g.g.position.copy(pp);
    g.g.rotation.y=-g.ph*g.tilt;
    const flap=Math.sin(t*9+g.ph*5)*.7;
    g.wlP.rotation.z=flap;g.wrP.rotation.z=-flap;
  });
  /* 云漂 */
  cloudGrp.children.forEach(c=>{c.position.x+=Math.sin(t*.3+c.userData.ph)*.0006});
  /* 鲸跃 */
  if(whaleState==='rest'){
    whaleK+=dt;
    if(whaleK>6+Math.random()*5){whaleState='breach';whaleK=0;whale.visible=true;
      whale.position.set(.3-Math.random()*.5,SEA_Y-.05,(Math.random()-.5)*.2);
      whale.userData={dir:Math.random()<.5?1:-1};
    }
  }else{
    whaleK+=dt*1.1;
    if(whaleK>=1){whaleState='rest';whaleK=0;whale.visible=false}
    else{
      const k=whaleK;
      const arc=Math.sin(k*Math.PI);
      whale.position.y=SEA_Y-.05+arc*.3;
      whale.rotation.z=whale.userData.dir*(k-.5)*1.6;
      whale.position.x+=dt*.12*whale.userData.dir;
      const pp=innerClamp(whale.position.clone());
      whale.position.x=pp.x;
    }
  }
  /* 鱼群 */
  const dm=new THREE.Matrix4(),q=new THREE.Quaternion(),up=new THREE.Vector3(0,1,0),one=new THREE.Vector3(1,1,1);
  fishData.forEach((f,i)=>{
    const a=f.ph+t*f.sp*.4;
    const fx=Math.cos(a)*f.r-.06, fz=Math.sin(a)*f.r*.7;
    const fy=f.y+Math.sin(t*2+f.ph)*.02;
    dm.compose(V.set(fx,fy,fz),q.setFromAxisAngle(up,-a),one);
    fish.setMatrixAt(i,dm);
  });
  fish.instanceMatrix.needsUpdate=true;
  /* 气泡上升 */
  bubbles.forEach(b=>{
    b.position.y+=dt*b.userData.sp;
    b.position.x+=Math.sin(t*2+b.userData.ph)*.0004;
    if(b.position.y>SEA_Y-.05){
      const p=innerClamp(new THREE.Vector3(-.6+Math.random()*1.2,seaFloorY,0));
      b.position.set(p.x,p.y,p.z+(Math.random()-.5)*.4);
    }
    const s=b.userData.r*(1+Math.sin(t*3+b.userData.ph)*.2);
    b.scale.setScalar(s/.004);
  });
  /* 螃蟹钳挥动 */
  clawL.position.y=.004+Math.max(0,Math.sin(t*4))*.006;
  clawR.position.y=.004+Math.max(0,Math.sin(t*4+2))*.006;
  /* 浮标随浪 */
  buoy.position.set(.52,SEA_Y+waveH(.52,.28,t)+.01,.28);
  buoy.rotation.z=Math.sin(t*2)*.1;
  /* 小艇随浪 */
  dinghy.position.y=.06+waveH(.2,.42,t)*.6;
  dinghy.rotation.z=Math.sin(t*1.8)*.08;
  controls.update();
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
document.getElementById('veil').classList.add('done');
animate();
</script>
</body>
</html>
