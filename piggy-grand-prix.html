<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3e9">
  <title>猪猪大奖赛 · Piggy Grand Prix</title>
  <style>
    :root {
      --ink: #293e48;
      --paper: #f5f3e9;
      --coral: #ff7368;
      --pink: #ffadc3;
      --mint: #9ad0b3;
      --yellow: #ffdc83;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 3px solid #337b87; outline-offset: 6px; }
    .app {
      width: min(1700px, 100%);
      height: 100svh;
      min-height: 570px;
      margin: auto;
      padding: 24px 32px 20px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 20px;
    }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { width: 45px; height: 45px; transform: rotate(-7deg); }
    h1 { margin: 0; font-size: 21px; font-weight: 900; letter-spacing: .08em; }
    .brand-en { display: block; margin-top: 5px; font-size: 10px; font-weight: 800; letter-spacing: .21em; }
    .venue { display: flex; align-items: center; gap: 16px; font-size: 12px; font-weight: 700; }
    .weather { display: flex; align-items: center; gap: 7px; color: #6d7e7c; }
    .weather svg { width: 19px; height: 19px; }
    .venue-name { padding-right: 16px; border-right: 1px solid #ced2c7; letter-spacing: .08em; }
    .stage {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      border: 2px solid var(--ink);
      border-radius: 22px;
      background: #b9e0eb;
      box-shadow: 0 5px 0 #293e4810;
    }
    .world { display: block; width: 100%; height: 100%; }
    .hud {
      position: absolute;
      top: 23px;
      left: 25px;
      right: 25px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
    }
    .race-numbers {
      display: flex;
      gap: 22px;
      padding: 13px 19px;
      background: #fffbeded;
      border: 1.5px solid var(--ink);
      border-radius: 13px;
      box-shadow: 3px 3px 0 #293e481a;
    }
    .stat + .stat { border-left: 1px solid #cfd5c8; padding-left: 22px; }
    .stat-label { display: block; margin-bottom: 1px; font-size: 9px; font-weight: 800; letter-spacing: .16em; color: #6c7b79; }
    .stat strong { font-size: 30px; line-height: 1.1; font-style: italic; font-weight: 900; font-variant-numeric: tabular-nums; }
    .stat small { font-size: 12px; padding-left: 4px; color: #77827b; font-weight: 700; }
    .race-state {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1.5px solid #293e4860;
      border-radius: 30px;
      background: #fffbedcf;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .04em;
    }
    .live-dot { width: 7px; height: 7px; background: #588c71; border-radius: 50%; box-shadow: 0 0 0 3px #588c7119; }
    .is-boosting .live-dot { background: #f57556; box-shadow: 0 0 0 3px #f5755620; }
    .is-paused .live-dot { background: #8f9691; box-shadow: none; }
    .driver-tag {
      position: absolute;
      left: 25px;
      bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff9e9;
      text-shadow: 0 1px 3px #203b4b40;
    }
    .driver-number { font-size: 25px; font-style: italic; font-weight: 900; line-height: 1; }
    .driver-name { border-left: 1px solid #fff9e970; padding-left: 10px; font-size: 11px; font-weight: 800; letter-spacing: .12em; }
    .driver-name small { display: block; margin-top: 4px; font-size: 8px; letter-spacing: .17em; opacity: .8; }
    .mini-track { position: absolute; bottom: 15px; right: 24px; width: 126px; height: 73px; }
    .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; }
    .telemetry { display: flex; align-items: center; gap: 17px; }
    .speed-readout { display: flex; align-items: baseline; gap: 6px; }
    .speed-readout strong { font-size: 43px; font-weight: 900; font-style: italic; line-height: 1; letter-spacing: -.06em; font-variant-numeric: tabular-nums; min-width: 79px; }
    .speed-readout span { font-size: 10px; font-weight: 800; color: #78857e; }
    .rpm { display: flex; align-items: flex-end; gap: 3px; height: 25px; }
    .rpm i { width: 4px; height: calc(8px + var(--i) * 1.6px); background: #ccd2c5; border-radius: 2px; }
    .rpm i.on { background: #4b8176; }
    .rpm i.hot { background: var(--coral); }
    .actions { display: flex; align-items: center; gap: 12px; }
    .pause {
      display: grid;
      place-items: center;
      width: 47px;
      height: 47px;
      padding: 0;
      background: #fffbee;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      cursor: pointer;
    }
    .pause:hover { background: #e6eddd; }
    .pause svg { width: 17px; height: 17px; }
    .play-icon { display: none; }
    .is-paused .play-icon { display: block; }
    .is-paused .pause-icon { display: none; }
    .boost {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 178px;
      height: 49px;
      padding: 0 24px;
      border: 2px solid var(--ink);
      border-radius: 100px;
      background: var(--coral);
      box-shadow: 0 4px 0 var(--ink);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .09em;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      transition: background .15s, transform .12s, box-shadow .12s;
    }
    .boost svg { width: 21px; height: 23px; }
    .boost:hover { background: #ff8c79; }
    .is-boosting .boost, .boost:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); background: var(--yellow); }
    .hint { justify-self: end; text-align: right; font-size: 11px; line-height: 1.8; color: #7a837b; }
    .hint strong { color: #526761; font-weight: 700; }
    kbd { font-family: inherit; font-size: 10px; border: 1px solid #c8cdbf; border-radius: 4px; padding: 2px 5px; margin: 0 3px; background: #fffbee; }
    .pause-overlay {
      position: absolute;
      left: 50%;
      top: 43%;
      transform: translate(-50%, -50%) rotate(-4deg);
      padding: 13px 24px;
      border: 2px solid var(--ink);
      border-radius: 13px;
      background: #fff9e8ed;
      box-shadow: 4px 4px 0 #293e4830;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: .12em;
      pointer-events: none;
      display: none;
    }
    .is-paused .pause-overlay { display: block; }
    @media (max-width: 760px) {
      .app { padding: 19px 17px 21px; gap: 17px; min-height: 540px; }
      .venue-name { display: none; }
      .brand-mark { width: 37px; height: 37px; }
      .brand { gap: 10px; }
      h1 { font-size: 18px; }
      .brand-en { font-size: 8px; letter-spacing: .16em; }
      .controls { grid-template-columns: 1fr auto; gap: 17px 12px; }
      .hint { grid-column: 1 / -1; justify-self: center; text-align: center; }
      .hint br { display: none; }
      .hint strong { margin-right: 8px; }
      .rpm { display: none; }
      .speed-readout strong { font-size: 36px; min-width: 69px; }
      .boost { min-width: 142px; height: 46px; padding: 0 15px; font-size: 13px; }
      .pause { width: 43px; height: 43px; }
      .actions { gap: 10px; }
      .hud { left: 16px; right: 16px; top: 17px; }
      .race-numbers { gap: 16px; padding: 10px 13px; }
      .stat + .stat { padding-left: 16px; }
      .stat strong { font-size: 24px; }
      .race-state { padding: 9px 10px; font-size: 10px; }
      .driver-tag { left: 18px; bottom: 20px; }
      .mini-track { right: 15px; width: 102px; height: 62px; }
    }
    @media (max-width: 380px) {
      .app { padding-left: 12px; padding-right: 12px; }
      .race-state { gap: 6px; font-size: 9px; padding: 8px; }
      .boost { min-width: 125px; padding: 0 10px; }
      .controls { column-gap: 8px; }
      .speed-readout { gap: 4px; }
      .speed-readout strong { font-size: 33px; min-width: 63px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .boost { transition: none; }
    }
  </style>
</head>

  <main class="app">
    <header class="masthead">
      <div class="brand">

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const svgNS = "http://www.w3.org/2000/svg";
      const stage = document.querySelector(".stage");
      const world = $("world");
      const pauseButton = $("pause");
      const boostButton = $("boost");
      const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");
      const circuit = $("mini-circuit");
      const circuitLength = circuit.getTotalLength();
      const rpmBars = Array.from(document.querySelectorAll(".rpm i"));
      const elements = {
        clouds: $("clouds"), far: $("far-hills"), near: $("near-hills"),
        stands: $("stands"), wall: $("wall-stripes"), fence: $("fence-grid"),
        upperCurb: $("upper-curb"), lowerCurb: $("lower-curb"),
        road: $("road-grain"), lane: $("lane-dashes"), grass: $("grass-marks"),
        car: $("car"), shadow: $("car-shadow"), rear: $("rear-spokes"), front: $("front-spokes"),
        head: $("driver-head"), eyes: $("eyes"), leftEar: $("ear-left"), rightEar: $("ear-right"),
        scarf: $("scarf"), scarfFold: $("scarf-fold"), rival: $("rival"),
        cheer: $("cheer"), sparks: $("sparks"), mapDot: $("map-dot"),
        speed: $("speed"), lap: $("lap"), state: $("state-label")
      };
      let playing = !motionPreference.matches;
      let held = false;
      let burstUntil = 0;
      let time = 0;
      let distance = 0;
      let speed = 248;
      let boostAmount = 0;
      let lastFrame = performance.now();
      let lastReadout = -1;
      let wasBoosting = false;

      function fitScene() {
        const rect = stage.getBoundingClientRect();
        const width = rect.width < 650 ? 1080 : 1600;
        const height = width * rect.height / rect.width;
        const top = 778 - height * (rect.width < 650 ? .77 : .8);
        world.setAttribute("viewBox", [(1600 - width) / 2, top, width, height].join(" "));
      }
      new ResizeObserver(fitScene).observe(stage);
      fitScene();

      const wind = Array.from({ length: 18 }, (_, i) => {
        const line = document.createElementNS(svgNS, "line");
        line.setAttribute("stroke-width", i % 3 === 0 ? "3" : "2");
        $("wind-lines").appendChild(line);
        return { node: line, seed: (i * 307 + 61) % 2300, y: 605 + (i * 43) % 227, length: 38 + (i * 17) % 118 };
      });
      const dust = Array.from({ length: 8 }, (_, i) => {
        const circle = document.createElementNS(svgNS, "ellipse");
        $("dust").appendChild(circle);
        return { node: circle, phase: i / 8 };
      });

      function syncState() {
        document.body.classList.toggle("is-paused", !playing);
        pauseButton.setAttribute("aria-label", playing ? "暂停动画" : "继续播放");
        pauseButton.title = playing ? "暂停动画" : "继续播放";
        elements.state.textContent = !playing ? "已暂停" : wasBoosting ? "猪力全开！" : "比赛进行中";
      }

      function setPlaying(value) {
        playing = value;
        if (!playing) {
          held = false;
          burstUntil = 0;
          wasBoosting = false;
          document.body.classList.remove("is-boosting");
          boostButton.setAttribute("aria-pressed", "false");
        }
        lastFrame = performance.now();
        syncState();
      }

      function startBoost() {
        if (!playing) setPlaying(true);
        held = true;
        burstUntil = Math.max(burstUntil, time + .65);
      }

      function releaseBoost() { held = false; }

      pauseButton.addEventListener("click", () => setPlaying(!playing));
      boostButton.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        boostButton.setPointerCapture(event.pointerId);
        startBoost();
      });
      boostButton.addEventListener("pointerup", releaseBoost);
      boostButton.addEventListener("pointercancel", releaseBoost);
      boostButton.addEventListener("lostpointercapture", releaseBoost);
      boostButton.addEventListener("click", () => {
        if (!playing) setPlaying(true);
        burstUntil = Math.max(burstUntil, time + .8);
      });
      window.addEventListener("keydown", (event) => {
        if (event.code === "Space" && event.target !== pauseButton && !event.altKey && !event.ctrlKey && !event.metaKey) {
          event.preventDefault();
          if (!event.repeat) startBoost();
        }
      });
      window.addEventListener("keyup", (event) => {
        if (event.code === "Space") {
          if (event.target !== pauseButton) event.preventDefault();
          releaseBoost();
        }
      });
      window.addEventListener("blur", releaseBoost);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) releaseBoost();
        lastFrame = performance.now();
      });
      motionPreference.addEventListener("change", (event) => {
        if (event.matches) setPlaying(false);
      });

      function translate(node, x, y = 0) {
        node.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ")");
      }

      function scrollPattern(node, factor, period) {
        node.setAttribute("patternTransform", "translate(" + (-(distance * factor) % period).toFixed(2) + " 0)");
      }

      function draw() {
        translate(elements.clouds, -(time * 13) % 1800);
        translate(elements.far, -(distance * .06) % 1800);
        translate(elements.near, -(distance * .16) % 1800);
        translate(elements.stands, -(distance * .36) % 2000);
        scrollPattern(elements.fence, .48, 76);
        scrollPattern(elements.wall, .48, 320);
        scrollPattern(elements.upperCurb, .78, 160);
        scrollPattern(elements.lowerCurb, 1.6, 216);
        scrollPattern(elements.road, 1.2, 370);
        scrollPattern(elements.lane, 1.45, 330);
        scrollPattern(elements.grass, 1.7, 270);

        const vibration = Math.sin(time * 23) * 1.1 + Math.sin(time * 13) * 1.2;
        const lift = Math.sin(time * 3.7) * 1.6;
        const carX = 340 + Math.sin(time * .75) * 9 + boostAmount * 19;
        const carY = 427 + vibration * (1 + boostAmount * .3) + lift;
        const pitch = Math.sin(time * 4.5) * .19 - boostAmount * .65;
        elements.car.setAttribute("transform", "translate(" + carX.toFixed(2) + " " + carY.toFixed(2) + ") rotate(" + pitch.toFixed(3) + " 435 305)");
        elements.shadow.setAttribute("cx", (carX + 451).toFixed(2));
        elements.shadow.setAttribute("rx", (402 - lift * 2).toFixed(2));

        const wheelAngle = (distance * 1.32) % 360;
        elements.rear.setAttribute("transform", "rotate(" + wheelAngle.toFixed(2) + ")");
        elements.front.setAttribute("transform", "rotate(" + (wheelAngle * 1.075).toFixed(2) + ")");
        elements.head.setAttribute("transform", "rotate(" + (Math.sin(time * 3.7) * 1.2 - boostAmount * 1.6).toFixed(2) + " 408 152)");
        elements.leftEar.setAttribute("transform", "rotate(" + (Math.sin(time * 11) * 3.2).toFixed(2) + " 370 39)");
        elements.rightEar.setAttribute("transform", "rotate(" + (Math.sin(time * 11 + 1) * 2.4).toFixed(2) + " 455 37)");

        const blinkPhase = time % 4.3;
        const blink = blinkPhase > 3.91 && blinkPhase < 4.09 ? Math.max(.08, Math.abs(blinkPhase - 4) / .09) : 1;
        elements.eyes.setAttribute("transform", "translate(0 102) scale(1 " + blink.toFixed(3) + ") translate(0 -102)");
        const flutter = Math.sin(time * 15) * (7 + boostAmount * 4);
        elements.scarf.setAttribute("d", "M379 154C338 " + (167 + flutter) + " 315 " + (135 - flutter) + " 280 " + (143 + flutter) + "L237 " + (163 - flutter) + " 278 " + (165 + flutter) + " 266 " + (181 + flutter) + "C307 " + (161 - flutter) + " 326 " + (194 + flutter) + " 378 176Z");
        elements.scarfFold.setAttribute("d", "M366 166Q318 " + (155 + flutter) + " 280 " + (158 + flutter * .5));

        const rivalX = 1950 - (distance * .72) % 3300;
        elements.rival.setAttribute("transform", "translate(" + rivalX.toFixed(2) + " " + (585 + Math.sin(time * 18) * .8).toFixed(2) + ") scale(.55)");
        elements.cheer.setAttribute("opacity", (boostAmount * .98).toFixed(3));
        elements.cheer.setAttribute("transform", "translate(" + (989 + Math.sin(time * 8) * 3).toFixed(2) + " " + (378 - boostAmount * 8).toFixed(2) + ") rotate(7)");
        elements.sparks.setAttribute("opacity", (boostAmount * (.55 + Math.sin(time * 31) * .4)).toFixed(3));

        wind.forEach((line, i) => {
          const x = 2000 - (distance * (1.7 + i % 3 * .18) + line.seed) % 2400;
          line.node.setAttribute("x1", x.toFixed(1));
          line.node.setAttribute("x2", (x + line.length * (1 + boostAmount)).toFixed(1));
          line.node.setAttribute("y1", line.y);
          line.node.setAttribute("y2", line.y);
          line.node.setAttribute("opacity", (.09 + boostAmount * .28).toFixed(3));
        });
        dust.forEach((puff) => {
          const phase = (time * (1.1 + boostAmount * .4) + puff.phase) % 1;
          puff.node.setAttribute("cx", (carX + 160 - phase * (260 + boostAmount * 100)).toFixed(1));
          puff.node.setAttribute("cy", (765 - Math.sin(phase * Math.PI) * 19).toFixed(1));
          puff.node.setAttribute("rx", (6 + phase * 25).toFixed(1));
          puff.node.setAttribute("ry", (3 + phase * 9).toFixed(1));
          puff.node.setAttribute("opacity", ((1 - phase) * (.18 + boostAmount * .13)).toFixed(3));
        });

        const lapProgress = (distance % 18000) / 18000;
        const point = circuit.getPointAtLength(lapProgress * circuitLength);
        elements.mapDot.setAttribute("cx", point.x.toFixed(2));
        elements.mapDot.setAttribute("cy", point.y.toFixed(2));

        if (time - lastReadout > .1 || lastReadout < 0) {
          elements.speed.textContent = Math.round(speed);
          elements.lap.textContent = String(Math.floor(distance / 18000) + 1).padStart(2, "0");
          rpmBars.forEach((bar, i) => {
            bar.classList.toggle("on", i < Math.round((speed - 155) / 19));
            bar.classList.toggle("hot", i > 6 && i < Math.round((speed - 155) / 19));
          });
          lastReadout = time;
        }
      }

      function tick(now) {
        const dt = Math.min((now - lastFrame) / 1000, .05);
        lastFrame = now;
        if (playing) {
          time += dt;
          const boosting = held || time < burstUntil;
          const target = boosting ? 338 + Math.sin(time * 2) * 5 : 248 + Math.sin(time * .8) * 8 + Math.sin(time * 2.1) * 3;
          speed += (target - speed) * (1 - Math.exp(-dt * 2.3));
          boostAmount += ((boosting ? 1 : 0) - boostAmount) * (1 - Math.exp(-dt * 4));
          distance += speed * dt * 2.5;
          if (boosting !== wasBoosting) {
            wasBoosting = boosting;
            document.body.classList.toggle("is-boosting", boosting);
            boostButton.setAttribute("aria-pressed", String(boosting));
            syncState();
          }
          draw();
        }
        requestAnimationFrame(tick);
      }
      syncState();
      draw();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
