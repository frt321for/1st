<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeebf8">
  <title>喵速方程式 · Meow Grand Prix</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #342c4b;
      --paper: #f8f6fc;
      --lavender: #ded9f3;
      --coral: #ff715e;
      --mint: #bce9d7;
      --peach: #ffc778;
      --muted: #857d99;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 300px;
      min-height: 100svh;
      display: grid;
      align-items: center;
      background: #eeebf8;
      color: var(--ink);
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
    }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid #665598; outline-offset: 5px; }
    .app { width: min(1480px, calc(100% - 80px)); margin: 28px auto; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { width: 46px; height: 46px; flex: none; }
    h1 { margin: 0; font-size: 23px; line-height: 1.3; font-weight: 800; letter-spacing: 1px; }
    .brand-en { margin-top: 4px; font-size: 9px; font-weight: 800; letter-spacing: 3.3px; }
    .edition { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; }
    .edition svg { width: 32px; height: 26px; }
    .scene {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border: 2px solid var(--ink);
      border-radius: 25px;
      background: #deddf7;
      isolation: isolate;
      box-shadow: 0 7px 0 #342c4b;
    }
    .scene-art { display: block; width: 100%; height: 100%; }
    .race-top { position: absolute; top: 26px; left: 29px; right: 29px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; pointer-events: none; }
    .location { display: flex; align-items: center; gap: 11px; }
    .location-icon { width: 31px; height: 31px; }
    .location-name { font-size: 13px; letter-spacing: 1.5px; font-weight: 800; }
    .location-en { font-size: 8px; letter-spacing: 2.1px; margin-top: 4px; font-weight: 700; opacity: .6; }
    .race-status { display: flex; align-items: center; gap: 13px; }
    .position { background: var(--ink); border-radius: 9px; color: #fff5e7; padding: 8px 12px; font-size: 18px; font-style: italic; font-weight: 900; }
    .lap { font-size: 11px; font-weight: 800; letter-spacing: 1px; }
    .lap small { display: block; font-size: 8px; letter-spacing: 1.8px; opacity: .55; margin-bottom: 4px; }
    .telemetry { position: absolute; left: 30px; bottom: 25px; color: #fff6e7; pointer-events: none; }
    .speed-line { display: flex; align-items: baseline; gap: 8px; }
    .speed-value { font-family: "Arial Black", "Trebuchet MS", sans-serif; font-size: clamp(34px, 4.2vw, 61px); font-weight: 900; font-style: italic; letter-spacing: -3px; line-height: 1; font-variant-numeric: tabular-nums; }
    .speed-unit { font-size: 10px; font-weight: 800; letter-spacing: 1px; }
    .rev-meter { display: flex; align-items: center; gap: 4px; margin-top: 9px; }
    .rev-meter i { width: 5px; height: 9px; border-radius: 1px; background: #bce9d7; transform: skewX(-14deg); }
    .rev-meter i:nth-child(n+12) { background: #ffe39c; }
    .rev-meter i:nth-child(n+16) { background: #ff9780; }
    .rev-meter i:nth-child(n+18) { opacity: .24; }
    .gear { margin-left: 8px; font-size: 9px; font-weight: 800; letter-spacing: 1px; opacity: .8; }
    .map { position: absolute; bottom: 20px; right: 27px; width: 135px; pointer-events: none; }
    .map svg { display: block; width: 100%; overflow: visible; }
    .map-label { text-align: center; color: #fff6e7; font-size: 8px; font-weight: 800; letter-spacing: 2px; opacity: .8; }
    .boost-note { position: absolute; left: 50%; top: 19%; color: var(--ink); font-size: clamp(18px, 2.5vw, 33px); font-weight: 900; letter-spacing: 2px; font-style: italic; opacity: 0; transform: translate(-50%, 10px) rotate(-7deg) scale(.85); transition: opacity .18s, transform .24s; pointer-events: none; }
    .boost-note span { display: inline-block; background: #fff1b7; padding: 8px 19px; border: 2px solid var(--ink); border-radius: 50% 45% 48% 30%; box-shadow: 3px 4px 0 var(--ink); }
    .is-boosting .boost-note { opacity: 1; transform: translate(-50%, 0) rotate(-7deg) scale(1); }
    .is-boosting .rev-meter i { opacity: 1; }
    .footer { margin-top: 26px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .driver-id { display: flex; align-items: center; gap: 11px; }
    .driver-number { width: 38px; height: 38px; display: grid; place-items: center; border: 1.5px solid var(--ink); border-radius: 50%; background: var(--peach); font-size: 16px; font-weight: 900; font-style: italic; }
    .driver-name { font-size: 12px; font-weight: 800; letter-spacing: .8px; }
    .driver-caption { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .controls { display: flex; align-items: center; gap: 10px; }
    .control { min-height: 44px; display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 10px 16px; border: 1.5px solid var(--ink); border-radius: 12px; cursor: pointer; font-size: 12px; font-weight: 800; transition: transform .15s, background .15s, box-shadow .15s; }
    .control svg { width: 17px; height: 17px; flex: none; }
    .pause { background: transparent; color: var(--ink); }
    .boost { background: var(--coral); color: var(--ink); box-shadow: 0 3px 0 var(--ink); padding-inline: 19px; }
    .control:hover { transform: translateY(-2px); }
    .boost:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
    .control:disabled { opacity: .42; cursor: default; transform: none; }
    kbd { padding: 3px 5px; border: 1px solid #342c4b38; border-radius: 4px; font: 8px "Trebuchet MS", sans-serif; letter-spacing: .5px; }
    .play-icon { display: none; }
    .is-paused .pause-icon { display: none; }
    .is-paused .play-icon { display: block; }
    .ink { stroke: #342c4b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .thin-ink { stroke: #342c4b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .cat-eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.8s infinite; }
    .scarf-end { transform-box: fill-box; transform-origin: right center; animation: flutter .19s ease-in-out infinite alternate; }
    .tail-tip { transform-box: fill-box; transform-origin: right bottom; animation: tail-wave .65s ease-in-out infinite alternate; }
    .flag { transform-box: fill-box; transform-origin: left center; animation: flag-wave .8s ease-in-out infinite alternate; }
    .driver-bob { animation: head-bob .34s ease-in-out infinite alternate; }
    .speed-streaks { opacity: .4; transition: opacity .3s; }
    .streak { animation: streak .8s linear infinite; }
    .streak:nth-child(2) { animation-delay: -.27s; animation-duration: 1.1s; }
    .streak:nth-child(3) { animation-delay: -.6s; animation-duration: .7s; }
    .streak:nth-child(4) { animation-delay: -.15s; animation-duration: .9s; }
    .streak:nth-child(5) { animation-delay: -.45s; animation-duration: .6s; }
    .is-boosting .speed-streaks { opacity: .95; }
    .boost-flame { opacity: 0; transition: opacity .12s; }
    .is-boosting .boost-flame { opacity: 1; }
    .flame-tip { transform-box: fill-box; transform-origin: right center; animation: flame .1s ease-in-out infinite alternate; }
    .is-paused .ambient { animation-play-state: paused; }
    @keyframes blink { 0%, 43%, 46%, 91%, 94%, 100% { transform: scaleY(1); } 44.5%, 92.5% { transform: scaleY(.08); } }
    @keyframes flutter { from { transform: rotate(-5deg) scaleY(.8); } to { transform: rotate(6deg) scaleY(1.08); } }
    @keyframes tail-wave { from { transform: rotate(-3deg); } to { transform: rotate(5deg); } }
    @keyframes flag-wave { from { transform: skewY(-4deg) scaleX(.93); } to { transform: skewY(5deg) scaleX(1); } }
    @keyframes head-bob { from { transform: translateY(-1.8px) rotate(-.3deg); } to { transform: translateY(1.3px) rotate(.3deg); } }
    @keyframes streak { from { transform: translateX(1600px); } to { transform: translateX(-1200px); } }
    @keyframes flame { from { transform: scaleX(.78) scaleY(.85); } to { transform: scaleX(1.12) scaleY(1.12); } }
    @media (min-width: 1700px) { .app { width: min(1640px, calc(100% - 100px)); } }
    @media (max-width: 900px) {
      .app { width: calc(100% - 36px); margin-block: 22px; }
      .scene { aspect-ratio: 4 / 3; }
      .race-top { top: 20px; left: 20px; right: 20px; }
      .telemetry { left: 22px; bottom: 21px; }
      .map { right: 19px; width: 110px; }
      .boost-note { top: 22%; }
    }
    @media (max-width: 560px) {
      body { align-items: start; }
      .app { width: calc(100% - 24px); margin-block: 20px; }
      .masthead { margin-bottom: 17px; gap: 9px; }
      .brand { gap: 9px; }
      .brand-mark { width: 38px; height: 38px; }
      h1 { font-size: 19px; }
      .brand-en { font-size: 7px; letter-spacing: 2.6px; }
      .edition { font-size: 8px; letter-spacing: 1px; }
      .edition svg { width: 24px; }
      .scene { aspect-ratio: 1 / 1.1; border-radius: 19px; box-shadow: 0 5px 0 var(--ink); }
      .race-top { top: 17px; left: 15px; right: 15px; }
      .location { gap: 7px; }
      .location-icon { width: 24px; height: 24px; }
      .location-name { font-size: 10px; letter-spacing: 1px; }
      .location-en { font-size: 6px; letter-spacing: 1px; }
      .race-status { gap: 7px; }
      .position { font-size: 14px; padding: 6px 8px; border-radius: 7px; }
      .lap { font-size: 9px; }
      .lap small { font-size: 6px; }
      .telemetry { left: 17px; bottom: 19px; }
      .speed-value { font-size: 37px; }
      .speed-unit { font-size: 8px; }
      .rev-meter { gap: 3px; margin-top: 7px; }
      .rev-meter i { width: 3px; height: 7px; }
      .gear { font-size: 7px; margin-left: 4px; }
      .map { width: 87px; right: 16px; bottom: 16px; }
      .map-label { font-size: 6px; letter-spacing: 1.5px; }
      .boost-note { top: 23%; white-space: nowrap; }
      .footer { margin-top: 24px; flex-wrap: wrap; gap: 18px; }
      .driver-id { gap: 8px; }
      .driver-number { width: 34px; height: 34px; font-size: 14px; }
      .driver-name { font-size: 11px; }
      .driver-caption { font-size: 9px; }
      .controls { gap: 7px; }
      .control { padding: 10px 12px; font-size: 11px; border-radius: 10px; gap: 5px; }
      .control svg { width: 15px; height: 15px; }
      kbd { display: none; }
    }
    @media (max-width: 380px) {
      .edition span { display: none; }
      .footer { justify-content: center; }
      .driver-id { margin-right: auto; }
      .controls { width: 100%; }
      .control { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      html:not(.motion-enabled) .ambient { animation-play-state: paused; }
      .control, .boost-note { transition: none; }
    }
  </style>
</head>

  <script>
    (() => {
      const root = document.documentElement;
      const byId = (id) => document.getElementById(id);
      const clouds = byId('clouds');
      const hills = byId('hills');
      const trackside = byId('trackside');
      const barriers = byId('barriers');
      const farCurb = byId('far-curb');
      const nearCurb = byId('near-curb');
      const roadMarks = byId('road-marks');
      const car = byId('car');
      const shadow = byId('car-shadow');
      const rearWheel = byId('rear-wheel-spin');
      const frontWheel = byId('front-wheel-spin');
      const speedLabel = byId('speed');
      const lapLabel = byId('lap-count');
      const gearLabel = byId('gear');
      const pauseButton = byId('pause-button');
      const pauseLabel = byId('pause-label');
      const boostButton = byId('boost-button');
      const driverStatus = byId('driver-status');
      const circuit = byId('circuit-line');
      const circuitLength = circuit.getTotalLength();
      const mapDot = byId('map-dot');
      const mapHalo = byId('map-dot-halo');
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const lapDistance = 3400 * 6.8;
      let paused = motionPreference.matches;
      let frame = 0;
      let previousTime = 0;
      let elapsed = 0;
      let distance = 0;
      let speed = 294;
      let boostLeft = 0;
      let displayTime = 0;

      const move = (node, x) => node.setAttribute('transform', 'translate(' + x.toFixed(2) + ' 0)');

      function updateControls() {
        root.classList.toggle('is-paused', paused);
        root.classList.toggle('motion-enabled', !paused);
        root.classList.toggle('is-boosting', boostLeft > 0);
        pauseLabel.textContent = paused ? '播放' : '暂停';
        pauseButton.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
        boostButton.disabled = paused;
        driverStatus.textContent = paused ? '小憩一下，马上出发。' : boostLeft > 0 ? '小鱼在前方，全速追上！' : '今日目标：追上那条小鱼。';
      }

      function draw(delta) {
        elapsed += delta;
        if (boostLeft > 0) {
          boostLeft = Math.max(0, boostLeft - delta);
          if (boostLeft === 0) updateControls();
        }
        const targetSpeed = boostLeft > 0 ? 362 : 294 + Math.sin(elapsed * .7) * 6 + Math.sin(elapsed * 2.1) * 2;
        speed += (targetSpeed - speed) * (1 - Math.exp(-delta * 3));
        distance += speed / 3.6 * delta * 6.8;

        move(clouds, -(distance * .023 % 1440));
        move(hills, -(distance * .075 % 1440));
        move(trackside, -(distance * .28 % 1440));
        move(barriers, -(distance * .65 % 240));
        move(roadMarks, -(distance % 360));
        farCurb.setAttribute('stroke-dashoffset', (distance * .56 % 125).toFixed(1));
        nearCurb.setAttribute('stroke-dashoffset', (distance * 1.3 % 196).toFixed(1));
        rearWheel.setAttribute('transform', 'rotate(' + (distance / 59 * 180 / Math.PI % 360).toFixed(1) + ')');
        frontWheel.setAttribute('transform', 'rotate(' + (distance / 53.7 * 180 / Math.PI % 360).toFixed(1) + ')');

        const surge = (speed - 294) * .43;
        const sway = Math.sin(elapsed * 1.8) * 3;
        const bob = Math.sin(elapsed * 28) * 1.1 + Math.sin(elapsed * 13) * .65;
        const tilt = -4 + Math.sin(elapsed * 15) * .17 - (speed - 294) * .006;
        car.setAttribute('transform', 'translate(' + (337 + surge + sway).toFixed(2) + ' ' + (415 + bob).toFixed(2) + ') rotate(' + tilt.toFixed(2) + ' 350 220) scale(1.06)');
        shadow.setAttribute('cx', (735 + surge + sway).toFixed(2));
        shadow.setAttribute('ry', (24 - bob * .4).toFixed(2));

        displayTime += delta;
        if (displayTime >= .09) {
          speedLabel.textContent = Math.round(speed);
          gearLabel.textContent = speed > 324 ? '8' : '7';
          lapLabel.textContent = String(Math.floor(distance / lapDistance) + 1).padStart(2, '0');
          const point = circuit.getPointAtLength((distance % lapDistance) / lapDistance * circuitLength);
          mapDot.setAttribute('cx', point.x);
          mapDot.setAttribute('cy', point.y);
          mapHalo.setAttribute('cx', point.x);
          mapHalo.setAttribute('cy', point.y);
          displayTime = 0;
        }
      }

      function tick(now) {
        const delta = previousTime ? Math.min((now - previousTime) / 1000, .05) : 0;
        previousTime = now;
        draw(delta);
        frame = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        cancelAnimationFrame(frame);
        previousTime = 0;
        if (!paused && !document.hidden) frame = requestAnimationFrame(tick);
      }

      function togglePause() {
        paused = !paused;
        updateControls();
        syncPlayback();
      }

      function boost() {
        if (paused) return;
        boostLeft = 3.4;
        updateControls();
      }

      pauseButton.addEventListener('click', togglePause);
      boostButton.addEventListener('click', boost);
      document.addEventListener('keydown', (event) => {
        if (event.code === 'Space' && event.target.tagName !== 'BUTTON') {
          event.preventDefault();
          if (!event.repeat) boost();
        }
      });
      document.addEventListener('visibilitychange', syncPlayback);
      motionPreference.addEventListener('change', (event) => {
        if (event.matches) {
          paused = true;
          updateControls();
          syncPlayback();
        }
      });
      updateControls();
      syncPlayback();
    })();
  </script>
