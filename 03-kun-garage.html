<!DOCTYPE html>
<!--
DIRECTION CONTRACT
THESIS         这是一间摄影棚，不是一个模型查看器：车停在一块有光池的圆台上，
               背景永远暗、光永远来自上方偏前，所以车漆的高光带才是主角。
               九台载具共用同一套灯光与地面，只有形体与漆色在变。
               拒绝「深色渐变背景 + 发光边框 + 彩虹霓虹」的 3D 展示默认做法。
OWN-WORLD      炭黑棚内 + 骨白文字 + 单一琥珀作为强调（选中态、按钮、光池边缘）；
               车漆一律带清漆层，金属件与玻璃分开材质；参数与单位走等宽表格数字。
STORY          左侧挑一台，中间拖着看，右侧读参数并换漆色；
               视角按钮给的是摄影棚里真实会用的四个机位。
FIRST VIEWPORT 圆台居中偏下，车以四分之三前侧角停放；左列是 KUN 的车库清单，
               右列是参数与色板；自动旋转默认开启，一拖就停。
SIGNATURE      那块圆台光池：地面纹理由径向渐变烘出，车轮下有接触阴影，
               换车时台面不动、只有车升起来——像升降机换展品。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KUN 的车库 · 在线展厅</title>
<style>
:root{
  --bg:#0e0f11;
  --bg-1:#15171a;
  --bg-2:#1c1f23;
  --bg-3:#25292e;

  --fg:#eceae5;
  --fg-2:#a9a9a3;
  --fg-3:#7d7e79;

  --hair:rgba(236,234,229,.12);
  --hair-2:rgba(236,234,229,.24);

  --amber:#e8a13c;
  --amber-ink:#231703;

  --r-sm:5px; --r-md:9px; --r-lg:14px;

  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",
         ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
html{ color-scheme:dark; }
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,p,dl,dd,dt,ul{ margin:0; padding:0; }
ul{ list-style:none; }
button{ font:inherit; }
:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; border-radius:4px; }
.mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.sr{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0;
}

/* ==========================================================================
   布局
   ========================================================================== */
.app{
  display:grid;
  grid-template-columns:minmax(210px,258px) minmax(0,1fr) minmax(250px,306px);
  height:100dvh;
}

/* ---- 左：车库清单 ---- */
.rail{
  background:var(--bg-1);
  border-right:1px solid var(--hair);
  display:flex; flex-direction:column;
  min-height:0;
}
.owner{
  padding:1rem 1rem .9rem;
  border-bottom:1px solid var(--hair);
  display:flex; align-items:center; gap:.7rem;
}
.owner__av{
  width:38px; height:38px; flex:0 0 auto;
  border-radius:11px;
  background:linear-gradient(150deg,var(--amber),#b9721f);
  color:var(--amber-ink);
  display:grid; place-items:center;
  font-weight:800; font-size:1rem; letter-spacing:-.02em;
}
.owner b{ display:block; font-size:.9375rem; font-weight:660; letter-spacing:-.012em; }
.owner span{ display:block; font-size:.6875rem; color:var(--fg-3); letter-spacing:.14em; }

.list{ overflow-y:auto; overscroll-behavior:contain; padding:.6rem .55rem 1.2rem; flex:1 1 auto; }
.list h2{
  padding:.7rem .55rem .35rem;
  font-size:.625rem; letter-spacing:.18em; text-transform:uppercase;
  color:var(--fg-3); font-weight:640;
}
.item{
  display:grid;
  grid-template-columns:34px minmax(0,1fr);
  gap:.65rem; align-items:center;
  width:100%;
  min-height:52px;
  padding:.45rem .55rem;
  border:1px solid transparent;
  border-radius:var(--r-md);
  background:transparent;
  color:var(--fg-2);
  text-align:left;
  cursor:pointer;
  transition:background-color .16s var(--ease), color .16s var(--ease), border-color .16s var(--ease);
}
.item:hover{ background:var(--bg-2); color:var(--fg); }
.item[aria-current="true"]{
  background:var(--bg-3); color:var(--fg);
  border-color:var(--hair-2);
}
.item[aria-current="true"] .item__i{ background:var(--amber); color:var(--amber-ink); }
.item__i{
  width:34px; height:34px;
  border-radius:8px;
  background:var(--bg-3);
  color:var(--fg-2);
  display:grid; place-items:center;
  font-size:.6875rem; font-weight:700;
  letter-spacing:.02em;
}
.item b{ display:block; font-size:.875rem; font-weight:580; }
.item span{
  display:block; font-size:.6875rem; color:var(--fg-3);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* ---- 中：舞台 ---- */
.stage{ position:relative; min-width:0; background:#0b0c0d; }
#gl{ display:block; width:100%; height:100%; touch-action:none; }

.stage__top{
  position:absolute; left:0; right:0; top:0;
  padding:1rem 1.15rem;
  display:flex; align-items:flex-start; gap:1rem;
  pointer-events:none;
}
.nameplate{ pointer-events:none; }
.nameplate .brand{
  font-size:.6875rem; letter-spacing:.24em; text-transform:uppercase;
  color:var(--amber); font-weight:660;
}
.nameplate h1{
  font-size:clamp(1.15rem,2.2vw,1.65rem);
  font-weight:700; letter-spacing:-.026em; line-height:1.15;
  margin-top:.2rem;
  text-shadow:0 2px 20px rgba(0,0,0,.8);
}
.nameplate p{ font-size:.8125rem; color:var(--fg-2); margin-top:.15rem; }

.stage__bot{
  position:absolute; left:0; right:0; bottom:0;
  padding:1rem 1.15rem 1.15rem;
  display:flex; flex-wrap:wrap; align-items:center; gap:.5rem;
  justify-content:center;
}
.pill{
  min-height:42px;
  padding:0 .85rem;
  border:1px solid var(--hair-2);
  border-radius:99px;
  background:rgba(21,23,26,.82);
  backdrop-filter:blur(8px);
  color:var(--fg-2);
  font-size:.8125rem;
  cursor:pointer;
  display:inline-flex; align-items:center; gap:.45ch;
  transition:background-color .16s var(--ease), color .16s var(--ease), border-color .16s var(--ease);
}
.pill:hover{ background:var(--bg-3); color:var(--fg); }
.pill[aria-pressed="true"],
.pill[aria-current="true"]{
  background:var(--amber); border-color:var(--amber); color:var(--amber-ink); font-weight:640;
}
.pill svg{ width:14px; height:14px; }

.hint{
  position:absolute;
  left:50%; bottom:4.4rem; translate:-50% 0;
  font-size:.75rem; color:var(--fg-3);
  letter-spacing:.1em;
  pointer-events:none;
  transition:opacity .4s var(--ease);
}
.hint[data-off="true"]{ opacity:0; }

.loading{
  position:absolute; inset:0;
  display:grid; place-items:center;
  background:#0b0c0d;
  z-index:5;
  transition:opacity .5s var(--ease);
}
.loading[data-off="true"]{ opacity:0; pointer-events:none; }
.loading div{ text-align:center; }
.loading b{ display:block; font-size:.9375rem; font-weight:600; }
.loading span{ display:block; font-size:.75rem; color:var(--fg-3); margin-top:.4rem; }
.spinner{
  width:30px; height:30px; margin:0 auto 1rem;
  border:2px solid var(--hair-2); border-top-color:var(--amber);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{ to{ rotate:360deg; } }

.fail{
  position:absolute; inset:0;
  display:none; place-items:center;
  padding:2rem; text-align:center;
  background:#0b0c0d; z-index:6;
}
.fail[data-on="true"]{ display:grid; }
.fail p{ max-width:44ch; color:var(--fg-2); font-size:.9375rem; }

/* ---- 右：参数与涂漆 ---- */
.panel{
  background:var(--bg-1);
  border-left:1px solid var(--hair);
  overflow-y:auto; overscroll-behavior:contain;
  padding:1rem 1.05rem 2rem;
  min-height:0;
}
.panel h2{
  font-size:.625rem; letter-spacing:.18em; text-transform:uppercase;
  color:var(--fg-3); font-weight:640;
  margin:1.3rem 0 .6rem;
}
.panel h2:first-child{ margin-top:0; }

.specs{ border-top:1px solid var(--hair); }
.specs div{
  display:grid; grid-template-columns:minmax(0,5.6em) minmax(0,1fr);
  gap:.8rem; align-items:baseline;
  padding:.5rem 0;
  border-bottom:1px solid var(--hair);
}
.specs dt{ font-size:.75rem; color:var(--fg-3); }
.specs dd{ font-size:.875rem; font-family:var(--mono); font-variant-numeric:tabular-nums; }

.paints{ display:flex; flex-wrap:wrap; gap:.5rem; }
.paint{
  width:40px; height:40px;
  border-radius:50%;
  border:2px solid transparent;
  padding:0; cursor:pointer;
  position:relative;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5), inset 0 -8px 12px -8px rgba(0,0,0,.8),
             inset 4px 5px 8px -6px rgba(255,255,255,.9);
}
.paint[aria-pressed="true"]{ border-color:var(--fg); }
.paint[aria-pressed="true"]::after{
  content:""; position:absolute; left:50%; top:46%;
  width:6px; height:11px;
  border:solid #fff; border-width:0 2px 2px 0;
  translate:-50% -50%; rotate:45deg;
  filter:drop-shadow(0 0 2px rgba(0,0,0,.9));
}
.paintname{ margin-top:.55rem; font-size:.75rem; color:var(--fg-2); }

.toggle{
  display:flex; align-items:center; gap:.7rem;
  padding:.7rem .8rem;
  border:1px solid var(--hair);
  border-radius:var(--r-md);
  background:var(--bg-2);
  margin-top:.6rem;
  width:100%;
  color:inherit; text-align:left; cursor:pointer;
}
.toggle b{ font-size:.875rem; font-weight:560; }
.toggle span{ display:block; font-size:.6875rem; color:var(--fg-3); }
.sw{
  margin-left:auto;
  position:relative; width:42px; height:25px; flex:0 0 auto;
  border-radius:99px; background:var(--bg-3);
  box-shadow:inset 0 0 0 1px var(--hair-2);
  transition:background-color .18s var(--ease);
}
.sw::after{
  content:""; position:absolute; top:3px; left:3px;
  width:19px; height:19px; border-radius:50%;
  background:var(--fg);
  transition:translate .18s var(--ease);
}
.toggle[aria-pressed="true"] .sw{ background:var(--amber); }
.toggle[aria-pressed="true"] .sw::after{ translate:17px 0; background:var(--amber-ink); }

.note{ margin-top:1rem; font-size:.6875rem; color:var(--fg-3); line-height:1.6; }

/* ==========================================================================
   响应式
   ========================================================================== */
@media (max-width:1080px){
  .app{ grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto; }
  .rail{ border-right:0; border-bottom:1px solid var(--hair); }
  .list{ display:flex; gap:.4rem; overflow-x:auto; padding:.6rem; }
  .list h2{ display:none; }
  .item{ grid-template-columns:auto; min-width:110px; }
  .item__i{ display:none; }
  .panel{ border-left:0; border-top:1px solid var(--hair); max-height:38dvh; }
  .owner{ padding:.7rem 1rem; }
}
@media (prefers-reduced-motion:reduce){
  .spinner{ animation-duration:2.4s; }
  .pill,.item,.sw,.toggle{ transition:none; }
}
</style>
</head>
<body>

<div class="app">

  <!-- ==================== 左 ==================== -->
  <aside class="rail">
    <div class="owner">
      <span class="owner__av" aria-hidden="true">K</span>
      <span><b>KUN 的车库</b><span>PRIVATE COLLECTION</span></span>
    </div>
    <nav class="list" id="list" aria-label="车库中的载具"></nav>
  </aside>

  <!-- ==================== 中 ==================== -->
  <main class="stage">
    <canvas id="gl"></canvas>

    <div class="stage__top">
      <div class="nameplate">
        <p class="brand" id="npBrand">—</p>
        <h1 id="npName">—</h1>
        <p id="npSub">—</p>
      </div>
    </div>

    <p class="hint" id="hint">按住拖动可换角度 · 滚轮缩放</p>

    <div class="stage__bot" id="viewBar" role="group" aria-label="视角与展示"></div>

    <div class="loading" id="loading">
      <div>
        <span class="spinner" aria-hidden="true"></span>
        <b>正在布置展厅</b>
        <span>加载渲染引擎与灯光</span>
      </div>
    </div>

    <div class="fail" id="fail">
      <p>
        三维引擎没能加载成功。这个页面需要连接到 CDN 获取 three.js，
        并且需要浏览器支持 WebGL。请检查网络后刷新，或换用较新的浏览器。
      </p>
    </div>
  </main>

  <!-- ==================== 右 ==================== -->
  <aside class="panel">
    <h2>参数</h2>
    <dl class="specs" id="specs"></dl>

    <h2>涂漆</h2>
    <div class="paints" id="paints" role="group" aria-label="选择涂漆颜色"></div>
    <p class="paintname" id="paintName">—</p>

    <h2>展示</h2>
    <button class="toggle" type="button" id="riderBtn" aria-pressed="true">
      <span><b>显示驾驶者</b><span>Q 版卡通人物</span></span>
      <span class="sw" aria-hidden="true"></span>
    </button>
    <button class="toggle" type="button" id="rotBtn" aria-pressed="true">
      <span><b>自动旋转</b><span>拖动时自动停止</span></span>
      <span class="sw" aria-hidden="true"></span>
    </button>

    <p class="note">
      全部载具为程序化建模的示意造型，用于展示交互与材质，非官方数模；
      参数为演示占位数据，不代表任何厂商的官方标称值。
    </p>
  </aside>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (id) => document.getElementById(id);

/* ==========================================================================
   1. 渲染器 / 场景 / 灯光
   ========================================================================== */
let renderer, scene, camera, controls, stageGroup, current = null;

try {
  renderer = new THREE.WebGLRenderer({
    canvas: $('gl'), antialias: true, alpha: false, powerPreference: 'high-performance'
  });
} catch (e) {
  $('fail').dataset.on = 'true';
  $('loading').dataset.off = 'true';
  throw e;
}

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c0d);
scene.fog = new THREE.Fog(0x0b0c0d, 16, 40);

camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
camera.position.set(5.4, 2.3, 6.4);

controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3.2;
controls.maxDistance = 16;
controls.minPolarAngle = 0.18;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 0.75, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.enablePan = false;

/* 环境反射：车漆的质感几乎全靠它 */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* 灯 */
const key = new THREE.SpotLight(0xfff2dd, 130, 40, Math.PI * 0.28, 0.55, 1.6);
key.position.set(4.5, 8.5, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.02;
scene.add(key, key.target);

const fill = new THREE.SpotLight(0xdce8ff, 42, 34, Math.PI * 0.34, 0.7, 1.6);
fill.position.set(-6, 5.4, -3.4);
scene.add(fill);

const rimL = new THREE.PointLight(0xffd9a0, 26, 22, 2);
rimL.position.set(-4.4, 1.6, 4.2);
scene.add(rimL);

const rimR = new THREE.PointLight(0xa9c8ff, 22, 22, 2);
rimR.position.set(4.8, 1.4, -4.6);
scene.add(rimR);

scene.add(new THREE.HemisphereLight(0x8899aa, 0x14161a, 0.32));

/* ==========================================================================
   2. 地面：圆台 + 光池 + 接触阴影
   ========================================================================== */
function poolTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#0b0c0d';
  g.fillRect(0, 0, 512, 512);
  const rad = g.createRadialGradient(256, 256, 20, 256, 256, 250);
  rad.addColorStop(0, '#4a4640');
  rad.addColorStop(0.42, '#2a2825');
  rad.addColorStop(0.78, '#141516');
  rad.addColorStop(1, '#0b0c0d');
  g.fillStyle = rad;
  g.beginPath(); g.arc(256, 256, 250, 0, Math.PI * 2); g.fill();
  // 台面细纹
  g.globalAlpha = 0.05;
  g.strokeStyle = '#ffffff';
  for (let i = 0; i < 90; i++){
    g.beginPath();
    g.arc(256, 256, 30 + i * 2.5, 0, Math.PI * 2);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(9, 96),
  new THREE.MeshStandardMaterial({
    map: poolTexture(), roughness: 0.42, metalness: 0.28, color: 0xffffff
  })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

/* 圆台边缘的一圈琥珀灯带 */
const ring = new THREE.Mesh(
  new THREE.TorusGeometry(3.62, 0.024, 10, 160),
  new THREE.MeshBasicMaterial({ color: 0xe8a13c })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.012;
scene.add(ring);

const ringGlow = new THREE.Mesh(
  new THREE.RingGeometry(3.3, 3.9, 96),
  new THREE.MeshBasicMaterial({ color: 0xe8a13c, transparent: true, opacity: 0.09,
    side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false })
);
ringGlow.rotation.x = -Math.PI / 2;
ringGlow.position.y = 0.008;
scene.add(ringGlow);

stageGroup = new THREE.Group();
scene.add(stageGroup);

/* ==========================================================================
   3. 材质工厂
   ========================================================================== */
const M = {
  paint(color){
    const m = new THREE.MeshPhysicalMaterial({
      color, metalness: 0.62, roughness: 0.24,
      clearcoat: 1, clearcoatRoughness: 0.035,
      envMapIntensity: 1.25
    });
    m.userData.isPaint = true;
    return m;
  },
  matte(color, rough = 0.86){
    return new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0.06 });
  },
  chrome(){
    return new THREE.MeshPhysicalMaterial({ color: 0xdfe4e8, metalness: 1, roughness: 0.09, envMapIntensity: 1.6 });
  },
  dark(){
    return new THREE.MeshStandardMaterial({ color: 0x16181a, roughness: 0.62, metalness: 0.35 });
  },
  rubber(){
    return new THREE.MeshStandardMaterial({ color: 0x131416, roughness: 0.94, metalness: 0.02 });
  },
  glass(){
    return new THREE.MeshPhysicalMaterial({
      color: 0x1c242c, metalness: 0.1, roughness: 0.06,
      transmission: 0.72, thickness: 0.4, ior: 1.45,
      transparent: true, opacity: 0.86, envMapIntensity: 1.5
    });
  },
  glow(color, i = 2.2){
    return new THREE.MeshStandardMaterial({
      color, emissive: color, emissiveIntensity: i, roughness: 0.4, metalness: 0
    });
  },
  skin(){ return new THREE.MeshStandardMaterial({ color: 0xf0c39a, roughness: 0.72 }); },
  cloth(c){ return new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 }); }
};

/* 几何小工具 */
function mesh(geo, mat, x = 0, y = 0, z = 0){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function box(w, h, d, mat, x, y, z, r = 0.02){
  return mesh(new THREE.BoxGeometry(w, h, d, 1, 1, 1), mat, x, y, z);
}
function cyl(rt, rb, h, mat, x, y, z, seg = 24){
  return mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat, x, y, z);
}
function sph(r, mat, x, y, z, seg = 24){
  return mesh(new THREE.SphereGeometry(r, seg, seg * 0.6), mat, x, y, z);
}
function cap(r, len, mat, x, y, z){
  return mesh(new THREE.CapsuleGeometry(r, len, 8, 16), mat, x, y, z);
}
function tor(r, t, mat, x, y, z, seg = 16, rad = 32){
  return mesh(new THREE.TorusGeometry(r, t, seg, rad), mat, x, y, z);
}

/* 从侧视轮廓挤出车身：这是让形体像车的关键 */
function extrude(points, depth, mat, bevel = 0.06){
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++){
    const p = points[i];
    if (p.length === 4) shape.quadraticCurveTo(p[0], p[1], p[2], p[3]);
    else shape.lineTo(p[0], p[1]);
  }
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: depth - bevel * 2, bevelEnabled: true,
    bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: 24
  });
  geo.translate(0, 0, -(depth / 2) + bevel);
  geo.rotateY(-Math.PI / 2);   // 侧视轮廓的 +X（车头）转到世界 +Z，与车轮的前后一致
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

/* 车轮 */
function wheel(radius, width, opts = {}){
  const g = new THREE.Group();
  const tire = mesh(new THREE.CylinderGeometry(radius, radius, width, 40), M.rubber());
  tire.rotation.z = Math.PI / 2;
  g.add(tire);

  // 胎面
  const tread = mesh(new THREE.TorusGeometry(radius * 0.995, width * 0.5, 6, 48),
    new THREE.MeshStandardMaterial({ color: 0x0e0f10, roughness: 0.98 }));
  tread.rotation.y = Math.PI / 2;
  g.add(tread);

  const rimR = radius * (opts.rimRatio || 0.62);
  const rimMat = opts.rimMat || M.chrome();
  const rim = mesh(new THREE.CylinderGeometry(rimR, rimR, width * 1.02, 32), rimMat);
  rim.rotation.z = Math.PI / 2;
  g.add(rim);

  const spokes = opts.spokes ?? 5;
  for (let i = 0; i < spokes; i++){
    const s = mesh(new THREE.BoxGeometry(rimR * 1.7, width * 0.34, 0.035), rimMat, 0, 0, 0);
    s.rotation.x = (i / spokes) * Math.PI * 2;
    s.rotation.y = Math.PI / 2;
    g.add(s);
  }
  const hub = cyl(rimR * 0.26, rimR * 0.26, width * 1.1, M.dark(), 0, 0, 0, 16);
  hub.rotation.z = Math.PI / 2;
  g.add(hub);

  if (opts.disc){
    const d = cyl(radius * 0.5, radius * 0.5, width * 0.12, M.chrome(), 0, 0, 0, 28);
    d.rotation.z = Math.PI / 2;
    g.add(d);
  }
  return g;
}

/* 辐条轮（自行车 / 机车） */
function spokeWheel(radius, width, rimMat){
  const g = new THREE.Group();
  const tire = mesh(new THREE.TorusGeometry(radius, width * 0.5, 10, 44), M.rubber());
  tire.rotation.y = Math.PI / 2;
  g.add(tire);
  const rim = mesh(new THREE.TorusGeometry(radius * 0.9, width * 0.22, 8, 44), rimMat || M.chrome());
  rim.rotation.y = Math.PI / 2;
  g.add(rim);
  for (let i = 0; i < 16; i++){
    const s = mesh(new THREE.CylinderGeometry(0.006, 0.006, radius * 1.75, 5), M.chrome());
    s.rotation.x = (i / 16) * Math.PI * 2;   // 轮轴沿 X，辐条必须落在 YZ 平面
    g.add(s);
  }
  g.add(cyl(radius * 0.11, radius * 0.11, width * 1.6, M.chrome(), 0, 0, 0, 14)
    .rotateZ(Math.PI / 2));
  return g;
}

/* ---------- 通用四轮车装配 ---------- */
function buildCar(cfg, paint){
  const g = new THREE.Group();
  const pm = M.paint(paint);

  const lower = extrude(cfg.body, cfg.width, pm, cfg.bevel ?? 0.055);
  g.add(lower);

  if (cfg.cabin){
    const cabin = extrude(cfg.cabin, cfg.width * (cfg.cabinRatio ?? 0.86), pm, 0.05);
    g.add(cabin);
  }
  if (cfg.glass){
    const gl = extrude(cfg.glass, cfg.width * (cfg.glassRatio ?? 0.9), M.glass(), 0.02);
    g.add(gl);
  }

  // 车轮
  const wr = cfg.wheelR, ww = cfg.wheelW;
  cfg.wheels.forEach(([z, front]) => {
    [-1, 1].forEach(s => {
      const w = wheel(wr, ww, {
        spokes: cfg.spokes ?? 5,
        rimMat: cfg.rimMat ? cfg.rimMat() : M.chrome(),
        rimRatio: cfg.rimRatio ?? 0.62,
        disc: true
      });
      w.position.set(s * (cfg.width / 2 - ww * 0.42), wr, z);
      g.add(w);
    });
    // 轮拱阴影
    [-1, 1].forEach(s => {
      const arch = mesh(new THREE.TorusGeometry(wr * 1.12, 0.035, 8, 24, Math.PI),
        M.matte(0x101214, 0.9), s * (cfg.width / 2 - ww * 0.42), wr, z);
      arch.rotation.y = Math.PI / 2;
      g.add(arch);
    });
  });

  // 灯
  (cfg.lights || []).forEach(L => {
    const [x, y, z, w, h, d, color, i] = L;
    [-1, 1].forEach(s => {
      if (x === 0 && s === -1) return;
      g.add(box(w, h, d, M.glow(color, i), s * x, y, z));
    });
  });

  // 细节：门缝、格栅、后视镜
  (cfg.details || []).forEach(fn => fn(g, pm, cfg));

  return g;
}

function buildArmor(paint){
  const g = new THREE.Group();
  const red = M.paint(paint);
  const gold = M.paint(0xd8a92e);
  const dark = M.matte(0x2a2d31, 0.5);
  const arc = M.glow(0x8fe6ff, 3.2);

  // 腿
  [-1, 1].forEach(s => {
    g.add(cap(0.115, 0.30, red, s * 0.16, 0.52, 0));
    g.add(cap(0.10, 0.28, gold, s * 0.16, 0.20, 0.01));
    g.add(box(0.20, 0.10, 0.34, gold, s * 0.16, 0.05, 0.06));
    g.add(tor(0.13, 0.035, gold, s * 0.16, 0.36, 0, 8, 20).rotateY(Math.PI / 2));
  });
  // 髋与腰
  g.add(box(0.44, 0.20, 0.26, gold, 0, 0.80, 0));
  g.add(box(0.40, 0.16, 0.24, dark, 0, 0.94, 0));

  // 胸
  const chest = mesh(new THREE.CapsuleGeometry(0.26, 0.20, 10, 24), red, 0, 1.20, 0);
  chest.scale.set(1.18, 1, 0.78);
  g.add(chest);
  g.add(box(0.34, 0.20, 0.12, gold, 0, 1.30, 0.16));

  // 方舟反应堆
  g.add(cyl(0.085, 0.085, 0.06, M.chrome(), 0, 1.24, 0.20, 20).rotateX(Math.PI / 2));
  g.add(cyl(0.062, 0.062, 0.075, arc, 0, 1.24, 0.215, 20).rotateX(Math.PI / 2));
  const arcLight = new THREE.PointLight(0x8fe6ff, 3.2, 3.2, 2);
  arcLight.position.set(0, 1.24, 0.30);
  g.add(arcLight);

  // 肩甲与手臂
  [-1, 1].forEach(s => {
    const sh = sph(0.155, red, s * 0.34, 1.34, 0, 20);
    sh.scale.set(1, 0.9, 1);
    g.add(sh);
    g.add(cap(0.085, 0.20, gold, s * 0.38, 1.10, 0));
    g.add(cap(0.075, 0.20, red, s * 0.40, 0.82, 0.02));
    g.add(box(0.14, 0.13, 0.20, gold, s * 0.41, 0.64, 0.04));
    // 掌心炮
    g.add(cyl(0.038, 0.038, 0.03, arc, s * 0.41, 0.60, 0.12, 14).rotateX(Math.PI / 2));
  });

  // 颈与头盔
  g.add(cyl(0.09, 0.09, 0.10, dark, 0, 1.44, 0, 16));
  const helm = sph(0.175, red, 0, 1.58, 0, 26);
  helm.scale.set(0.95, 1.1, 1);
  g.add(helm);
  const face = mesh(new THREE.SphereGeometry(0.165, 26, 18, -0.85, 1.7, 0.5, 0.85), gold);
  face.position.set(0, 1.58, 0.012);
  face.rotation.y = Math.PI;
  face.scale.set(0.95, 1.1, 1);
  g.add(face);
  // 眼
  [-1, 1].forEach(s => {
    const e = box(0.055, 0.022, 0.02, arc, s * 0.062, 1.605, 0.163);
    e.rotation.z = s * 0.12;
    g.add(e);
  });

  // 背部推进器
  [-1, 1].forEach(s => {
    g.add(cyl(0.055, 0.07, 0.10, dark, s * 0.16, 1.26, -0.20, 16).rotateX(Math.PI / 2));
    g.add(cyl(0.042, 0.042, 0.03, arc, s * 0.16, 1.26, -0.26, 14).rotateX(Math.PI / 2));
  });

  // 展台底座
  g.add(cyl(0.62, 0.68, 0.06, M.matte(0x1a1d20, 0.5), 0, 0.03, 0, 40));
  g.add(tor(0.64, 0.012, M.glow(0xe8a13c, 1.6), 0, 0.062, 0, 8, 60).rotateX(Math.PI / 2));

  return g;
}

let idx = 0, paintIdx = 0, showRider = true;
let tween = null;

function applyPaint(root, color){
  root.traverse(o => {
    if (o.isMesh && o.material && o.material.userData && o.material.userData.isPaint){
      o.material.color.setHex(color);
    }
  });
}

function setRiderVisible(root, on){
  root.traverse(o => { if (o.userData && o.userData.isRider) o.visible = on; });
}

function load(i, keepPaint){
  const v = GARAGE[i];
  idx = i;
  if (!keepPaint) paintIdx = 0;

  if (current){ stageGroup.remove(current); disposeTree(current); }
  current = v.build(v.paints[paintIdx].c);
  current.position.y = 0;
  stageGroup.add(current);
  setRiderVisible(current, showRider);

  // 升降机式入场
  current.position.y = -1.2;
  const t0 = performance.now();
  const rise = () => {
    const k = Math.min(1, (performance.now() - t0) / 620);
    const e = 1 - Math.pow(1 - k, 3);
    current.position.y = -1.2 * (1 - e);
    if (k < 1) requestAnimationFrame(rise);
  };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) current.position.y = 0;
  else rise();

  controls.target.set(0, v.target, 0);
  goView(viewIndex, true);

  // UI
  $('npBrand').textContent = v.brand;
  $('npName').textContent = v.name;
  $('npSub').textContent = v.sub;

  const specs = $('specs');
  specs.textContent = '';
  v.specs.forEach(([k, val]) => {
    const d = document.createElement('div');
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = val;
    d.appendChild(dt); d.appendChild(dd);
    specs.appendChild(d);
  });

  const pw = $('paints');
  pw.textContent = '';
  v.paints.forEach((p, pi) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'paint';
    b.style.background = '#' + p.c.toString(16).padStart(6, '0');
    b.setAttribute('aria-pressed', String(pi === paintIdx));
    b.setAttribute('aria-label', '涂漆 ' + p.n);
    b.addEventListener('click', () => {
      paintIdx = pi;
      applyPaint(current, p.c);
      [...pw.children].forEach((c, ci) => c.setAttribute('aria-pressed', String(ci === pi)));
      $('paintName').textContent = p.n;
    });
    pw.appendChild(b);
  });
  $('paintName').textContent = v.paints[paintIdx].n;

  [...$('list').querySelectorAll('.item')].forEach((b, bi) => {
    b.setAttribute('aria-current', String(bi === i));
  });
}

function disposeTree(root){
  root.traverse(o => {
    if (o.isMesh){
      o.geometry.dispose();
      if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material.dispose();
    }
  });
}

/* 视角切换：球坐标插值 */
function goView(i, instant){
  viewIndex = i;
  const v = GARAGE[idx], V0 = VIEWS[i];
  const d = v.camDist * V0.d;
  const to = new THREE.Vector3(
    Math.sin(V0.az) * Math.cos(V0.el) * d,
    Math.sin(V0.el) * d + v.target * 0.2,
    Math.cos(V0.az) * Math.cos(V0.el) * d
  );
  [...$('viewBar').querySelectorAll('[data-view]')].forEach((b, bi) => {
    b.setAttribute('aria-current', String(bi === i));
  });

  if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches){
    camera.position.copy(to);
    return;
  }
  const from = camera.position.clone();
  const t0 = performance.now();
  tween = () => {
    const k = Math.min(1, (performance.now() - t0) / 720);
    const e = k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
    camera.position.lerpVectors(from, to, e);
    if (k >= 1) tween = null;
  };
}

/* ==========================================================================
   9. UI 构建
   ========================================================================== */
(function buildUI(){
  const list = $('list');
  const h = document.createElement('h2');
  h.textContent = '在库 ' + GARAGE.length + ' 台';
  list.appendChild(h);

  GARAGE.forEach((v, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'item';
    b.setAttribute('aria-current', String(i === 0));
    const ic = document.createElement('span');
    ic.className = 'item__i'; ic.textContent = v.tag;
    const tx = document.createElement('span');
    const nb = document.createElement('b'); nb.textContent = v.name;
    const ns = document.createElement('span'); ns.textContent = v.sub;
    tx.appendChild(nb); tx.appendChild(ns);
    b.appendChild(ic); b.appendChild(tx);
    b.addEventListener('click', () => load(i, false));
    list.appendChild(b);
  });

  const bar = $('viewBar');
  VIEWS.forEach((v, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pill';
    b.dataset.view = i;
    b.textContent = v.n;
    b.setAttribute('aria-current', String(i === 0));
    b.addEventListener('click', () => goView(i, false));
    bar.appendChild(b);
  });

  const reset = document.createElement('button');
  reset.type = 'button';
  reset.className = 'pill';
  reset.textContent = '复位';
  reset.addEventListener('click', () => { goView(0, false); controls.autoRotate = true; syncRot(); });
  bar.appendChild(reset);
})();

function syncRot(){
  $('rotBtn').setAttribute('aria-pressed', String(controls.autoRotate));
}

$('rotBtn').addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  syncRot();
});
$('riderBtn').addEventListener('click', function(){
  showRider = !showRider;
  this.setAttribute('aria-pressed', String(showRider));
  if (current) setRiderVisible(current, showRider);
});

controls.addEventListener('start', () => {
  controls.autoRotate = false;
  syncRot();
  $('hint').dataset.off = 'true';
});

/* 键盘：上下切换载具 */
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowDown'){ e.preventDefault(); load((idx + 1) % GARAGE.length, false); }
  if (e.key === 'ArrowUp'){ e.preventDefault(); load((idx - 1 + GARAGE.length) % GARAGE.length, false); }
});

/* ==========================================================================
   10. 循环
   ========================================================================== */
function resize(){
  const el = renderer.domElement;
  const w = el.clientWidth, h = el.clientHeight;
  if (w === 0 || h === 0) return;
  if (el.width !== w * renderer.getPixelRatio() || el.height !== h * renderer.getPixelRatio()){
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}

function loop(){
  resize();
  if (tween) tween();
  key.target.position.set(0, 0.6, 0);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

load(0, false);
syncRot();
loop();

setTimeout(() => { $('loading').dataset.off = 'true'; }, 380);
setTimeout(() => { $('hint').dataset.off = 'true'; }, 7000);
</script>
