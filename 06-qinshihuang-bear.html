<!DOCTYPE html>
<!--
DIRECTION CONTRACT
THESIS         反差叙事：把冕旒玄袍的秦制仪轨原样搬到极夜雪原的熊背上，严肃对待两边的形制。
               拒绝把这个题材做成表情包式简笔画。
OWN-WORLD      极夜靛蓝三阶 + 冰面冷白 + 玄袍黑金 + 朱色披风；暖色配额只给金与朱两处。
STORY          观者先认出极光与熊，再发现骑手的冕旒随步伐摆动，最后读到左上题名「祖龍馭雪」。
FIRST VIEWPORT 熊居中偏左行进；骑手位于视觉中心略高处；极光斜贯上方；
               冰山退至地平线；左上竖排题名，左下朱印。
SIGNATURE      七串冕旒——与熊步频同周期、逐串延迟摆动，是全画唯一的「精密」动作。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>祖龍馭雪 · 秦始皇骑北极熊</title>
<style>
/* ==========================================================================
   祖龍馭雪 —— 秦始皇骑北极熊 · 纯 CSS 2D 动画
   全部图形由 div + border-radius / clip-path / gradient 绘制，无图片无 SVG。
   缩放方案：容器查询单位 cqw —— 1cqw = 舞台宽度的 1%，
   所有尺寸以 cqw 表达，因此整幅画随容器等比缩放，无需 JS。
   ========================================================================== */

*{ margin:0; padding:0; box-sizing:border-box; }

:root{
  --fur:#f6f9fd;
  --fur-mid:#dfe8f4;
  --fur-dark:#bcccdf;
  --fur-shadow:#9db0c8;

  --robe:#17141f;
  --robe-hi:#2a2436;
  --gold:#d8b25e;
  --gold-hi:#f2dd9e;
  --skin:#e8c39a;
  --skin-sh:#c99f74;

  --ice:#dbe8f6;
  --ice-deep:#a8c2dd;
  --night-1:#050914;
  --night-2:#0c1830;
  --night-3:#132546;
}

body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:clamp(10px,3vw,40px);
  background:radial-gradient(120% 100% at 50% 0%, #0d1730, #04070f 70%);
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
}

/* ---------- 舞台 ---------- */
.stage{
  container-type:size;
  position:relative;
  width:min(100%,1180px);
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:6px;
  background:linear-gradient(180deg,var(--night-1) 0%,var(--night-2) 46%,var(--night-3) 74%);
  box-shadow:0 40px 100px -32px rgba(0,0,0,.9), 0 0 0 1px rgba(140,180,230,.16);
}

/* ==========================================================================
   1. 天空：星 · 极光 · 月
   ========================================================================== */
.stars{
  position:absolute; inset:0 0 42% 0;
  background-image:
    radial-gradient(1.4px 1.4px at 8% 18%,  #fff,transparent),
    radial-gradient(1px 1px     at 21% 42%, #cfe4ff,transparent),
    radial-gradient(1.6px 1.6px at 34% 12%, #fff,transparent),
    radial-gradient(1px 1px     at 47% 34%, #bcd8ff,transparent),
    radial-gradient(1.3px 1.3px at 61% 8%,  #fff,transparent),
    radial-gradient(1px 1px     at 73% 30%, #d8e9ff,transparent),
    radial-gradient(1.5px 1.5px at 86% 16%, #fff,transparent),
    radial-gradient(1px 1px     at 94% 40%, #c4dcff,transparent),
    radial-gradient(1.2px 1.2px at 15% 62%, #fff,transparent),
    radial-gradient(1px 1px     at 55% 58%, #cfe4ff,transparent);
  background-size:44% 60%;
  animation:twinkle 4.5s ease-in-out infinite alternate;
}
@keyframes twinkle{ from{opacity:.45;} to{opacity:1;} }

.moon{
  position:absolute;
  right:12cqw; top:5cqw;
  width:7cqw; aspect-ratio:1;
  border-radius:50%;
  background:radial-gradient(circle at 34% 32%, #fdfbf2, #dfe6f2 58%, #b9c6da);
  box-shadow:0 0 6cqw 1.6cqw rgba(206,225,255,.30), 0 0 14cqw 5cqw rgba(150,190,240,.14);
}
/* 月面环形山 */
.moon::after{
  content:"";
  position:absolute; inset:0; border-radius:50%;
  background-image:
    radial-gradient(1.1cqw 1.1cqw at 62% 38%, rgba(150,163,182,.45),transparent 70%),
    radial-gradient(.7cqw .7cqw  at 38% 62%, rgba(150,163,182,.4), transparent 70%),
    radial-gradient(.5cqw .5cqw  at 70% 68%, rgba(150,163,182,.35),transparent 70%);
}

/* 极光：两层高斯模糊的斜向色带 */
.aurora{
  position:absolute;
  left:-20%; right:-20%;
  top:-6cqw; height:34cqw;
  filter:blur(3.4cqw);
  mix-blend-mode:screen;
  pointer-events:none;
}
.aurora--1{
  background:linear-gradient(94deg,
    transparent 4%, rgba(72,235,182,.52) 22%,
    rgba(96,204,255,.42) 40%, transparent 54%,
    rgba(150,120,255,.36) 70%, transparent 88%);
  transform:skewY(-6deg);
  animation:auroraA 16s ease-in-out infinite alternate;
}
.aurora--2{
  top:1cqw; height:26cqw;
  background:linear-gradient(88deg,
    transparent 10%, rgba(126,255,206,.34) 30%,
    transparent 46%, rgba(88,180,255,.30) 62%, transparent 84%);
  transform:skewY(5deg);
  animation:auroraB 23s ease-in-out infinite alternate;
}
@keyframes auroraA{
  from{ transform:skewY(-6deg) translateX(-4cqw) scaleY(.9); opacity:.65; }
  to  { transform:skewY(-9deg) translateX(5cqw)  scaleY(1.18); opacity:1; }
}
@keyframes auroraB{
  from{ transform:skewY(5deg) translateX(4cqw)  scaleY(1.1); opacity:.4; }
  to  { transform:skewY(2deg) translateX(-5cqw) scaleY(.86); opacity:.85; }
}

/* ==========================================================================
   2. 远景冰山 + 地面
   ========================================================================== */
.bergs{
  position:absolute;
  left:0; right:0; bottom:38%;
  height:16cqw;
}
.berg{
  position:absolute; bottom:0;
  background:linear-gradient(180deg,#2b4570,#1a2c4c);
  box-shadow:0 0 2cqw rgba(120,170,230,.2);
}
.berg::after{ /* 迎光面 */
  content:""; position:absolute; inset:0;
  background:linear-gradient(100deg, rgba(174,214,255,.5) 0 26%, transparent 42%);
}
.berg--1{ left:2cqw;  width:22cqw; height:11cqw; clip-path:polygon(0 100%,14% 40%,30% 58%,48% 8%,66% 46%,84% 24%,100% 100%); }
.berg--2{ left:26cqw; width:16cqw; height:7cqw;  clip-path:polygon(0 100%,20% 42%,44% 66%,62% 18%,86% 54%,100% 100%); opacity:.8; }
.berg--3{ right:6cqw; width:26cqw; height:13cqw; clip-path:polygon(0 100%,12% 52%,26% 26%,44% 60%,60% 14%,78% 48%,92% 32%,100% 100%); }
.berg--4{ right:30cqw;width:14cqw; height:6cqw;  clip-path:polygon(0 100%,26% 40%,52% 64%,74% 22%,100% 100%); opacity:.7; }

.ground{
  position:absolute;
  left:0; right:0; bottom:0;
  height:40%;
  background:
    linear-gradient(180deg, #f0f6ff 0%, var(--ice) 22%, var(--ice-deep) 78%, #7f9bbb 100%);
  border-top:.28cqw solid rgba(255,255,255,.9);
}
/* 冰面裂纹与起伏 */
.ground::before{
  content:""; position:absolute; inset:0;
  background-image:
    linear-gradient(94deg,  transparent 18%, rgba(120,150,185,.30) 20%, transparent 22%),
    linear-gradient(86deg,  transparent 52%, rgba(120,150,185,.24) 54%, transparent 56%),
    linear-gradient(100deg, transparent 74%, rgba(120,150,185,.20) 76%, transparent 78%),
    radial-gradient(60% 40% at 30% 60%, rgba(255,255,255,.55), transparent 70%),
    radial-gradient(50% 34% at 76% 74%, rgba(255,255,255,.4), transparent 72%);
}
/* 地面反光（极光倒影） */
.ground::after{
  content:""; position:absolute; left:0; right:0; top:0; height:46%;
  background:linear-gradient(92deg, transparent 8%, rgba(96,235,190,.16) 26%, transparent 44%, rgba(120,170,255,.14) 64%, transparent 86%);
  filter:blur(1.4cqw);
  animation:auroraA 16s ease-in-out infinite alternate;
}

/* ==========================================================================
   3. 飘雪：三层不同速度 / 大小
   ========================================================================== */
.snow{ position:absolute; inset:-10% -10% -10% -10%; pointer-events:none; }
.snow--far{
  background-image:
    radial-gradient(1.1px 1.1px at 12% 18%,#fff,transparent),
    radial-gradient(1px 1px     at 38% 62%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 64% 30%,#fff,transparent),
    radial-gradient(1px 1px     at 86% 74%,#fff,transparent),
    radial-gradient(1.1px 1.1px at 24% 88%,#fff,transparent),
    radial-gradient(1px 1px     at 74% 8%, #fff,transparent);
  background-size:19cqw 19cqw;
  opacity:.45;
  animation:snowfall 17s linear infinite;
}
.snow--mid{
  background-image:
    radial-gradient(1.8px 1.8px at 20% 26%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 52% 70%,#fff,transparent),
    radial-gradient(2px 2px     at 78% 14%,#fff,transparent),
    radial-gradient(1.6px 1.6px at 34% 86%,#fff,transparent),
    radial-gradient(1.4px 1.4px at 92% 50%,#fff,transparent);
  background-size:26cqw 26cqw;
  opacity:.7;
  animation:snowfall 11s linear infinite;
}
.snow--near{
  background-image:
    radial-gradient(2.8px 2.8px at 16% 34%,#fff,transparent),
    radial-gradient(2.4px 2.4px at 58% 78%,#fff,transparent),
    radial-gradient(3px 3px     at 84% 22%,#fff,transparent),
    radial-gradient(2.2px 2.2px at 40% 58%,#fff,transparent);
  background-size:36cqw 36cqw;
  opacity:.9;
  filter:blur(.4px);
  animation:snowfall 7s linear infinite;
}
@keyframes snowfall{
  from{ background-position:0 0; }
  to  { background-position:-6cqw 40cqw; }
}

/* ==========================================================================
   4. 北极熊
   ========================================================================== */
.bear{
  position:absolute;
  left:22cqw; top:19cqw;
  width:56cqw; height:26cqw;
  animation:bearBob 1.05s ease-in-out infinite alternate;
  filter:drop-shadow(0 1.2cqw 1.6cqw rgba(20,40,70,.35));
}
@keyframes bearBob{
  from{ transform:translateY(0)      rotate(-.5deg); }
  to  { transform:translateY(-.9cqw) rotate(.5deg); }
}

/* --- 四肢（先画远侧，被躯干遮住） --- */
.leg{
  position:absolute;
  border-radius:44% 44% 34% 34% / 22% 22% 40% 40%;
  transform-origin:50% 6%;
}
.leg::after{ /* 脚掌 */
  content:"";
  position:absolute;
  left:-14%; bottom:-3%;
  width:128%; height:20%;
  border-radius:40% 44% 48% 48%;
  background:inherit;
  filter:brightness(.93);
}
.leg--far{
  background:linear-gradient(96deg,var(--fur-shadow),var(--fur-dark));
  z-index:1;
}
.leg--near{
  background:linear-gradient(96deg,var(--fur),var(--fur-mid) 62%,var(--fur-dark));
  z-index:4;
}
.leg--fl{ left:62%; top:56%; width:9%;  height:44%; animation:stepA 1.05s ease-in-out infinite alternate; }
.leg--bl{ left:15%; top:56%; width:10%; height:44%; animation:stepB 1.05s ease-in-out infinite alternate; }
.leg--fr{ left:57%; top:57%; width:8.4%;height:42%; animation:stepB 1.05s ease-in-out infinite alternate; }
.leg--br{ left:9%;  top:57%; width:9.4%;height:42%; animation:stepA 1.05s ease-in-out infinite alternate; }

@keyframes stepA{ from{ transform:rotate(-17deg);} to{ transform:rotate(15deg);} }
@keyframes stepB{ from{ transform:rotate(16deg);}  to{ transform:rotate(-16deg);} }

/* --- 躯干 --- */
.bear__body{
  position:absolute;
  left:6%; top:26%;
  width:66%; height:52%;
  border-radius:48% 44% 46% 50% / 54% 50% 48% 52%;
  background:
    radial-gradient(70% 90% at 34% 26%, #ffffff, transparent 62%),
    linear-gradient(172deg, var(--fur) 0%, var(--fur-mid) 58%, var(--fur-dark) 100%);
  z-index:3;
}
/* 毛质：短促斜纹 */
.bear__body::after,
.bear__hump::after{
  content:"";
  position:absolute; inset:0;
  border-radius:inherit;
  background-image:repeating-linear-gradient(104deg, rgba(150,175,205,.16) 0 .3cqw, transparent .3cqw 1.1cqw);
  opacity:.7;
}
/* 肩峰 */
.bear__hump{
  position:absolute;
  left:44%; top:18%;
  width:30%; height:40%;
  border-radius:52% 50% 40% 44% / 60% 58% 42% 40%;
  background:linear-gradient(168deg,#ffffff,var(--fur-mid) 70%,var(--fur-dark));
  z-index:3;
}
/* 颈 */
.bear__neck{
  position:absolute;
  left:64%; top:24%;
  width:20%; height:34%;
  border-radius:40% 46% 40% 46%;
  background:linear-gradient(150deg,var(--fur),var(--fur-mid));
  transform:rotate(-14deg);
  z-index:3;
}
/* 头 */
.bear__head{
  position:absolute;
  left:71%; top:11%;
  width:20%; height:30%;
  border-radius:46% 48% 44% 52% / 52% 50% 46% 48%;
  background:
    radial-gradient(60% 60% at 36% 30%, #ffffff, transparent 66%),
    linear-gradient(160deg,var(--fur),var(--fur-mid) 66%,var(--fur-dark));
  z-index:5;
}
/* 吻部（北极熊标志性的长吻） */
.bear__muzzle{
  position:absolute;
  left:86%; top:20%;
  width:15%; height:16%;
  border-radius:38% 52% 48% 40% / 44% 50% 50% 46%;
  background:linear-gradient(150deg,#ffffff,var(--fur-mid));
  z-index:6;
}
.bear__nose{
  position:absolute;
  left:98.4%; top:22.4%;
  width:2.6%; height:4.4%;
  border-radius:44% 50% 50% 44%;
  background:radial-gradient(circle at 35% 30%,#4b4f58,#15181e 70%);
  z-index:7;
}
.bear__eye{
  position:absolute;
  left:84.6%; top:17.6%;
  width:1.5%; height:2.4%;
  border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#5c6472,#0e1116 68%);
  z-index:7;
  animation:blink 5.2s infinite;
}
@keyframes blink{ 0%,94%,100%{transform:scaleY(1);} 96%,98%{transform:scaleY(.12);} }
.bear__ear{
  position:absolute;
  width:4.4%; height:6.4%;
  border-radius:50% 50% 42% 42%;
  background:linear-gradient(160deg,var(--fur-mid),var(--fur-dark));
  z-index:4;
}
.bear__ear--1{ left:72.5%; top:9.4%; }
.bear__ear--2{ left:78.6%; top:8.2%; background:linear-gradient(160deg,var(--fur),var(--fur-mid)); z-index:6; }
/* 尾 */
.bear__tail{
  position:absolute;
  left:3.4%; top:44%;
  width:5.4%; height:9%;
  border-radius:50%;
  background:linear-gradient(150deg,var(--fur),var(--fur-dark));
  z-index:2;
}
/* 鼻息白气 */
.breath{
  position:absolute;
  left:101%; top:20%;
  width:9%; height:8%;
  border-radius:50%;
  background:radial-gradient(circle at 30% 50%, rgba(255,255,255,.85), transparent 70%);
  filter:blur(.7cqw);
  opacity:0;
  z-index:6;
  animation:breathe 3.6s ease-out infinite;
}
@keyframes breathe{
  0%   { opacity:0;   transform:translate(0,0) scale(.4); }
  22%  { opacity:.85; }
  100% { opacity:0;   transform:translate(6cqw,-2cqw) scale(2.1); }
}

/* ==========================================================================
   5. 秦始皇（骑于熊背）
   坐标基于 .bear 盒（56cqw × 26cqw）
   ========================================================================== */
.emperor{
  position:absolute;
  left:25%; top:-72%;
  width:34%; height:96%;
  z-index:8;
  animation:riderCounter 1.05s ease-in-out infinite alternate;
}
/* 与熊反向的微幅位移 → 人被颠得「不同步」，更有骑乘感 */
@keyframes riderCounter{
  from{ transform:translateY(.28cqw) rotate(1.2deg); }
  to  { transform:translateY(-.2cqw) rotate(-1deg); }
}

/* --- 披风（在最后，向后飘） --- */
.cape{
  position:absolute;
  right:52%; top:30%;
  width:110%; height:66%;
  transform-origin:right top;
  background:linear-gradient(100deg,#2b0f16 0%,#4a1620 38%,#6d1f2b 70%,#8c2836 100%);
  clip-path:polygon(100% 0%, 100% 88%, 74% 74%, 52% 92%, 30% 70%, 8% 86%, 0% 52%, 22% 30%, 62% 8%);
  filter:drop-shadow(-.3cqw .3cqw .5cqw rgba(0,0,0,.5));
  animation:capeWave 2.3s ease-in-out infinite alternate;
  z-index:1;
}
.cape::after{ /* 金色云纹边 */
  content:""; position:absolute; inset:0;
  background-image:repeating-linear-gradient(112deg, rgba(216,178,94,.30) 0 .18cqw, transparent .18cqw 1.5cqw);
  clip-path:inherit;
}
@keyframes capeWave{
  from{ transform:skewY(3deg) scaleX(.94) rotate(-1deg); }
  to  { transform:skewY(-4deg) scaleX(1.06) rotate(2deg); }
}

/* --- 下裳 / 龙袍 --- */
.robe{
  position:absolute;
  left:6%; top:48%;
  width:88%; height:52%;
  background:linear-gradient(168deg,var(--robe-hi) 0%,var(--robe) 62%,#0c0a12 100%);
  clip-path:polygon(24% 0%, 76% 0%, 100% 82%, 92% 100%, 8% 100%, 0% 82%);
  z-index:3;
}
/* 袍上团龙（简化为金环 + 放射纹） */
.robe__dragon{
  position:absolute;
  left:32%; top:26%;
  width:36%; aspect-ratio:1;
  border-radius:50%;
  border:.22cqw solid var(--gold);
  background:
    repeating-conic-gradient(from 0deg, rgba(216,178,94,.55) 0 6deg, transparent 6deg 18deg),
    radial-gradient(circle, rgba(242,221,158,.35), transparent 70%);
  box-shadow:0 0 .5cqw rgba(216,178,94,.5);
}
/* 下摆金襕 */
.robe__hem{
  position:absolute;
  left:0; right:0; bottom:0; height:14%;
  background:
    linear-gradient(180deg,var(--gold-hi),var(--gold));
  clip-path:polygon(8% 0%, 92% 0%, 100% 62%, 92% 100%, 8% 100%, 0% 62%);
  opacity:.9;
}

/* --- 上身 / 玄衣 --- */
.torso{
  position:absolute;
  left:14%; top:30%;
  width:72%; height:26%;
  border-radius:26% 26% 14% 14%;
  background:linear-gradient(160deg,var(--robe-hi),var(--robe));
  z-index:4;
}
/* 交领 */
.collar{
  position:absolute;
  left:30%; top:30%;
  width:40%; height:16%;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  clip-path:polygon(50% 100%, 0% 8%, 22% 0%, 50% 46%, 78% 0%, 100% 8%);
  z-index:6;
}
/* 宽袖 */
.sleeve{
  position:absolute;
  top:33%;
  width:30%; height:30%;
  background:linear-gradient(150deg,var(--robe-hi),#0d0b12);
  z-index:5;
}
.sleeve--back{
  left:-16%;
  clip-path:polygon(28% 0%, 100% 6%, 100% 78%, 6% 100%, 0% 40%);
  filter:brightness(.82);
}
.sleeve--front{
  right:-20%;
  clip-path:polygon(0% 4%, 74% 0%, 100% 46%, 88% 96%, 0% 82%);
  transform-origin:left center;
  animation:armLift 2.6s ease-in-out infinite alternate;
}
@keyframes armLift{ from{ transform:rotate(-4deg);} to{ transform:rotate(4deg);} }

/* --- 持剑的手 + 剑 --- */
.hand{
  position:absolute;
  right:-26%; top:40%;
  width:12%; aspect-ratio:1;
  border-radius:44%;
  background:linear-gradient(150deg,var(--skin),var(--skin-sh));
  z-index:7;
  animation:armLift 2.6s ease-in-out infinite alternate;
  transform-origin:-180% center;
}
.sword{
  position:absolute;
  right:-70%; top:-34%;
  width:8%; height:96%;
  transform:rotate(34deg);
  transform-origin:50% 92%;
  z-index:6;
  animation:swordLift 2.6s ease-in-out infinite alternate;
}
@keyframes swordLift{ from{ transform:rotate(30deg);} to{ transform:rotate(40deg);} }
.sword__blade{
  position:absolute;
  left:22%; top:0;
  width:56%; height:76%;
  background:linear-gradient(92deg,#8e9bb0 0%,#eef4fb 40%,#ffffff 52%,#9daabd 100%);
  clip-path:polygon(50% 0%, 100% 12%, 100% 100%, 0% 100%, 0% 12%);
  box-shadow:0 0 .5cqw rgba(200,225,255,.7);
}
.sword__guard{
  position:absolute;
  left:-34%; top:74%;
  width:168%; height:5%;
  border-radius:1cqw;
  background:linear-gradient(90deg,var(--gold),var(--gold-hi) 50%,var(--gold));
}
.sword__grip{
  position:absolute;
  left:28%; top:78%;
  width:44%; height:20%;
  border-radius:.3cqw;
  background:repeating-linear-gradient(180deg,#3c2a18 0 .22cqw, #6b4c2a .22cqw .44cqw);
}
.sword__pommel{
  position:absolute;
  left:20%; top:96%;
  width:60%; height:6%;
  border-radius:50%;
  background:radial-gradient(circle at 34% 30%,var(--gold-hi),var(--gold));
}

/* --- 头面 --- */
.head{
  position:absolute;
  left:26%; top:12%;
  width:48%; height:26%;
  border-radius:42% 42% 46% 46% / 38% 38% 56% 56%;
  background:
    radial-gradient(60% 50% at 36% 32%, #f4d7b3, transparent 68%),
    linear-gradient(160deg,var(--skin),var(--skin-sh));
  z-index:6;
}
/* 眉 */
.brow{
  position:absolute;
  top:34%; width:26%; height:6%;
  border-radius:2cqw;
  background:#241a12;
  z-index:8;
}
.brow--l{ left:16%; transform:rotate(-9deg); }
.brow--r{ right:14%; transform:rotate(7deg); }
/* 目 */
.eye{
  position:absolute;
  top:46%; width:16%; height:7%;
  border-radius:50%;
  background:linear-gradient(180deg,#2b2119,#0c0906);
  z-index:8;
}
.eye--l{ left:20%; }
.eye--r{ right:18%; }
/* 髭须（八字胡） */
.mustache{
  position:absolute;
  top:64%; width:22%; height:8%;
  background:linear-gradient(180deg,#2a1f16,#120c07);
  z-index:8;
}
.mustache--l{ left:16%; clip-path:polygon(0% 60%,60% 0%,100% 20%,44% 100%); }
.mustache--r{ right:14%; clip-path:polygon(100% 60%,40% 0%,0% 20%,56% 100%); }
/* 长髯 */
.beard{
  position:absolute;
  left:32%; top:33%;
  width:36%; height:26%;
  background:linear-gradient(180deg,#2a1f16 0%,#160f0a 70%,#0a0705 100%);
  clip-path:polygon(0% 0%, 100% 0%, 92% 46%, 66% 78%, 50% 100%, 34% 78%, 8% 46%);
  z-index:5;
  transform-origin:50% 0;
  animation:beardSway 2.1s ease-in-out infinite alternate;
}
@keyframes beardSway{ from{ transform:rotate(-2.4deg) scaleY(1);} to{ transform:rotate(2.6deg) scaleY(1.05);} }

/* --- 冕冠 --- */
.crown{
  position:absolute;
  left:12%; top:2%;
  width:76%; height:16%;
  z-index:9;
}
/* 冕板（前低后高，微倾） */
.crown__board{
  position:absolute;
  left:-14%; top:0;
  width:128%; height:42%;
  background:linear-gradient(180deg,#1b1622,#0a0810);
  clip-path:polygon(3% 0%, 97% 12%, 100% 76%, 0% 62%);
  box-shadow:0 .16cqw 0 rgba(216,178,94,.75);
}
/* 冠身 */
.crown__cap{
  position:absolute;
  left:14%; top:36%;
  width:72%; height:70%;
  border-radius:34% 34% 12% 12%;
  background:linear-gradient(160deg,#241d2f,#100c18);
  border-bottom:.2cqw solid var(--gold);
}
/* 玉笄 */
.crown__pin{
  position:absolute;
  left:-6%; top:62%;
  width:112%; height:5%;
  border-radius:1cqw;
  background:linear-gradient(90deg,#cfe3ef,#8fb6c9 50%,#cfe3ef);
}
/* 冕旒：七串垂珠 */
.liu{
  position:absolute;
  top:70%;
  width:1.7%;
  height:78%;
  background:
    repeating-linear-gradient(180deg,
      var(--gold-hi) 0 .34cqw,
      rgba(0,0,0,0) .34cqw .52cqw);
  border-radius:1cqw;
  transform-origin:50% 0;
  animation:liuSwing 1.05s ease-in-out infinite alternate;
  filter:drop-shadow(0 0 .12cqw rgba(216,178,94,.8));
}
.liu:nth-child(5){ left:6%;  animation-delay:0s;     height:74%; }
.liu:nth-child(6){ left:20%; animation-delay:-.09s;  height:80%; }
.liu:nth-child(7){ left:34%; animation-delay:-.18s;  height:84%; }
.liu:nth-child(8){ left:48%; animation-delay:-.27s;  height:86%; }
.liu:nth-child(9){ left:62%; animation-delay:-.36s;  height:84%; }
.liu:nth-child(10){left:76%; animation-delay:-.45s;  height:80%; }
.liu:nth-child(11){left:90%; animation-delay:-.54s;  height:74%; }
@keyframes liuSwing{
  from{ transform:rotate(-6.5deg); }
  to  { transform:rotate(6.5deg); }
}

/* ==========================================================================
   6. 地面雪雾（被踩起的雪）
   ========================================================================== */
.dust{
  position:absolute;
  bottom:36%;
  width:16cqw; height:4cqw;
  border-radius:50%;
  background:radial-gradient(closest-side, rgba(255,255,255,.85), transparent 74%);
  filter:blur(1cqw);
  opacity:0;
}
.dust--1{ left:24cqw; animation:puff 1.05s ease-out infinite; }
.dust--2{ left:56cqw; animation:puff 1.05s ease-out infinite; animation-delay:-.52s; }
@keyframes puff{
  0%  { opacity:0;   transform:translateX(0) scale(.4); }
  25% { opacity:.75; }
  100%{ opacity:0;   transform:translateX(-9cqw) scale(1.7); }
}

/* ==========================================================================
   7. 题名
   ========================================================================== */
.title{
  position:absolute;
  left:4.5cqw; top:4cqw;
  writing-mode:vertical-rl;
  text-orientation:upright;
  color:#eef4ff;
  letter-spacing:.34em;
  font-size:3.4cqw;
  text-shadow:0 0 1.4cqw rgba(120,200,255,.6), 0 .2cqw .4cqw rgba(0,0,0,.7);
  z-index:20;
}
.title small{
  display:block;
  font-size:.42em;
  letter-spacing:.28em;
  color:rgba(200,220,245,.66);
  margin-top:.8em;
}
.stamp{
  position:absolute;
  left:4.2cqw; bottom:5cqw;
  width:4.4cqw; aspect-ratio:1;
  display:grid; place-items:center;
  background:#9e2f27;
  color:#f7e9dd;
  font-size:2cqw;
  letter-spacing:0;
  border-radius:.3cqw;
  box-shadow:0 .3cqw .8cqw rgba(0,0,0,.5);
  z-index:20;
}

/* ---------- 减少动效 ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
  }
}
</style>
</head>
<body>

<div class="stage" role="img"
  aria-label="二维动画：极夜雪原上，秦始皇身着玄色龙袍、头戴冕旒、手持长剑，骑在一头行走的北极熊背上；天空有极光流转、月亮和飞雪，远处是冰山。">

  <!-- 天 -->
  <div class="stars"></div>

  <div class="aurora aurora--2"></div>

  <!-- 地 -->

    <div class="berg berg--4"></div>
    <div class="berg berg--3"></div>
  </div>
  <div class="ground"></div>

  <div class="dust dust--1"></div>

  <!-- 熊 + 人 -->
  <div class="bear">
    <!-- 远侧两腿 -->
    <div class="leg leg--far leg--fr"></div>
    <div class="leg leg--far leg--br"></div>

    <div class="bear__tail"></div>
    <div class="bear__body"></div>
    <div class="bear__hump"></div>
    <div class="bear__neck"></div>

    <div class="bear__ear bear__ear--1"></div>
    <div class="bear__head"></div>
    <div class="bear__ear bear__ear--2"></div>
    <div class="bear__muzzle"></div>
    <div class="bear__eye"></div>
    <div class="bear__nose"></div>
    <div class="breath"></div>

    <!-- 近侧两腿 -->
    <div class="leg leg--near leg--fl"></div>
    <div class="leg leg--near leg--bl"></div>

    <!-- 秦始皇 -->
    <div class="emperor">
      <div class="cape"></div>

      <div class="robe">
        <div class="robe__dragon"></div>
        <div class="robe__hem"></div>
      </div>

      <div class="torso"></div>

      <div class="beard"></div>
      <div class="head">
        <div class="brow brow--l"></div>

        <div class="eye eye--r"></div>
        <div class="mustache mustache--l"></div>
        <div class="mustache mustache--r"></div>
      </div>

      <div class="crown">
        <div class="crown__cap"></div>

        <span class="liu"></span><span class="liu"></span><span class="liu"></span>

        <span class="liu"></span>
      </div>

      <div class="sleeve sleeve--front"></div>
      <div class="hand"></div>
      <div class="sword">
        <div class="sword__blade"></div>
        <div class="sword__guard"></div>
        <div class="sword__grip"></div>
        <div class="sword__pommel"></div>
      </div>
    </div>
  </div>

  <!-- 雪 -->
  <div class="snow snow--far"></div>
  <div class="snow snow--mid"></div>
  <div class="snow snow--near"></div>

  <!-- 题名 -->
  <div class="title">祖龍馭雪<small>北溟行</small></div>
  <div class="stamp">秦</div>
</div>

</body>
