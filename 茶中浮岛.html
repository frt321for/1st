<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eae7dc">
  <title>茶中浮岛 · 一盏山水</title>
  <style>
    :root { color-scheme: light; --paper: #eae7dc; --ink: #35433c; --quiet: #788074; --line: #35433c26; --accent: #a04e38; --glass: #eeeadeab; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--paper); color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased; }
    body.night { color-scheme: dark; --ink: #d8dfd2; --quiet: #9daea3; --line: #d8dfd22b; --accent: #dab089; --glass: #25332fac; }
    button { color: inherit; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    button, kbd { -webkit-user-select: none; user-select: none; }
    button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
    #scene:active { cursor: grabbing; }
    body::after { content: ""; position: fixed; inset: 0; z-index: 6; opacity: .038; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.87' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23808080' filter='url(%23grain)' opacity='.7' d='M0 0h180v180H0z'/%3E%3C/svg%3E"); }
    .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 57% 44%, transparent 35%, #3028150a 100%); }
    .interface { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
    .interface button { pointer-events: auto; }
    .masthead { position: absolute; top: 34px; left: 42px; right: 42px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 33px; height: 33px; color: var(--accent); }
    .brand-name { font-family: "Songti SC", "Noto Serif CJK SC", SimSun, serif; font-size: 16px; font-weight: 500; letter-spacing: .25em; }
    .brand-sub { margin-top: 5px; color: var(--quiet); font-size: 8px; letter-spacing: .23em; }
    .tools { display: flex; gap: 10px; }
    .icon-button { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: transparent; transition: background .2s, transform .2s; }
    .icon-button:hover { background: var(--glass); transform: translateY(-1px); }
    #sound[aria-pressed="false"] .sound-wave { display: none; }
    #sound[aria-pressed="true"] .sound-off { display: none; }
    .introduction { position: absolute; left: 51px; top: 24%; }
    h1 { margin: 0; font-family: "Songti SC", "Noto Serif CJK SC", SimSun, serif; font-size: 35px; font-weight: 400; letter-spacing: .25em; line-height: 1.6; writing-mode: vertical-rl; }
    .poem { position: absolute; left: 68px; top: 5px; margin: 0; writing-mode: vertical-rl; font-family: "Songti SC", SimSun, serif; color: var(--quiet); font-size: 12px; line-height: 2; letter-spacing: .28em; }
    .seal { margin: 23px 0 0 10px; width: 27px; height: 29px; display: grid; place-items: center; border: 1px solid #a04e3899; color: #a04e38; font: 12px/1 SimSun, serif; transform: rotate(-4deg); }
    .time-panel { position: absolute; right: 46px; top: 25%; width: 148px; }
    .time-heading { display: flex; align-items: center; gap: 9px; margin-bottom: 17px; }
    .time-heading svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.2; }
    .phase-name { font-family: "Songti SC", SimSun, serif; font-size: 17px; letter-spacing: .15em; }
    #clock { margin-left: auto; font: 10px ui-monospace, "Cascadia Code", Consolas, monospace; color: var(--quiet); font-variant-numeric: tabular-nums; }
    .day-line { height: 2px; position: relative; background: linear-gradient(90deg, #6d8290, #d9c391 27%, #9eac87 50%, #b78a64 73%, #6d8290); opacity: .8; }
    .day-line::after { position: absolute; content: ""; left: var(--day-position, 31%); top: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); border: 2px solid var(--paper); transform: translateX(-50%); }
    .day-labels { display: flex; justify-content: space-between; margin-top: 9px; color: var(--quiet); font-size: 9px; letter-spacing: .05em; }
    .speed-control { margin-top: 20px; display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 6px; }
    .speed-control button { flex: 1; height: 28px; border: 0; border-radius: 3px; font: 11px ui-monospace, Consolas, monospace; background: transparent; color: var(--quiet); }
    .speed-control button[aria-pressed="true"] { color: var(--ink); background: var(--line); }
    .speed-caption { margin: 10px 0 0; text-align: right; color: var(--quiet); font-size: 10px; letter-spacing: .14em; }
    .bottom-bar { position: absolute; left: 43px; right: 43px; bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
    .gestures { display: flex; flex-wrap: wrap; gap: 18px; padding-bottom: 9px; }
    .gesture { display: flex; align-items: center; gap: 7px; font-size: 10px; letter-spacing: .055em; color: var(--quiet); white-space: nowrap; }
    .gesture svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.1; fill: none; }
    .breath-wrap { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); text-align: center; }
    #breath { position: relative; overflow: hidden; display: flex; align-items: center; gap: 15px; height: 49px; padding: 0 19px; border: 1px solid var(--line); border-radius: 27px; background: var(--glass); backdrop-filter: blur(12px); box-shadow: 0 3px 14px #26362705; touch-action: none; transition: border-color .2s, box-shadow .2s; }
    #breath::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: var(--breath, 0%); background: var(--accent); transition: width .09s linear; }
    #breath:hover, #breath[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 3px 18px #2636270d; }
    #breath svg { width: 23px; height: 23px; }
    #breath-label { min-width: 65px; font-size: 12px; letter-spacing: .08em; }
    kbd { border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; font: 9px ui-monospace, Consolas, monospace; color: var(--quiet); }
    .breath-caption { margin-top: 9px; color: var(--quiet); font-size: 9px; letter-spacing: .15em; }
    .signature { font-family: "Songti SC", SimSun, serif; font-size: 11px; color: var(--quiet); letter-spacing: .19em; padding-bottom: 9px; }
    #notice { position: absolute; left: 50%; bottom: 114px; transform: translate(-50%, 5px); color: var(--ink); font-size: 11px; letter-spacing: .12em; opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none; white-space: nowrap; }
    #notice.visible { opacity: .8; transform: translate(-50%, 0); }
    #loading { position: fixed; inset: 0; z-index: 8; display: grid; place-content: center; gap: 19px; text-align: center; background: #eae7dc; transition: opacity .7s, visibility .7s; }
    #loading.hidden { opacity: 0; visibility: hidden; }
    .loading-ring { width: 41px; height: 41px; margin: auto; border: 1px solid #35433c26; border-top-color: #788074; border-radius: 50%; animation: steep 2.2s linear infinite; }
    #loading-text { font: 13px "Songti SC", SimSun, serif; color: #627064; letter-spacing: .2em; }
    #reload { display: none; margin: 0 auto; padding: 8px 17px; color: #35433c; border: 1px solid #35433c40; border-radius: 4px; background: transparent; font-size: 12px; }
    @keyframes steep { to { transform: rotate(360deg); } }
    @media (max-width: 1050px) { .introduction { left: 30px; } .time-panel { right: 30px; width: 126px; } .gestures { gap: 11px; } .signature { display: none; } .masthead { left: 28px; right: 28px; } .bottom-bar { left: 28px; right: 28px; } .gesture { font-size: 9px; } }
    @media (max-width: 700px) { .masthead { top: 22px; left: 22px; right: 22px; } .brand-sub { font-size: 7px; } .brand-name { font-size: 14px; } .tools { gap: 8px; } .icon-button { width: 35px; height: 35px; } .introduction { top: 112px; left: 25px; } h1 { font-size: 25px; writing-mode: horizontal-tb; } .poem { position: static; writing-mode: horizontal-tb; font-size: 10px; margin-top: 6px; letter-spacing: .14em; } .seal { display: none; } .time-panel { top: auto; bottom: 137px; right: 25px; width: 128px; } .time-heading { margin-bottom: 11px; } .phase-name { font-size: 14px; } .day-labels { display: none; } .speed-control { margin-top: 12px; } .speed-caption { display: none; } .bottom-bar { left: 25px; right: 25px; bottom: 112px; } .gestures { gap: 13px; } .gesture { font-size: 9px; } .gesture svg { width: 14px; } .breath-wrap { bottom: 27px; } #notice { bottom: 96px; } }
    @media (max-width: 380px) { .brand-sub { display: none; } .gesture { gap: 4px; } .gestures { gap: 9px; } .time-panel { bottom: 144px; } }
    @media (max-height: 560px) and (min-width: 701px) { .introduction { top: 24%; } h1 { font-size: 25px; } .poem { font-size: 10px; left: 47px; } .seal { display: none; } .masthead { top: 18px; } .bottom-bar { bottom: 18px; } .breath-wrap { bottom: 15px; } .time-panel { top: 26%; } }
    @media (prefers-reduced-motion: reduce) { *, *::after { transition: none !important; } .loading-ring { animation: none; } }
  </style>

    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>

<body>
  <canvas id="scene" aria-label="茶碗中的水墨浮岛。拖动环视，滚轮缩放，按住空格吹气，点击碗沿轻叩。" tabindex="0"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="interface">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M5 23c1.8 10 7 13 15 13s13.2-3 15-13M5 23c4.5 2.7 25.5 2.7 30 0M13 13l5-8 5 11 4-6 5 12M8 22l6-9 5 9M16 37h8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div><div class="brand-name">一盏山水</div><div class="brand-sub">A LIVING INK MINIATURE</div></div>
      </div>
      <div class="tools">
        <button class="icon-button" id="sound" aria-label="关闭声音" aria-pressed="true" title="声音开关">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5 5 9H2v6h3l5 4Z"/><path class="sound-wave" d="M14 8c2 2 2 6 0 8m3-11c4 4 4 10 0 14"/><path class="sound-off" d="m15 9 6 6m0-6-6 6"/></svg>
        </button>
        <button class="icon-button" id="reset" aria-label="复位视角" title="复位视角 · R"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1.5 7M4 4v6h6"/></svg></button>
      </div>
    </header>
    <section class="introduction" aria-label="茶中浮岛">
      <h1>茶中浮岛</h1><p class="poem">山色入一盏，浮生半日闲。</p><div class="seal" aria-hidden="true">入静</div>
    </section>
    <section class="time-panel" aria-label="时间流速">
      <div class="time-heading"><svg id="phase-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4.2 4.2l2.1 2.1m11.4 11.4 2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span class="phase-name" id="phase">晨雾</span><time id="clock">07:12</time></div>
      <div class="day-line" id="day-line" aria-hidden="true"></div><div class="day-labels" aria-hidden="true"><span>夜</span><span>晨</span><span>昼</span><span>暮</span><span>夜</span></div>
      <div class="speed-control" role="group" aria-label="选择时间流速"><button data-speed="1" aria-pressed="true" aria-label="一倍时间流速">×1</button><button data-speed="4" aria-pressed="false" aria-label="四倍时间流速">×4</button><button data-speed="16" aria-pressed="false" aria-label="十六倍时间流速">×16</button></div>
      <p class="speed-caption">让时光走快一些</p>
    </section>
    <div class="bottom-bar"><div class="gestures"><span class="gesture"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8V5a1.5 1.5 0 0 1 3 0v5-6a1.5 1.5 0 0 1 3 0v6-4a1.5 1.5 0 0 1 3 0v5-2a1.5 1.5 0 0 1 3 0v4c0 3-2 5-5 5H9c-2 0-3-1-4-3L2 11a1.5 1.5 0 0 1 2-2l3 3"/></svg>拖动环视</span><span class="gesture"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="2" width="10" height="16" rx="5"/><path d="M10 5v4"/></svg><span class="zoom-hint">滚轮缩放</span></span><span class="gesture"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 11c1 5 3 6 8 6s7-1 8-6M2 11c4 2 12 2 16 0M10 1v4M4 3l2 3m10-3-2 3"/></svg>轻叩碗沿</span></div><span class="signature">水有回声，山有归处。</span></div>
    <div class="breath-wrap"><button id="breath" aria-label="按住吹气" aria-pressed="false"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M3 9h12c5 0 5-6 1-6-2 0-3 1-3 2M3 13h17c5 0 5 7 1 7-2 0-3-1-3-2M3 17h7c4 0 4 6 0 6"/></svg><span id="breath-label">吹一口气</span><kbd>Space</kbd></button><div class="breath-caption">按住，让山水随风</div></div>
    <div id="notice" role="status" aria-live="polite"></div>
  </div>
  <div id="loading"><div class="loading-ring"></div><div id="loading-text">沏茶，候山来</div><button id="reload" onclick="location.reload()">重新载入</button></div>
  <noscript><style>#loading .loading-ring { display: none; }</style><p style="position:fixed;z-index:10;top:55%;width:100%;text-align:center">请启用 JavaScript，进入茶中山水。</p></noscript>
  <script type="module">
    async function createTeaWorld() {
      const [THREE, { OrbitControls }, { Reflector }, { RoomEnvironment }] = await Promise.all([
        import('three'), import('three/addons/controls/OrbitControls.js'),
        import('three/addons/objects/Reflector.js'), import('three/addons/environments/RoomEnvironment.js')
      ]);

      const canvas = document.querySelector('#scene');
      const breathButton = document.querySelector('#breath');
      const breathLabel = document.querySelector('#breath-label');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const WATER_Y = 2.12;
      const WATER_RADIUS = 3.275;
      const WORLD_LIMIT = 3.09;
      const RIPPLE_COUNT = 10;
      const TAU = Math.PI * 2;
      const clamp = THREE.MathUtils.clamp;
      const lerp = THREE.MathUtils.lerp;
      const smooth = (a, b, x) => { const v = clamp((x - a) / (b - a), 0, 1); return v * v * (3 - 2 * v); };
      let seed = 48619;
      const random = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
      const fract = x => x - Math.floor(x);
      const noiseHash = (x, y) => fract(Math.sin(x * 127.1 + y * 311.7) * 43758.5453);
      function noise2(x, y) {
        const ix = Math.floor(x), iy = Math.floor(y);
        const fx = smooth(0, 1, fract(x)), fy = smooth(0, 1, fract(y));
        return lerp(lerp(noiseHash(ix, iy), noiseHash(ix + 1, iy), fx), lerp(noiseHash(ix, iy + 1), noiseHash(ix + 1, iy + 1), fx), fy);
      }

      let elapsed = 0, day = .3, timeSpeed = 1, wind = 0, scatter = 0;
      let keyboardBreath = false, pointerBreath = false, pointerOrbit = false;
      let lastInteraction = performance.now(), rippleCursor = 0, fixedAccumulator = 0;
      let currentDaylight = 1, currentNight = 0, currentDawn = 1, frame = 0;
      let previousStamp = 0, noticeTimer, pointerStart = null, previousPhase = '';
      const windDirection = new THREE.Vector2(.89, -.45).normalize();
      const ripples = Array.from({ length: RIPPLE_COUNT }, () => new THREE.Vector4(0, 0, -100, 0));
      const shared = {
        time: { value: 0 }, wind: { value: 0 }, scatter: { value: 0 },
        day: { value: 1 }, night: { value: 0 }, dawn: { value: 1 },
        direction: { value: windDirection }, ripples: { value: ripples }
      };

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.14;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#eae7dc');
      scene.fog = new THREE.FogExp2('#eae7dc', .009);
      const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, .1, 90);
      const viewTarget = new THREE.Vector3(0, 2.53, 0);
      const homeDirection = new THREE.Vector3(8.2, 6.8, 11).normalize();
      const controls = new OrbitControls(camera, canvas);
      controls.target.copy(viewTarget);
      controls.enableDamping = true;
      controls.dampingFactor = .065;
      controls.enablePan = false;
      controls.minPolarAngle = .30;
      controls.maxPolarAngle = 1.24;
      controls.minDistance = 8.8;
      controls.maxDistance = 36;
      controls.autoRotateSpeed = .16;
      controls.rotateSpeed = .58;
      controls.zoomSpeed = .8;

      const hemisphere = new THREE.HemisphereLight('#f4f1df', '#79745d', 2.35);
      scene.add(hemisphere);
      const sun = new THREE.DirectionalLight('#fff0d0', 3.15);
      sun.position.set(-5.5, 10, 6.5);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 8, bottom: -6, near: .5, far: 30 });
      sun.shadow.normalBias = .025;
      sun.shadow.bias = -.00018;
      sun.shadow.radius = 3;
      sun.target.position.set(0, 1.5, 0);
      scene.add(sun, sun.target);
      const moonLight = new THREE.DirectionalLight('#9fc5e0', 0);
      moonLight.position.set(4, 9, -5);
      scene.add(moonLight);
      const bounce = new THREE.DirectionalLight('#c4d2b3', .6);
      bounce.position.set(6, 3, -4);
      scene.add(bounce);
      const environmentRoom = new RoomEnvironment();
      const pmrem = new THREE.PMREMGenerator(renderer);
      const environmentTarget = pmrem.fromScene(environmentRoom, .035);
      scene.environment = environmentTarget.texture;
      environmentRoom.dispose();
      pmrem.dispose();

      const dummy = new THREE.Object3D();
      const tint = new THREE.Color();
      const cube = new THREE.BoxGeometry(1, 1, 1);
      const voxelMaterial = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: .88, metalness: .025, envMapIntensity: .35 });
      const woodMaterial = new THREE.MeshStandardMaterial({ color: '#8a7150', roughness: .94, envMapIntensity: .2 });
      const lanternMaterial = new THREE.MeshStandardMaterial({ color: '#efcf92', emissive: '#f8b451', emissiveIntensity: .5, roughness: .65 });
      const ropeMaterial = new THREE.LineBasicMaterial({ color: '#514b39' });

      const noiseGLSL = `
        float hash21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise21(vec2 p) {
          vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),
                     mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0)), f.x), f.y);
        }
        float fbm(vec2 p) {
          float value = 0.0; float weight = 0.5;
          for (int j = 0; j < 4; j++) { value += noise21(p) * weight; p = mat2(1.6, -1.2, 1.2, 1.6) * p + 7.3; weight *= 0.5; }
          return value;
        }
      `;
      voxelMaterial.onBeforeCompile = shader => {
        shader.vertexShader = 'varying vec3 vInkPosition;\n' + shader.vertexShader;
        shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', `
          #include <begin_vertex>
          vec4 inkPoint = vec4(transformed, 1.0);
          #ifdef USE_INSTANCING
            inkPoint = instanceMatrix * inkPoint;
          #endif
          vInkPosition = (modelMatrix * inkPoint).xyz;
        `);
        shader.fragmentShader = 'varying vec3 vInkPosition;\n' + noiseGLSL + shader.fragmentShader;
        shader.fragmentShader = shader.fragmentShader.replace('#include <color_fragment>', `
          #include <color_fragment>
          float dryBrush = fbm(vec2(vInkPosition.x * 13.0 + vInkPosition.z * 8.0, vInkPosition.y * 3.7));
          float fiber = noise21(vec2(vInkPosition.x * 60.0 + vInkPosition.z * 35.0, vInkPosition.y * 8.0));
          diffuseColor.rgb *= 0.81 + dryBrush * 0.31 + fiber * 0.12;
        `);
      };
      voxelMaterial.customProgramCacheKey = () => 'ink-wash-voxel';

      function cell(cells, x, y, z, sx, sy, sz, color, ry = 0, rx = 0, rz = 0) {
        cells.push({ x, y, z, sx, sy, sz, color, ry, rx, rz });
      }
      function addVoxels(parent, cells, material = voxelMaterial, shadows = true) {
        const mesh = new THREE.InstancedMesh(cube, material, cells.length);
        for (let i = 0; i < cells.length; i++) {
          const c = cells[i];
          dummy.position.set(c.x, c.y, c.z); dummy.scale.set(c.sx, c.sy, c.sz);
          dummy.rotation.set(c.rx || 0, c.ry || 0, c.rz || 0); dummy.updateMatrix();
          mesh.setMatrixAt(i, dummy.matrix); mesh.setColorAt(i, tint.set(c.color));
        }
        mesh.castShadow = shadows; mesh.receiveShadow = shadows;
        mesh.computeBoundingSphere(); parent.add(mesh);
        return mesh;
      }
      function solid(parent, geometry, material, x = 0, y = 0, z = 0, shadows = true) {
        const mesh = new THREE.Mesh(geometry, material); mesh.position.set(x, y, z);

      }

      // Woven rushes and the rounded, closed pottery profile.
      const matCanvas = document.createElement('canvas');
      matCanvas.width = matCanvas.height = 512;
      const matContext = matCanvas.getContext('2d');
      const weave = matContext.createImageData(512, 512);
      for (let y = 0; y < 512; y++) for (let x = 0; x < 512; x++) {
        const n = (random() - .5) * 13;
        const reed = Math.sin(x * Math.PI / 3) * 7 + Math.sin(x * .11) * 4;
        const thread = (y % 24 < 2 ? -18 : 0) + ((x + (Math.floor(y / 24) % 2) * 3) % 6 < 2 ? -8 : 2);
        const i = (y * 512 + x) * 4;
        weave.data[i] = 164 + n + reed + thread;
        weave.data[i + 1] = 163 + n + reed + thread;
        weave.data[i + 2] = 121 + n + reed + thread;
        weave.data[i + 3] = 255;
      }
      matContext.putImageData(weave, 0, 0);
      const matTexture = new THREE.CanvasTexture(matCanvas);
      matTexture.colorSpace = THREE.SRGBColorSpace;
      matTexture.wrapS = matTexture.wrapT = THREE.RepeatWrapping;
      matTexture.repeat.set(5, 4);
      matTexture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      const matMaterial = new THREE.MeshStandardMaterial({ map: matTexture, roughness: 1, color: '#dedac0', envMapIntensity: .15 });
      const trimMaterial = new THREE.MeshStandardMaterial({ color: '#485545', roughness: .97 });
      const matSide = new THREE.MeshStandardMaterial({ color: '#817c53', roughness: 1 });
      const mat = new THREE.Group(); scene.add(mat); mat.rotation.y = -.08;
      solid(mat, new THREE.BoxGeometry(9.7, .13, 8.35), [matSide, matSide, matMaterial, matSide, matSide, matSide], 0, -.07, 0);
      for (const z of [-4.07, 4.07]) {
        solid(mat, new THREE.BoxGeometry(9.72, .019, .21), trimMaterial, 0, .005, z);
        const stitches = [];
        for (let i = 0; i < 118; i++) cell(stitches, -4.78 + i * .081, .017, z, .024, .006, .135, i % 2 ? '#77816a' : '#68745e');
        addVoxels(mat, stitches, voxelMaterial, false);
      }
      const floorMaterial = new THREE.MeshStandardMaterial({ color: '#eae7dc', roughness: 1, envMapIntensity: .1 });
      const floor = solid(scene, new THREE.PlaneGeometry(200, 200), floorMaterial, 0, -.151, 0, false);
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;

      const potteryMaterial = new THREE.MeshPhysicalMaterial({ color: '#806250', roughness: .37, metalness: .04, clearcoat: .65, clearcoatRoughness: .28, envMapIntensity: .65 });
      potteryMaterial.onBeforeCompile = shader => {
        shader.vertexShader = 'varying vec3 vClay;\n' + shader.vertexShader;
        shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvClay = (modelMatrix * vec4(position, 1.0)).xyz;');
        shader.fragmentShader = 'varying vec3 vClay;\n' + noiseGLSL + shader.fragmentShader;
        shader.fragmentShader = shader.fragmentShader.replace('#include <color_fragment>', `
          #include <color_fragment>
          float angle = atan(vClay.z, vClay.x);
          float clayNoise = fbm(vec2(angle * 3.1, vClay.y * 4.0));
          float throwing = sin(vClay.y * 95.0 + sin(angle * 4.0) * 0.55 + clayNoise * 2.2);
          float grain = hash21(floor(vec2(angle * 730.0, vClay.y * 620.0)));

          float rimGlaze = smoothstep(2.25, 2.38, vClay.y);

      const profile = [
        [0, .16], [.83, .16], [1.16, .20], [1.47, .34], [1.90, .55], [2.33, .82],
        [2.71, 1.12], [3.04, 1.48], [3.29, 1.84], [3.48, 2.20], [3.54, 2.37],
        [3.53, 2.43], [3.49, 2.46], [3.43, 2.43], [3.40, 2.35], [3.35, 2.20],
        [3.23, 1.94], [3.02, 1.61], [2.72, 1.28], [2.38, 1.00], [1.97, .78],
        [1.54, .63], [1.08, .54], [.55, .51], [0, .51]
      ].map(([r, y]) => new THREE.Vector2(r, y));
      const bowlGeometry = new THREE.LatheGeometry(profile, 192);
      const bowlPositions = bowlGeometry.attributes.position;
      for (let i = 0; i < bowlPositions.count; i++) {
        const x = bowlPositions.getX(i), z = bowlPositions.getZ(i), y = bowlPositions.getY(i);
        const a = Math.atan2(z, x), r = Math.hypot(x, z);
        const irregular = 1 + .0018 * Math.sin(a * 3 + y * 2) + .0012 * Math.cos(a * 7 - y);

      }
      bowlGeometry.computeVertexNormals();
      const bowl = solid(scene, bowlGeometry, potteryMaterial);
      const foot = solid(scene, new THREE.TorusGeometry(1.03, .096, 12, 112), potteryMaterial, 0, .107, 0);
      foot.rotation.x = Math.PI / 2;
      const lip = solid(scene, new THREE.TorusGeometry(3.461, .063, 10, 192), potteryMaterial, 0, 2.405, 0);
      lip.rotation.x = Math.PI / 2;

      // The landscape is made of exposed voxel shells; enclosed cells are omitted.
      const islands = [];
      const inkHomes = [];
      const lampCells = [];
      const rockColors = ['#5c6863', '#738077', '#899185', '#a7ab9a', '#465550', '#b2b5a4'];
      const mossColors = ['#718266', '#899578', '#657959', '#9ca181', '#a7ac8b'];
      const pineColors = ['#37564b', '#416051', '#4b6958', '#5c765d', '#728466'];

      function pine(cells, x, z, ground, scale = 1, rotation = 0) {
        const trunkHeight = .76 * scale;
        for (let i = 0; i < 11; i++) {
          const bend = Math.sin(i * .12) * .10 * scale;
          cell(cells, x + bend, ground + i * trunkHeight / 11, z, .072 * scale, trunkHeight / 10, .075 * scale, i % 3 ? '#574e3b' : '#746044', rotation);
        }
        for (let layer = 0; layer < 4; layer++) {
          const a = rotation + layer * 2.35;
          const reach = (.20 - layer * .033) * scale;
          const px = x + .075 * scale + Math.cos(a) * reach, pz = z + Math.sin(a) * reach;
          const py = ground + trunkHeight * (.44 + layer * .18);
          cell(cells, (x + px) / 2, py - .035 * scale, (z + pz) / 2, .055 * scale, .042 * scale, reach * 1.8, '#514e3a', -a + Math.PI / 2);

            cell(cells, px + ix * step, yy, pz + iz * step, step * 1.12, (.07 + random() * .035) * scale, step * 1.08, pineColors[Math.floor(random() * pineColors.length)]);
          }
        }
      }

      function lantern(cells, lights, x, y, z, scale = 1) {
        const add = (dx, dy, dz, sx, sy, sz, c) => cell(cells, x + dx * scale, y + dy * scale, z + dz * scale, sx * scale, sy * scale, sz * scale, c);
        add(0, .025, 0, .25, .05, .25, '#9b9f88');

        add(0, .24, 0, .22, .07, .22, '#b0b29a');

      }

      function temple(cells, lights, deck) {

        cell(cells, 0, deck + .16, .04, 1.05, .07, .77, '#c1bda0');
        for (let i = 0; i < 5; i++) cell(cells, 0, deck + .015 + i * .025, .92 - i * .095, .38, .065, .13, i % 2 ? '#959c85' : stone);
        for (const x of [-.43, .43]) for (const z of [-.26, .30]) {

        }

        for (const x of [-.39, .39]) cell(cells, x, deck + .43, 0, .06, .44, .51, plaster);
        for (const x of [-.275, .275]) {

          for (let k = -1; k <= 1; k++) cell(cells, x + k * .043, deck + .48, .29, .012, .22, .02, timber);

        }
        cell(cells, 0, deck + .405, .275, .19, .36, .03, '#3b4031');
        cell(cells, 0, deck + .60, .29, .24, .052, .045, timber);
        for (const z of [-.28, .32]) cell(cells, 0, deck + .71, z, 1.05, .065, .065, '#8b6547');

          const step = .086;

          for (let ix = -nx; ix <= nx; ix++) for (let iz = -nz; iz <= nz; iz++) {

            const roofColor = ['#405651', '#4d635c', '#596d61', '#637768'][Math.floor(random() * 4)];
            cell(cells, ix * step, base + Math.round(curved / .034) * .034, iz * step, step * 1.025, .065, step * 1.025, roofColor);
          }
          cell(cells, 0, base + height + .06, 0, width * .52, .065, .075, '#75816a');
          for (const x of [-width * .29, width * .29]) cell(cells, x, base + height + .10, 0, .058, .14, .064, '#8e9676', 0, 0, x > 0 ? -.28 : .28);

        cell(cells, 0, deck + 1.095, -.03, .47, .27, .39, plaster);
        for (const x of [-.22, .22]) cell(cells, x, deck + 1.10, .185, .045, .27, .045, timber);
        cell(cells, 0, deck + 1.10, .18, .19, .16, .026, '#695e43');
        roof(.91, .76, deck + 1.235, .22);
        cell(cells, 0, deck + 1.52, 0, .10, .10, .10, '#9a8b5a');

      }

      function terrainHeight(config, x, z) {
        let peak = 0;
        for (const p of config.peaks || []) {
          const d = Math.hypot((x - p[0]) / p[3], (z - p[1]) / (p[3] * .72));
          peak = Math.max(peak, Math.max(0, 1 - d) ** 1.1 * p[2]);
        }
        return config.deck + peak + (noise2(x * 5 + config.x * 3, z * 5) - .5) * (config.temple ? .035 : .17);
      }

      function makeIsland(config) {
        const group = new THREE.Group(); group.position.set(config.x, WATER_Y + config.lift, config.z); scene.add(group);
        const cells = [], lights = [], homes = [], columns = new Map();
        const step = .112, nx = Math.ceil(config.rx / step), nz = Math.ceil(config.rz / step);
        const key = (x, z) => `${x},${z}`;
        for (let ix = -nx; ix <= nx; ix++) for (let iz = -nz; iz <= nz; iz++) {
          const x = ix * step, z = iz * step;
          const edge = Math.hypot(x / config.rx, z / config.rz);
          const broken = .94 + noise2(ix * .65 + config.x, iz * .65) * .12;
          if (edge > broken) continue;
          const top = Math.round(terrainHeight(config, x, z) / step);
          const bottom = Math.round((.06 + edge ** 1.8 * config.deck * .54 + noise2(ix, iz) * .13) / step);

            for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
              const next = columns.get(key(ix + dx, iz + dz));
              if (!next || iy < next.bottom || iy > next.top) exposed = true;
            }
            if (!exposed) continue;
            const summit = iy === column.top;
            const isMeadow = summit && iy * step < config.deck + .15;
            const palette = isMeadow ? mossColors : rockColors;
            const color = palette[Math.floor(random() * palette.length)];
            cell(cells, ix * step, iy * step, iz * step, step * .99, step * .99, step * .99, color);
            if (column.edge > .65 && random() < .14) homes.push(new THREE.Vector3(ix * step + (random() - .5) * .09, iy * step + .06, iz * step + (random() - .5) * .09));
          }

          lantern(cells, lights, .47, deck, .57, .64);

        const island = { ...config, group, deck, cells, samples: [config.rx * .58, config.rz * .58], vy: 0, wx: 0, wz: 0, pitch: 0, roll: 0, homeY: WATER_Y + config.lift };

      }

      const mainIsland = makeIsland({ x: -.91, z: .53, rx: 1.02, rz: .96, deck: 1.01, lift: .16, temple: true });
      const eastIsland = makeIsland({ x: 1.42, z: .35, rx: .64, rz: .64, deck: .69, lift: .21, lantern: true, trees: [[-.23, -.18, .84], [.19, -.19, 1.02], [.28, .14, .60]], peaks: [[.1, -.22, .22, .34]] });
      const mountainIsland = makeIsland({ x: -.67, z: -1.82, rx: .75, rz: .58, deck: .89, lift: .42, trees: [[-.32, .16, .74]], peaks: [[-.10, -.11, 1.46, .43], [.33, .00, .93, .35], [-.43, -.14, .79, .29]] });
      const farIsland = makeIsland({ x: 1.43, z: -1.67, rx: .49, rz: .49, deck: .55, lift: .26, trees: [[.13, .05, .70]], peaks: [[-.04, -.19, .69, .31]] });
      const nearIsland = makeIsland({ x: .63, z: 2.13, rx: .36, rz: .33, deck: .36, lift: .16, trees: [[-.035, -.03, .60]], peaks: [[-.12, -.06, .10, .19]] });

      // CPU buoyancy and GPU displacement use the same bounded wave field.
      function waterHeight(x, z, time = elapsed) {
        let h = .008 * Math.sin(x * 1.7 + z * 1.1 - time * .7) + .005 * Math.sin(-x * 2.6 + z * 1.9 + time * .9);
        const along = x * windDirection.x + z * windDirection.y;
        const across = -x * windDirection.y + z * windDirection.x;
        h += wind * (.145 * Math.sin(along * 2.4 - time * 3.1) + .062 * Math.sin(across * 3.8 - time * 3.7) + .028 * Math.sin(along * 7.2 - time * 5.2));
        for (const ripple of ripples) {
          const age = time - ripple.z;
          if (age < 0 || age > 8) continue;
          const distance = Math.hypot(x - ripple.x, z - ripple.y);
          const front = distance - age * 1.12;
          h += Math.sin(front * 14) * Math.exp(-front * front * 3.6 - age * .52) * ripple.w;
        }

      }
      function addRipple(x, z, strength = .065) {

        rippleCursor = (rippleCursor + 1) % RIPPLE_COUNT;

      const waveGLSL = `
        uniform float uTime;
        uniform float uWind;
        uniform vec2 uWindDirection;

        float waveHeight(vec2 p) {
          float h = 0.008 * sin(p.x * 1.7 + p.y * 1.1 - uTime * 0.7)
                  + 0.005 * sin(-p.x * 2.6 + p.y * 1.9 + uTime * 0.9);

                      + 0.062 * sin(across * 3.8 - uTime * 3.7)
                      + 0.028 * sin(along * 7.2 - uTime * 5.2));

            float age = uTime - uRipples[i].z;
            if (age >= 0.0 && age <= 8.0) {

              h += sin(front * 14.0) * exp(-front * front * 3.6 - age * 0.52) * uRipples[i].w;
            }

          return clamp(h, -0.26, 0.26) * (1.0 - smoothstep(${WATER_RADIUS - .64}, ${WATER_RADIUS - .025}, length(p)));

      // Semi-Lagrangian pigment advection in a curl field, with a no-outflow rim.
      const fluidScene = new THREE.Scene();
      const fluidCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const fluidUniforms = {
        uState: { value: null }, uTime: shared.time, uWind: shared.wind,
        uWindDirection: shared.direction, uDt: { value: 1 / 60 },
        uSources: { value: islands.map(i => new THREE.Vector3(i.x, i.z, Math.min(i.rx, i.rz))) }
      };
      const fluidMaterial = new THREE.ShaderMaterial({
        uniforms: fluidUniforms, depthTest: false, depthWrite: false, toneMapped: false,
        vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
        fragmentShader: `
          precision highp float;
          uniform sampler2D uState; uniform float uTime; uniform float uWind; uniform float uDt;
          uniform vec2 uWindDirection; uniform vec3 uSources[5]; varying vec2 vUv;
          ${noiseGLSL}
          float stream(vec2 p) { return fbm(p * 1.6 + vec2(uTime * 0.027, -uTime * 0.017)); }
          void main() {
            vec2 p = (vUv - 0.5) * ${(WATER_RADIUS * 2).toFixed(3)};
            float radial = length(p);
            if (radial > ${WATER_RADIUS - .02}) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
            float e = 0.04;
            vec2 curlFlow = vec2(stream(p + vec2(0.0, e)) - stream(p - vec2(0.0, e)),
                              -stream(p + vec2(e, 0.0)) + stream(p - vec2(e, 0.0))) / (2.0 * e);
            vec2 velocity = curlFlow * (0.09 + uWind * 0.13) + uWindDirection * uWind * 0.74;
            vec2 outward = p / max(radial, 0.01);
            float boundary = smoothstep(${WATER_RADIUS - .52}, ${WATER_RADIUS - .03}, radial);
            velocity -= outward * max(dot(velocity, outward), 0.0) * boundary;
            vec2 traced = vUv - velocity * uDt / ${(WATER_RADIUS * 2).toFixed(3)};
            float ink = texture2D(uState, traced).r;
            vec2 texel = vec2(1.0 / 256.0, 0.0);
            float blurred = (texture2D(uState, traced + texel.xy).r + texture2D(uState, traced - texel.xy).r
                           + texture2D(uState, traced + texel.yx).r + texture2D(uState, traced - texel.yx).r) * 0.25;
            ink = mix(ink, blurred, 1.0 - exp(-uDt * 1.7));
            float source = 0.0;
            for (int i = 0; i < 5; i++) {
              float d = length((p - uSources[i].xy) * vec2(1.0, 1.15));
              source += exp(-pow((d - uSources[i].z * 0.82) * 5.0, 2.0));
            }
            source *= 0.35 + fbm(p * 9.0) * 0.65;
            float home = source * 0.57;

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          keyboardBreath = pointerBreath = false; updateBreathState();
          if (audio && audio.state === 'running') audio.suspend().catch(error => console.warn('音频暂停失败', error));
        } else { previousStamp = 0; if (audio && soundEnabled) startAudio(); }
      });

      resize(); resetView(); controls.saveState();
      updateDaylight();
      for (const island of islands) island.group.updateMatrixWorld(true);
      updateBridges(); updateWaterfalls(); updateBalloon(); updateFish();

      function animate(stamp) {
        requestAnimationFrame(animate);
        if (document.hidden) { previousStamp = 0; return; }
        const dt = previousStamp ? Math.min((stamp - previousStamp) / 1000, .05) : 1 / 60;
        previousStamp = stamp; elapsed += dt; frame++;
        day = (day + dt * timeSpeed / 360) % 1;
        const blowing = keyboardBreath || pointerBreath;
        wind += ((blowing ? 1 : 0) - wind) * (1 - Math.exp(-dt * (blowing ? 1.8 : 1.35)));
        scatter += ((blowing ? 1 : 0) - scatter) * (1 - Math.exp(-dt * (blowing ? 1.2 : .80)));
        shared.time.value = elapsed; shared.wind.value = wind; shared.scatter.value = scatter;
        fixedAccumulator += dt;
        const physicsStep = 1 / 120;
        while (fixedAccumulator >= physicsStep) {
          stepBuoyancy(physicsStep, elapsed - fixedAccumulator + physicsStep); fixedAccumulator -= physicsStep;
        }
        for (const island of islands) island.group.updateMatrixWorld(true);
        updateDaylight(); updateBridges(); updateWaterfalls(); updateBalloon(); updateFish();
        controls.autoRotate = !reducedMotion && !pointerOrbit && !blowing && stamp - lastInteraction > 4500;
        controls.update(dt);
        if (frame % 3 === 0) breathButton.style.setProperty('--breath', `${wind * 100}%`);
        if (windGain && soundEnabled && audio.state === 'running') {
          windGain.gain.setTargetAtTime(wind * .075, audio.currentTime, .12);
          windFilter.frequency.setTargetAtTime(350 + wind * 750, audio.currentTime, .2);
        }
        updateFluid(dt);
        renderer.render(scene, camera);
        if (frame === 1) document.querySelector('#loading').classList.add('hidden');
      }
      requestAnimationFrame(animate);
    }
    createTeaWorld().catch(error => {
      console.error(error);
      document.querySelector('#loading-text').textContent = '载入未完成，请检查网络与 WebGL 支持';
      document.querySelector('.loading-ring').style.animation = 'none';
      document.querySelector('#reload').style.display = 'block';
    });
  </script>
</body>
</html>
