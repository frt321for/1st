    :root { color-scheme: dark; --paper: #f0f0e7; --orange: #ff5b36; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #08090d; }
    body { font-family: 'Space Mono', monospace; -webkit-tap-highlight-color: transparent; }
    #theater { position: fixed; inset: 0; display: grid; place-items: center; }
    #film { position: relative; width: min(100vw, 177.777778dvh); aspect-ratio: 16 / 9; overflow: hidden; background: #08090d; isolation: isolate; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
    #sculpture { z-index: 1; }
    #finish { z-index: 2; }
    .controls { position: fixed; z-index: 5; bottom: max(21px, env(safe-area-inset-bottom)); left: 50%; width: min(660px, calc(100vw - 40px)); transform: translateX(-50%); opacity: 1; transition: opacity .55s, translate .55s; color: var(--paper); }
    body.quiet .controls { opacity: 0; translate: 0 8px; pointer-events: none; }
    body.quiet .controls:has(:focus-visible) { opacity: 1; translate: 0; pointer-events: auto; }
    .rail { padding: 10px 0; cursor: pointer; }
    #seek { display: block; appearance: none; -webkit-appearance: none; width: 100%; height: 2px; margin: 0; border: 0; border-radius: 0; cursor: pointer; background: linear-gradient(to right, var(--orange) var(--played, 0%), #ffffff35 var(--played, 0%)); }
    #seek::-webkit-slider-thumb { appearance: none; width: 8px; height: 8px; border-radius: 50%; background: var(--paper); box-shadow: 0 0 12px #ff5b3680; }

      const notes = [329.6276, 493.8833, 587.3295, 739.9888, 493.8833, 391.9954, 369.9944, 293.6648];
      for (let i = 0; i < 16; i++) {
        const at = 3.75 + i * BEAT / 2;
        tone(at, .32, notes[i % notes.length], .046, 'triangle', i % 2 ? .42 : -.42, true);
        tone(at, .22, notes[i % notes.length] * 2, .019, 'sine', i % 2 ? -.24 : .24, true);
      }
      sweep(6.72, .77, true, .16);
      sweep(8.72, .65, true, .18);
      sweep(9.375, 2.80, true, .24);
      for (let i = 0; i < 24; i++) {
        const at = 9.375 + i * BEAT / 4, hz = notes[i % notes.length] * (i > 15 ? 2 : 1);
        tone(at, .17, hz, .055, 'triangle', Math.sin(i * 1.8) * .60, true);
        if (i % 3 === 0) noiseHit(at, .021, .04, 6500, 'highpass', Math.sin(i) * .6);
      }
      sweep(12.19, .70, false, .20);
      pad(12.1875, 2.75, [82.4069, 164.8138, 195.9977, 246.9417, 369.9944], .054);
      tone(12.1875, 1.15, 659.2551, .12, 'sine', -.32, true);
      tone(12.1875, 1.38, 987.7666, .06, 'sine', .32, true);
      return offline.startRendering();
    }

    function clockTime() {
      const elapsed = audioEnabled && audioSource ? audioContext.currentTime - audioOrigin : (performance.now() - anchor) / 1000;
      return clamp(segmentStart + Math.max(0, elapsed), 0, DURATION);
    }
    function stopAudio() {
      if (audioSource) { audioSource.stop(); audioSource.disconnect(); audioSource = null; }
    }
    function startAudio(offset) {
      if (!audioEnabled || !score || offset >= DURATION) return;
      stopAudio();
      audioSource = audioContext.createBufferSource(); audioSource.buffer = score; audioSource.connect(audioContext.destination);
      audioOrigin = audioContext.currentTime + .025;
      audioSource.start(audioOrigin, offset);
    }
    function updateControls() {
      playButton.innerHTML = playing ? '<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></svg>' : '<svg viewBox="0 0 24 24"><path d="m8 4 12 8-12 8z" fill="currentColor" stroke="none"/></svg>';
      playButton.setAttribute('aria-label', playing ? '暂停' : time >= DURATION ? '重新播放' : '播放');
      soundButton.setAttribute('aria-pressed', String(audioEnabled));
      soundButton.setAttribute('aria-label', audioEnabled ? '关闭声音' : '开启声音并从头播放');
      soundButton.title = audioEnabled ? '关闭声音（M）' : '开启声音并从头播放（M）';
      soundButton.innerHTML = audioEnabled ? '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/></svg><span>声音已开</span>' : '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM16 9l5 6m0-6-5 6"/></svg><span>有声重播</span>';
    }
    function updateProgress() {
      if (!scrubbing) seekControl.value = time;
      seekControl.style.setProperty('--played', `${time / DURATION * 100}%`);
      timeLabel.textContent = `00:${String(Math.floor(time)).padStart(2, '0')}`;
      seekControl.setAttribute('aria-valuetext', `${time.toFixed(1)} 秒，共 15 秒`);
    }
    function showControls() {
      document.body.classList.remove('quiet'); clearTimeout(hideTimer);
      if (playing && !scrubbing) hideTimer = setTimeout(() => { if (!document.querySelector('.controls :focus-visible')) document.body.classList.add('quiet'); }, 2200);
    }
    function play() {
      if (!initialized) return;
      if (time >= DURATION) time = 0;
      segmentStart = time; anchor = performance.now(); playing = true;
      startAudio(time); updateControls(); showControls(); status.textContent = '正在播放';
    }
    function pause() {
      if (playing) time = clockTime();
      playing = false; stopAudio(); updateControls(); updateProgress(); showControls(); status.textContent = '已暂停';
    }
    function rewind() {
      if (!initialized) return;
      stopAudio(); time = 0; segmentStart = 0; render(0); play();
    }
    function seekTo(value) {
      if (!initialized) return;

      render(time); updateProgress();

    async function toggleSound() {
      if (!initialized || soundButton.disabled) return;
      if (audioEnabled) {
        if (playing) time = clockTime();
        stopAudio(); audioEnabled = false; segmentStart = time; anchor = performance.now();
      } else {
        soundButton.disabled = true;
        try {
          audioContext ||= new AudioContext();
          await audioContext.resume();
          score = await scorePromise;
          audioEnabled = true; rewind();

      updateControls(); showControls();
    }
    function endScrub() {
      if (!scrubbing) return;
      scrubbing = false;
      const resume = resumeAfterScrub;
      resumeAfterScrub = false;
      updateProgress();

    }
    async function fullscreen() {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    }
    function frame() {
      if (playing) {
        time = clockTime(); render(time); updateProgress();
        if (time >= DURATION) { playing = false; stopAudio(); updateControls(); showControls(); status.textContent = '播放结束'; }
      }
      requestAnimationFrame(frame);
    }
    function fail(error) {
      pause();
      const panel = document.getElementById('error');
      panel.style.display = 'grid';
      panel.textContent = error.message;
    }
    async function init() {
      await Promise.all([document.fonts.load('800 80px Syne'), document.fonts.load('400 20px "Space Mono"')]);
      initGL(); resize(); initialized = true;
      scorePromise = composeScore();
      scorePromise.then(buffer => { score = buffer; }, error => {
        soundButton.disabled = true; soundButton.title = `声音生成失败：${error.message}`;
        soundButton.querySelector('span').textContent = '声音未就绪';
      });
      updateControls();
      if (reduced) { time = DURATION; render(time); updateControls(); updateProgress(); showControls(); status.textContent = '已显示静帧，按播放观看短片'; }
      else { render(0); play(); }
      requestAnimationFrame(frame);
    }

    playButton.addEventListener('click', () => playing ? pause() : play());
    document.getElementById('replay').addEventListener('click', rewind);
    soundButton.addEventListener('click', () => toggleSound().catch(error => { status.textContent = `声音启动失败：${error.message}`; }));
    document.getElementById('fullscreen').addEventListener('click', () => fullscreen().catch(error => { status.textContent = `全屏启动失败：${error.message}`; }));
    seekControl.addEventListener('pointerdown', () => { scrubbing = true; resumeAfterScrub = playing; pause(); });
    seekControl.addEventListener('input', () => { seekTo(Number(seekControl.value)); showControls(); });
    window.addEventListener('pointerup', endScrub);
    window.addEventListener('pointercancel', endScrub);
    seekControl.addEventListener('change', endScrub);
    document.addEventListener('pointermove', showControls, { passive: true });
    document.addEventListener('pointerdown', showControls, { passive: true });
    document.addEventListener('keydown', event => {
      if (event.target.closest('button, input')) return;
      if (event.code === 'Space') { event.preventDefault(); playing ? pause() : play(); }
      else if (event.key.toLowerCase() === 'r') rewind();
      else if (event.key.toLowerCase() === 'm') toggleSound().catch(error => { status.textContent = error.message; });
      else if (event.key.toLowerCase() === 'f') fullscreen().catch(error => { status.textContent = error.message; });
      else if (event.code === 'ArrowRight') { event.preventDefault(); seekTo((playing ? clockTime() : time) + .5); }
      else if (event.code === 'ArrowLeft') { event.preventDefault(); seekTo((playing ? clockTime() : time) - .5); }
      showControls();
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden && playing) pause(); });
    window.addEventListener('resize', () => { if (initialized) resize(); });
    init().catch(fail);
