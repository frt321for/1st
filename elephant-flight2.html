<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#dfedf0">
  <title>大象的顺风车</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #36535d;
      --progress: 0%;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
      color: var(--ink);
      background: linear-gradient(180deg, #dcecf2 0%, #e9efea 56%, #f4e5ce 100%);
    }
    .scene { position: fixed; inset: 0; }
    .scene > svg { display: block; width: 100%; height: 100%; }
    .heading {
      position: fixed;
      top: clamp(28px, 4.8vw, 62px);
      left: clamp(24px, 5vw, 80px);
      pointer-events: none;
    }
    h1 {
      margin: 0;
      font-size: clamp(23px, 2.25vw, 34px);
      font-weight: 650;
      letter-spacing: .09em;
    }
    .heading p {
      margin: 12px 0 0;
      font-size: 13px;
      letter-spacing: .22em;
      color: #69828a;
    }
    .controls {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 15px;
      width: min(452px, calc(100% - 36px));
      padding: 12px 15px 12px 12px;
      border: 1px solid #ffffffbd;
      border-radius: 48px;
      background: #fffdf6de;
      box-shadow: 0 8px 36px #47646812, inset 0 1px 0 #fff;
      backdrop-filter: blur(16px);
    }
    button {
      display: grid;
      place-items: center;
      flex: none;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      transition: background .18s, transform .18s;
    }
    button:hover { background: #36535d0b; }
    button:active { transform: scale(.94); }
    button svg { width: 19px; height: 19px; }
    #toggle { width: 44px; height: 44px; background: var(--ink); color: #fffdf6; }
    #toggle:hover { background: #496d76; }
    #replay { width: 36px; height: 36px; }
    :focus-visible { outline: 3px solid #df9a49; outline-offset: 4px; }
    .transport { flex: 1; min-width: 0; }
    .readout { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #status { font-size: 12px; font-weight: 600; letter-spacing: .06em; }
    #time { color: #84928f; font: 10px/1.2 Consolas, monospace; font-variant-numeric: tabular-nums; }
    input[type="range"] {
      appearance: none;
      display: block;
      width: 100%;
      height: 4px;
      margin: 11px 0 3px;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(to right, #527581 0% var(--progress), #dce2d8 var(--progress) 100%);
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 10px;
      height: 10px;
      border: 2px solid #fffdf6;
      border-radius: 50%;
      background: #527581;
      box-shadow: 0 0 0 1px #527581;
    }
    input[type="range"]::-moz-range-thumb {
      width: 7px;
      height: 7px;
      border: 2px solid #fffdf6;
      border-radius: 50%;
      background: #527581;
      box-shadow: 0 0 0 1px #527581;
    }
    @media (max-width: 520px) {
      .heading p { font-size: 11px; margin-top: 10px; }
      .controls { gap: 12px; }
      #time { font-size: 9px; }
    }
  </style>
</head>

          <path d="M-76-11Q-58-24-22-24H25Q52-24 70-15" fill="none" stroke="#fff0b7" stroke-width="5"/>
          <path d="M-24-31l8-12h32l8 12Z" fill="#f4cb70" stroke="#957c4d" stroke-width="2.5"/>
          <path d="M-15-42v-8h30v8" fill="#d4e1d9" stroke="#4c6770" stroke-width="2.5"/>
          <path d="M-8-50v-7" stroke="#4c6770" stroke-width="3"/>
          <path d="M-51-5v10m8-10v10m8-10v10" stroke="#bd8a41" stroke-width="3"/>
          <rect x="10" y="-13" width="44" height="25" rx="9" fill="#425e69"/>
          <rect x="16" y="-9" width="12" height="16" rx="4" fill="#86b4ba"/>
          <path d="M21-6l4 0" stroke="#d1eddf" stroke-width="2"/>
          <circle cx="43" cy="-1" r="5" fill="#9ec4b3"/>
          <circle id="signal" cx="68" cy="10" r="3" fill="#fef9d6"/>
          <path d="M-10 40v8q10 10 20 0v-8" fill="none" stroke="#425e69" stroke-width="4"/>
          <g fill="#425e69" stroke="#e2e5cd" stroke-width="1.5">
            <circle cx="-57" cy="38" r="4.5"/><circle cx="57" cy="38" r="4.5"/>
          </g>
          <use href="#rotor" transform="translate(-187 8)"/>
          <use href="#rotor" transform="translate(187 8)"/>
        </g>
      </g>
    </svg>
  </main>

  <header class="heading">
    <h1>大象的顺风车</h1>
    <p>向着山的另一边</p>
  </header>

  <section class="controls" aria-label="动画播放控制">
    <button id="toggle" type="button" aria-label="暂停动画" title="暂停动画">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path id="toggle-icon" d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>
    </button>
    <div class="transport">
      <div class="readout">
        <span id="status" role="status">准备起飞</span>
        <span id="time">0:00 / 0:23</span>
      </div>
      <input id="seek" type="range" min="0" max="23" value="0" step="0.01" aria-label="动画进度">
    </div>
    <button id="replay" type="button" aria-label="重新播放" title="重新播放">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5.5 8A8 8 0 1 1 4 14M5.5 3.5V8H10"/>
      </svg>
    </button>
  </section>

  <script>
    const $ = id => document.getElementById(id);
    const duration = 23;
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const parts = {
      traveller: $('traveller'), drone: $('drone'), elephant: $('elephant'),
      cable: $('cable-outline'), cableLight: $('cable-light'),
      blades: $('rotor-blades'), ear: $('ear'), trunk: $('trunk'), tail: $('tail'),
      backLeg: $('back-leg'), frontLeg: $('front-leg'), stream: $('slipstream'),
      departureShadow: $('departure-shadow'), arrivalShadow: $('arrival-shadow'),
      wash: $('wash'), washA: $('wash-a'), washB: $('wash-b'), signal: $('signal'),
      cloudA: $('cloud-a'), cloudB: $('cloud-b'), cloudC: $('cloud-c')
    };
    const toggle = $('toggle');
    const toggleIcon = $('toggle-icon');
    const seek = $('seek');
    const status = $('status');
    const time = $('time');
    let elapsed = reducedMotion ? 10 : 0;
    let playing = false;
    let frameId = null;
    let previousTime = null;

    const clamp = value => Math.max(0, Math.min(1, value));
    const smooth = value => {
      const t = clamp(value);
      return t * t * t * (t * (t * 6 - 15) + 10);
    };
    const ease = value => (1 - Math.cos(Math.PI * clamp(value))) / 2;
    const radians = degrees => degrees * Math.PI / 180;
    const rotate = (x, y, angle) => {
      const a = radians(angle);
      return [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
    };
    const point = pair => pair.map(value => value.toFixed(2)).join(' ');

    function render(t) {
      const journey = clamp((t - 1.2) / 19.2);
      const x = 270 + 1050 * smooth(journey);
      let altitude;
      if (t < 4.8) {
        altitude = 171 * ease((t - 1.2) / 3.6);
      } else if (t < 15.5) {
        altitude = 171 + 18 * Math.sin(Math.PI * (t - 4.8) / 10.7);
      } else {
        altitude = 171 * (1 - ease((t - 15.5) / 4.9));
      }
      const airborne = clamp(altitude / 120);
      const y = 430 - altitude + Math.sin(t * 2.4) * 2 * airborne;
      const pitch = 2.6 * Math.sin(Math.PI * journey) * airborne;
      const swing = (-2.1 * Math.sin(t * 1.8) - 1.7 * Math.sin(journey * Math.PI * 2)) * airborne;
      const cargoX = -Math.sin(radians(swing)) * 158;
      const cargoY = 44 + Math.cos(radians(swing)) * 158;
      parts.traveller.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})`);
      parts.drone.setAttribute('transform', `rotate(${pitch.toFixed(2)})`);
      parts.elephant.setAttribute('transform', `translate(${cargoX.toFixed(2)} ${cargoY.toFixed(2)}) rotate(${swing.toFixed(2)})`);

      const leftTop = rotate(-57, 38, pitch);
      const rightTop = rotate(57, 38, pitch);
      const leftBottom = rotate(-72, -46, swing).map((value, index) => value + [cargoX, cargoY][index]);
      const rightBottom = rotate(39, -47, swing).map((value, index) => value + [cargoX, cargoY][index]);
      const cablePath = `M${point(leftTop)}L${point(leftBottom)}M${point(rightTop)}L${point(rightBottom)}`;
      parts.cable.setAttribute('d', cablePath);
      parts.cableLight.setAttribute('d', cablePath);

      const rotorPhase = t * 102;
      const ax = Math.cos(rotorPhase) * 69;
      const ay = Math.sin(rotorPhase) * 8;
      const bx = Math.cos(rotorPhase + Math.PI / 2) * 69;
      const by = Math.sin(rotorPhase + Math.PI / 2) * 8;
      parts.blades.setAttribute('d', `M${-ax} ${-ay}L${ax} ${ay}M${-bx} ${-by}L${bx} ${by}`);
      parts.ear.setAttribute('transform', `rotate(${Math.sin(t * 2.2) * 3 * airborne} 61 -35)`);
      parts.trunk.setAttribute('transform', `rotate(${Math.sin(t * 2.7 + 1) * 3 * airborne} 111 -20)`);
      parts.tail.setAttribute('transform', `rotate(${Math.sin(t * 5.5) * 5 * airborne} -99 -15)`);
      parts.backLeg.setAttribute('transform', `rotate(${Math.sin(t * 2.5) * 3 * airborne} -58 43)`);
      parts.frontLeg.setAttribute('transform', `rotate(${Math.sin(t * 2.5 + 1.1) * 4 * airborne} 31 43)`);
      parts.stream.setAttribute('opacity', (.65 * airborne).toFixed(2));
      parts.stream.setAttribute('transform', `translate(${-Math.sin(t * 4) * 9} 0)`);
      parts.signal.setAttribute('opacity', (.65 + .35 * Math.sin(t * 5)).toFixed(2));

      const nearGround = 1 - clamp(altitude / 155);
      parts.departureShadow.setAttribute('opacity', (t < 10 ? nearGround * .2 : 0).toFixed(3));
      parts.arrivalShadow.setAttribute('opacity', (t > 10 ? nearGround * .2 : 0).toFixed(3));
      const shadowWidth = 65 + nearGround * 26;
      parts.departureShadow.setAttribute('rx', shadowWidth);
      parts.arrivalShadow.setAttribute('rx', shadowWidth);

      const washStrength = t > .3 && t < 21.1 ? nearGround * .52 : 0;
      const pulse = (t * .9) % 1;
      parts.wash.setAttribute('opacity', washStrength.toFixed(3));
      for (const [ring, phase] of [[parts.washA, pulse], [parts.washB, (pulse + .5) % 1]]) {
        ring.setAttribute('cx', x.toFixed(2));
        ring.setAttribute('rx', 87 + phase * 98);
        ring.setAttribute('ry', 16 + phase * 22);
        ring.setAttribute('opacity', (1 - phase).toFixed(3));
      }
      parts.cloudA.setAttribute('transform', `translate(${-t * .8} 0)`);
      parts.cloudB.setAttribute('transform', `translate(${-t * 1.2} 0)`);
      parts.cloudC.setAttribute('transform', `translate(${-t * .55} 0)`);

      const label = t < 1.2 ? '准备起飞' : t < 4.8 ? '缓缓升空' : t < 15.5 ? '飞越山谷' : t < 20.4 ? '轻轻降落' : '顺利抵达';
      if (status.textContent !== label) status.textContent = label;
      seek.value = t;
      seek.style.setProperty('--progress', `${t / duration * 100}%`);
      seek.setAttribute('aria-valuetext', `${label}，${Math.floor(t)} 秒，共 ${duration} 秒`);
      time.textContent = `0:${String(Math.floor(t)).padStart(2, '0')} / 0:23`;
    }

    function setPlaying(value) {
      playing = value;
      const label = value ? '暂停动画' : elapsed >= duration ? '重新播放' : '播放动画';
      toggle.setAttribute('aria-label', label);
      toggle.title = label;
      toggleIcon.setAttribute('d', value ? 'M7 5h3v14H7zM14 5h3v14h-3z' : 'M8 4.5v15L19 12z');
      previousTime = null;
      if (frameId !== null) cancelAnimationFrame(frameId);
      frameId = value ? requestAnimationFrame(tick) : null;
    }

    function tick(timestamp) {
      if (previousTime !== null) elapsed = Math.min(duration, elapsed + (timestamp - previousTime) / 1000);
      previousTime = timestamp;
      render(elapsed);
      if (elapsed >= duration) {
        setPlaying(false);
      } else {
        frameId = requestAnimationFrame(tick);
      }
    }

    toggle.addEventListener('click', () => {
      if (elapsed >= duration) {
        elapsed = 0;
        render(elapsed);
      }
      setPlaying(!playing);
    });
    $('replay').addEventListener('click', () => {
      elapsed = 0;
      render(elapsed);
      setPlaying(true);
    });
    seek.addEventListener('input', () => {
      elapsed = Number(seek.value);
      previousTime = null;
      render(elapsed);
      if (elapsed >= duration) setPlaying(false);
      else if (!playing) setPlaying(false);
    });

    render(elapsed);
    setPlaying(!reducedMotion);
  </script>
</body>
</html>
