<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#263d42">
  <meta name="description" content="青湾铁路：木桌上的体素模型铁路，有昼夜、港口、城镇和可以亲手操作的控制台。">
  <title>青湾铁路 · Qingwan Railway</title>
  <style>
    :root { color-scheme: dark; --paper: #f4eedc; --muted: #bdcec7; --sea: #85c9b8; --ink: #20363b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #30484c; color: var(--paper); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible, canvas:focus-visible { outline: 2px solid #f6c878; outline-offset: 5px; }
    button:disabled { cursor: default; opacity: .55; }
    [hidden] { display: none !important; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    #scene.dragging { cursor: grabbing; }
    .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 52%, transparent 53%, #122a3029 100%); }
    .masthead { position: fixed; top: 28px; left: 34px; right: 30px; display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; pointer-events: none; }
    .brand { display: flex; align-items: center; gap: 13px; text-shadow: 0 2px 16px #172d3366; }
    .brand-mark { width: 39px; height: 44px; color: #edce91; }
    h1 { margin: 0; font-family: "Songti SC", "SimSun", Georgia, serif; font-size: 25px; font-weight: 600; letter-spacing: .15em; line-height: 1.35; }
    .brand-sub { margin: 6px 0 0; font-size: 9px; font-weight: 500; letter-spacing: .22em; color: #d3ddd2; }
    .top-right { display: flex; align-items: center; gap: 14px; pointer-events: auto; }
    .clock { display: flex; align-items: center; gap: 12px; padding: 10px 17px; border: 1px solid #f3eed426; border-radius: 9px; background: #233a4057; backdrop-filter: blur(12px); }
    #sky-icon { width: 21px; height: 21px; color: #f3cf87; }
    #time { font-family: Consolas, monospace; font-size: 19px; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
    #day-label { color: #d5ddd3; font-size: 10px; line-height: 1.6; }
    .clock-divider { width: 1px; height: 24px; background: #e0e5d22b; }
    .toolbar { display: flex; gap: 7px; }
    .icon-button { display: grid; place-items: center; width: 38px; height: 38px; padding: 0; background: #21393d66; border: 1px solid #f3eed424; border-radius: 50%; backdrop-filter: blur(10px); transition: background .2s, border-color .2s; }
    .icon-button:hover, .icon-button[aria-expanded="true"], .icon-button[aria-pressed="true"] { background: #48645d; border-color: #a7c8b785; }
    .icon-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .footer { position: fixed; left: 32px; right: 32px; bottom: 19px; display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; pointer-events: none; font-size: 10px; color: #e4e7d7; text-shadow: 0 2px 6px #14272d; }
    .route-key { display: flex; gap: 18px; letter-spacing: .06em; }
    .route-key span { display: inline-flex; align-items: center; gap: 7px; }
    .route-key i { width: 17px; height: 3px; border-radius: 2px; background: #ed8170; box-shadow: 0 0 6px #de5a4444; }
    .route-key span + span i { background: #84d2cb; box-shadow: 0 0 6px #5ebbb744; }
    .gesture-hint { color: #d9ded0; letter-spacing: .04em; }
    .run-state { display: flex; align-items: center; gap: 7px; font-family: Consolas, "Microsoft YaHei", monospace; }
    .run-state i { width: 5px; height: 5px; background: #b8e6a2; border-radius: 50%; box-shadow: 0 0 7px #b8e6a255; }
    #tooltip { position: fixed; z-index: 4; max-width: 260px; padding: 9px 13px; background: #20383bea; color: var(--paper); border: 1px solid #cbd6bd38; border-radius: 6px; font-size: 12px; line-height: 1.5; pointer-events: none; backdrop-filter: blur(12px); box-shadow: 0 4px 20px #14272820; }
    #toast { position: fixed; left: 50%; bottom: 74px; transform: translate(-50%, 7px); background: #213a3ee8; border: 1px solid #d1dec032; border-radius: 22px; padding: 11px 20px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; }
    #toast.visible { opacity: 1; transform: translate(-50%, 0); }
    #controls { position: fixed; top: 89px; right: 29px; width: 302px; max-height: calc(100% - 120px); overflow: auto; padding: 22px; background: #20383bef; border: 1px solid #c5d5ba38; border-radius: 12px; box-shadow: 0 18px 60px #10272c55; backdrop-filter: blur(22px); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    .panel-head h2 { font-size: 16px; font-weight: 500; margin: 0; letter-spacing: .07em; }
    .panel-head button { border: 0; background: transparent; padding: 0 4px; font-size: 23px; color: #bbcec0; }
    .panel-copy { color: #bbcec0; font-size: 11px; line-height: 1.9; margin: 0 0 20px; }
    .speed-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 10px; }
    #speed-input { width: 100%; accent-color: #eaa776; margin: 0 0 22px; }
    .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .control-grid button { text-align: left; padding: 11px 12px; background: #f0edcf08; border: 1px solid #cedeae26; border-radius: 6px; font-size: 12px; }
    .control-grid button:hover { background: #d4dfb918; }
    .control-grid small { display: block; font-size: 10px; margin-top: 5px; color: #aebfae; }
    .panel-foot { margin: 18px 0 0; padding-top: 14px; border-top: 1px solid #ccdab923; font-size: 10px; line-height: 1.8; color: #b6c8b9; }
    kbd { font: 10px Consolas, monospace; color: #f1d29c; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 21px; background: #2b4348; z-index: 10; transition: opacity .6s; }
    #loading.departing { opacity: 0; pointer-events: none; }
    .loading-train { position: relative; width: 55px; height: 29px; border-bottom: 3px solid #9bb7a7; }
    .loading-train::before { content: ""; position: absolute; bottom: 7px; left: 4px; width: 32px; height: 12px; background: #e6bd78; box-shadow: 17px -7px 0 -1px #e6bd78; }
    .loading-train::after { content: ""; position: absolute; bottom: 2px; left: 10px; width: 6px; height: 6px; background: #cf795f; box-shadow: 14px 0 #cf795f, 28px 0 #cf795f; }
    #loading-text { font-size: 12px; letter-spacing: .14em; text-align: center; line-height: 1.9; max-width: 340px; padding: 0 20px; }
    #retry { padding: 9px 18px; background: #739482; border: 0; border-radius: 5px; font-size: 12px; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; clip: rect(0, 0, 0, 0); overflow: hidden; white-space: nowrap; }
    @media (max-width: 760px) {
      .masthead { top: 19px; left: 19px; right: 18px; gap: 10px; }
      .brand { gap: 9px; } .brand-mark { width: 28px; height: 36px; } h1 { font-size: 21px; }
      .brand-sub { font-size: 7px; letter-spacing: .12em; } .top-right { gap: 8px; }
      .clock { padding: 8px 10px; gap: 8px; } #time { font-size: 16px; } .clock-divider, #day-label { display: none; }
      .toolbar { gap: 5px; } .icon-button { width: 33px; height: 33px; } #fullscreen { display: none; }
      .footer { left: 19px; right: 19px; bottom: 17px; font-size: 9px; } .gesture-hint { display: none; }
      .route-key { gap: 11px; } #controls { right: 18px; top: 78px; width: min(302px, calc(100% - 36px)); }
    }
    @media (max-width: 470px) { #sound { display: none; } .brand-sub { letter-spacing: .06em; } .clock { border: 0; background: transparent; padding: 6px 0; } #sky-icon { width: 17px; } .run-state { font-size: 8px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <canvas id="scene" tabindex="0" aria-label="青湾模型铁路。拖动空白处环视，滚轮缩放。拖动桌前红色操纵杆调速，点击实体开关操作。按问号打开控制面板。"></canvas>
  <div class="vignette"></div>
  <header class="masthead">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 44" fill="none" aria-hidden="true"><path d="M20 2 37 12v20L20 42 3 32V12Z" stroke="currentColor" stroke-width="1.25"/><path d="M15 12 12 32m13-20 3 20M14 17h12M13 23h14M12 29h16" stroke="currentColor" stroke-width="1.7"/><path d="M17 8h6" stroke="currentColor"/></svg>
      <div><h1>青湾铁路</h1><p class="brand-sub">QINGWAN RAILWAY &nbsp; / &nbsp; HO · 1:87</p></div>
    </div>
    <div class="top-right">
      <div class="clock" aria-label="模型时间">
        <svg id="sky-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4.2 4.2l2.1 2.1m11.4 11.4 2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        <span id="time">15:24</span><span class="clock-divider"></span><span id="day-label">午后<br>日夜自动</span>
      </div>
      <nav class="toolbar" aria-label="场景工具">
        <button class="icon-button" id="reset-view" title="回到桌前（R）" aria-label="回到桌前"><svg viewBox="0 0 24 24"><path d="m3 11 9-7 9 7M6 10v10h12V10M10 20v-6h4v6"/></svg></button>
        <button class="icon-button" id="sound" title="开启声音" aria-label="开启声音" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4ZM16 9l5 6m0-6-5 6"/></svg></button>
        <button class="icon-button" id="fullscreen" title="全屏" aria-label="全屏"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
        <button class="icon-button" id="help" title="操作与键盘快捷键（?）" aria-label="打开控制面板" aria-controls="controls" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M9 8a3 3 0 1 1 5 2.2c-1.4 1-2 1.3-2 3.3M12 17v.2"/><circle cx="12" cy="12" r="9"/></svg></button>
      </nav>
    </div>
  </header>
  <footer class="footer">
    <div class="route-key"><span><i></i>海湾客运</span><span><i></i>港区货运</span></div>
    <div class="gesture-hint">拖动操纵杆调速 &nbsp; · &nbsp; 点击桌前开关 &nbsp; · &nbsp; 拖动环视 / 滚轮缩放</div>
    <div class="run-state"><i id="run-dot"></i><span id="run-state">铁路运行中</span></div>
  </footer>
  <aside id="controls" hidden aria-label="铁路控制面板">
    <div class="panel-head"><h2>掌管这一方小世界</h2><button id="close-help" aria-label="关闭控制面板">×</button></div>
    <p class="panel-copy">桌前的操纵杆和开关都能直接操作。<br>也可以使用这里的控制与键盘快捷键。</p>
    <label class="speed-label" for="speed-input"><span>列车速度 &nbsp; <kbd>↑ ↓</kbd></span><output id="speed-output" for="speed-input">55%</output></label>
    <input id="speed-input" type="range" min="0" max="100" value="55" aria-label="列车速度">
    <div class="control-grid">
      <button data-action="lights">灯光 <kbd>L</kbd><small id="lights-state">自动点灯</small></button>
      <button data-action="day">日夜 <kbd>N</kbd><small id="day-state">自动循环</small></button>
      <button data-action="turntable">转车台 <kbd>T</kbd><small>转向下一条股道</small></button>
      <button data-action="harbor">港口作业 <kbd>M</kbd><small id="harbor-state">作业中</small></button>
      <button data-action="horn">鸣笛 <kbd>H</kbd><small>听一声汽笛</small></button>
      <button data-action="stop">列车启停 <kbd>Space</kbd><small id="stop-state">运行中</small></button>
    </div>
    <p class="panel-foot">拖动空白处环视 · 滚轮或双指缩放<br><kbd>R</kbd> 回到桌前 &nbsp; <kbd>?</kbd> 打开此面板 &nbsp; <kbd>Esc</kbd> 关闭</p>
  </aside>
  <div id="tooltip" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="loading"><div class="loading-train" aria-hidden="true"></div><div id="loading-text">正在布置青湾铁路</div><button id="retry" hidden>重新加载</button></div>
  <noscript><div style="position:fixed;inset:40%;z-index:20">请在 Chrome 中启用 JavaScript 以运行模型铁路。</div></noscript>
  <script type="module">
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loading-text');
    const retry = document.getElementById('retry');
    retry.addEventListener('click', () => location.reload());
    function showFailure(message, error) {
      loading.hidden = false;
      loading.classList.remove('departing');
      loadingText.textContent = message;
      retry.hidden = false;
      if (error) console.error(error);
    }
    try {
      const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js');
      buildRailway(THREE);
    } catch (error) {
      showFailure('铁路暂时未能启动。请确认网络可访问 Three.js CDN，并在 Chrome 中启用图形加速后重新加载。', error);
    }

    function buildRailway(THREE) {
      'use strict';
      const TAU = Math.PI * 2;
      const G = .94;
      const RAIL = G + .16;
      const WATER = G - .26;
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const canvas = document.getElementById('scene');
      const tooltip = document.getElementById('tooltip');
      const toastElement = document.getElementById('toast');
      const state = { speed: .55, actualSpeed: .55, stopped: false, lightMode: 'auto', dayMode: 'auto', hours: 15.4, machines: true, sound: false };
      const view = { yaw: .105, pitch: .445, radius: 36.8 };
      const viewHome = { ...view };
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#526b70');
      scene.fog = new THREE.Fog('#526b70', 63, 126);
      const camera = new THREE.PerspectiveCamera(43, 1, .1, 180);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.65));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      const fixed = new THREE.Group();
      const moving = new THREE.Group();
      scene.add(fixed, moving);
      const unitBox = new THREE.BoxGeometry(1, 1, 1);
      const unitPlane = new THREE.PlaneGeometry(1, 1);
      const cylinders = new Map();
      const mats = new Map();
      const reserves = [];
      const railRoutes = [];
      const lamps = [];
      const pools = [];
      const regionLights = [];
      const signals = [];
      const controlParts = {};
      const pickables = [];
      const looseAnimations = [];
      const peopleWalking = [];
      const trainSets = [];
      const vehicles = [];
      const smoke = [];
      let elapsed = 0, machineTime = 0, roadDistance = 0, lastTime = 0, lastMinute = -1, toastUntil = 0, started = false;
      let turnAngle = Math.PI, turnTarget = Math.PI, turnIndex = 1, lastSmoke = 0, hoverControl = null;
      let audioContext = null, audioMaster = null, railAudio = null, nextClick = 0;
      const palette = {
        grass: '#849969', grassLight: '#a0af79', grassDark: '#6d875d', pine: '#3e795e', leaf: '#75a966',
        wood: '#9a653f', darkWood: '#593e2c', cream: '#eee2bd', creamLight: '#fff0d0', red: '#cf5b4b',
        teal: '#4d9899', navy: '#355761', yellow: '#eabb59', brass: '#c7a56a', iron: '#39484a',
        ballast: '#777c71', concrete: '#c2bea5', asphalt: '#687a78', water: '#298c94', white: '#e6e8d5'
      };
      let seed = 8741;
      function random() { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; }
      const clamp = THREE.MathUtils.clamp;
      const lerp = THREE.MathUtils.lerp;
      function material(color, extra = {}) {
        const key = color + JSON.stringify(extra);
        if (!mats.has(key)) mats.set(key, new THREE.MeshStandardMaterial({ color, roughness: .84, flatShading: true, ...extra }));
        return mats.get(key);
      }
      const glassMat = material('#759d9b', { emissive: '#ffc86d', emissiveIntensity: .03, roughness: .3, metalness: .08 });
      const bulbMat = material('#fce8ad', { emissive: '#ffcc79', emissiveIntensity: .18 });
      const redMat = material('#d45e4c', { emissive: '#ff3f20', emissiveIntensity: .4 });
      const greenMat = material('#82c7a2', { emissive: '#61e892', emissiveIntensity: .4 });
      const ironMat = material(palette.iron, { metalness: .4, roughness: .6 });
      const railMat = material('#bac0b3', { metalness: .72, roughness: .38 });
      function mesh(parent, geometry, mat, x, y, z, sx = 1, sy = 1, sz = 1, rotation = 0, shadow = true) {
        const object = new THREE.Mesh(geometry, typeof mat === 'string' ? material(mat) : mat);
        object.position.set(x, y, z); object.scale.set(sx, sy, sz);
        if (Array.isArray(rotation)) object.rotation.set(...rotation); else object.rotation.y = rotation;
        object.castShadow = shadow; object.receiveShadow = true; parent.add(object); return object;
      }
      function box(parent, x, y, z, w, h, d, mat, rotation = 0, shadow = true) { return mesh(parent, unitBox, mat, x, y, z, w, h, d, rotation, shadow); }
      function cylinder(parent, x, y, z, r, h, mat, sides = 12, rotation = 0, shadow = true) {
        if (!cylinders.has(sides)) cylinders.set(sides, new THREE.CylinderGeometry(1, 1, 1, sides));
        return mesh(parent, cylinders.get(sides), mat, x, y, z, r, h, r, rotation, shadow);
      }
      function group(parent, x = 0, y = 0, z = 0, rotation = 0) { const object = new THREE.Group(); object.position.set(x, y, z); object.rotation.y = rotation; parent.add(object); return object; }
      function beam(parent, a, b, width, depth, mat) {
        const delta = new THREE.Vector3().subVectors(b, a);
        const object = box(parent, (a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2, width, delta.length(), depth, mat);
        object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize()); return object;
      }
      function bake(root) {
        root.updateWorldMatrix(true, true);
        const inverse = root.matrixWorld.clone().invert();
        const buckets = new Map();
        root.traverse(object => {
          if (!object.isMesh) return;
          const key = `${object.geometry.uuid}/${object.material.uuid}/${object.castShadow}`;
          if (!buckets.has(key)) buckets.set(key, { geometry: object.geometry, mat: object.material, shadow: object.castShadow, matrices: [] });
          const transform = new THREE.Matrix4().multiplyMatrices(inverse, object.matrixWorld);
          if (object.isInstancedMesh) {
            const instance = new THREE.Matrix4();
            for (let i = 0; i < object.count; i++) { object.getMatrixAt(i, instance); buckets.get(key).matrices.push(transform.clone().multiply(instance)); }
          } else buckets.get(key).matrices.push(transform);
        });
        root.clear();
        for (const bucket of buckets.values()) {
          const object = new THREE.InstancedMesh(bucket.geometry, bucket.mat, bucket.matrices.length);
          bucket.matrices.forEach((matrix, i) => object.setMatrixAt(i, matrix));
          object.instanceMatrix.needsUpdate = true; object.castShadow = bucket.shadow; object.receiveShadow = true;
          object.computeBoundingSphere(); root.add(object);
        }
      }
      function canvasTexture(width, height, paint) {
        const surface = document.createElement('canvas'); surface.width = width; surface.height = height;
        const ctx = surface.getContext('2d'); paint(ctx, width, height);
        const texture = new THREE.CanvasTexture(surface); texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
        return { texture, canvas: surface, ctx };
      }
      function sign(parent, text, x, y, z, w, h, options = {}) {
        const { bg = '#254e54', fg = '#f3e5bf', font = '600 54px "Microsoft YaHei", sans-serif', flat = false, border = true } = options;
        const result = canvasTexture(512, Math.max(96, Math.round(512 * h / w)), (ctx, cw, ch) => {
          ctx.fillStyle = bg; ctx.fillRect(0, 0, cw, ch);
          if (border) { ctx.strokeStyle = fg; ctx.globalAlpha = .42; ctx.lineWidth = 2; ctx.strokeRect(9, 9, cw - 18, ch - 18); ctx.globalAlpha = 1; }
          ctx.fillStyle = fg; ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, cw / 2, ch / 2 + 2, cw - 36);
        });
        const mat = new THREE.MeshStandardMaterial({ map: result.texture, roughness: .86, emissive: '#ffffff', emissiveIntensity: .025 });
        const object = mesh(parent, unitPlane, mat, x, y, z, w, h, 1, flat ? [-Math.PI / 2, 0, 0] : 0, false);
        return { ...result, object, mat };
      }
      function reserve(x, z, w, d, margin = .1) { reserves.push({ x, z, w: w + margin * 2, d: d + margin * 2 }); }
      function line(x1, z1, x2, z2) {
        const length = Math.hypot(x2 - x1, z2 - z1);
        return { length, at(t) { return { p: new THREE.Vector3(lerp(x1, x2, t), 0, lerp(z1, z2, t)), t: new THREE.Vector3((x2 - x1) / length, 0, (z2 - z1) / length) }; } };
      }
      function arc(x, z, radius, from, to) {
