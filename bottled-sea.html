<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16292c">
  <title>瓶中沧海 · A sea, sealed</title>
  <style>
    :root{color-scheme:dark;--ink:#e8e5d5;--muted:#b0beb9;--brass:#d9b573;--line:rgba(225,226,201,.17)}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142326}
    body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);font-size:12px;-webkit-font-smoothing:antialiased}
    canvas#sea{display:block;width:100%;height:100%;outline:none;touch-action:none}
    button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
    button:focus-visible,canvas:focus-visible{outline:1px solid var(--brass);outline-offset:5px}
    button:disabled{cursor:default;opacity:.4}
    .interface{position:fixed;inset:0;pointer-events:none;transition:opacity .6s}
    .interface button,.interface input{pointer-events:auto}
    .masthead{position:absolute;left:clamp(24px,4vw,64px);top:clamp(25px,4.8vh,54px)}
    .eyebrow{margin:0 0 11px;color:var(--brass);font-size:9px;letter-spacing:.28em}
    h1{margin:0;font-family:"Songti SC","Noto Serif CJK SC","SimSun",serif;font-size:clamp(25px,2.45vw,36px);letter-spacing:.19em;font-weight:400;line-height:1.4;text-shadow:0 2px 20px #0c181c}
    .subtitle{font-family:Georgia,serif;letter-spacing:.17em;font-size:10px;margin:9px 0 0;color:#bfcbc4}
    .clock{position:absolute;right:clamp(24px,4vw,64px);top:clamp(26px,4.8vh,54px);display:flex;align-items:center;gap:13px}
    .clock-orbit{width:35px;height:35px;position:relative;border:1px solid var(--line);border-radius:50%}
    .clock-orbit:before,.clock-orbit:after{content:"";position:absolute;background:var(--brass);left:50%;top:50%;border-radius:50%}
    .clock-orbit:before{width:8px;height:8px;transform:translate(-50%,-50%);box-shadow:0 0 12px #e3b66465}
    .clock-orbit:after{width:3px;height:3px;transform:rotate(var(--day-angle,100deg)) translateY(-15px);transform-origin:0 0}
    .clock-copy{text-align:right;min-width:78px}
    #period{font-family:"Songti SC","SimSun",serif;font-size:15px;letter-spacing:.15em}
    #time{display:block;margin-top:5px;font-family:Georgia,serif;font-size:10px;font-variant-numeric:tabular-nums;letter-spacing:.16em;color:var(--muted)}
    .bottom{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:clamp(24px,4vw,64px);right:clamp(24px,4vw,64px);display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
    .caption{padding-bottom:5px;line-height:1.9;color:#a9bbb5;font-size:10px;letter-spacing:.07em;white-space:nowrap}
    .caption strong{display:block;font-family:"Songti SC","SimSun",serif;font-size:14px;font-weight:400;color:var(--ink);letter-spacing:.12em;margin-bottom:5px}
    .controls-wrap{position:absolute;bottom:0;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:15px}
    .controls{display:flex;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(120deg,rgba(21,42,44,.88),rgba(20,30,33,.86));backdrop-filter:blur(18px);box-shadow:0 8px 40px #0003;gap:3px;white-space:nowrap}
    .controls button{height:34px;min-width:35px;border-radius:3px;transition:color .2s,background .2s;letter-spacing:.025em}
    .controls button:hover{background:#d6dcc515}
    .controls button[aria-pressed="true"]{color:#e9c98a;background:#d4b4751b}
    .controls .weather{display:flex;align-items:center;gap:9px;padding:0 12px;color:#d4dbd1;min-width:126px}
    .weather svg{width:17px;height:17px}
    .weather kbd{font-size:9px;border:1px solid #ccd8bd36;padding:2px 5px;border-radius:3px;color:#adbcb3;font-family:inherit;letter-spacing:.03em}
    .weather[aria-pressed="true"] kbd{border-color:#dccfa06b;color:#edce8c}
    .divider{height:19px;width:1px;background:var(--line);margin:0 7px}
    .speed{font-family:Georgia,serif;font-size:12px}
    .pause svg{display:block;margin:auto;width:12px;height:12px}
    .timeline{width:228px;display:flex;align-items:center;justify-content:space-between;position:relative;height:20px}
    .timeline:before{content:"";height:1px;position:absolute;left:13px;right:13px;top:8px;background:var(--line)}
    .timeline button{position:relative;min-width:35px;color:#91aaa3;font-size:9px;padding:16px 0 0;letter-spacing:.1em;transition:color .2s}
    .timeline button:before{content:"";position:absolute;width:4px;height:4px;background:#7d9790;top:6px;left:calc(50% - 2px);border-radius:50%;box-shadow:0 0 0 4px #193031}
    .timeline button.active{color:#e8c382}
    .timeline button.active:before{background:#e8c382;box-shadow:0 0 7px #e8c38277}
    .utilities{display:flex;gap:8px;padding-bottom:3px}
    .utilities button{width:35px;height:35px;border:1px solid var(--line);border-radius:50%;color:#c1cdc4;display:grid;place-items:center;background:#12232935}
    .utilities button:hover{border-color:#d0b37988;color:#e8c382}
    .utilities svg{width:14px;height:14px}
    .storm-label{position:absolute;left:50%;top:39px;transform:translateX(-50%);color:#d8d5ba;letter-spacing:.23em;font-size:10px;opacity:0;transition:opacity 1s}
    body.storm .storm-label{opacity:1}
    .loading{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 42%,#213d3c,#112226 70%);transition:opacity 1.15s,visibility 1.15s}
    .loading.done{opacity:0;visibility:hidden;pointer-events:none}
    .loading-inner{text-align:center;max-width:360px;padding:25px}
    .bottle-mark{width:108px;height:42px;border:1px solid #c6d5b16b;border-radius:20px 12px 12px 20px;position:relative;margin:0 auto 27px;overflow:hidden}
    .bottle-mark:after{content:"";position:absolute;width:140px;height:60px;left:-17px;top:20px;background:#679c885c;border-radius:40%;animation:tide 3s ease-in-out infinite}
    .loading h2{font-family:"Songti SC","SimSun",serif;font-size:22px;font-weight:400;letter-spacing:.2em;margin:0 0 15px}
    .loading p{font-size:11px;line-height:1.9;color:#b1c2b6;letter-spacing:.08em;margin:0}
    .loading button{margin-top:20px;border-bottom:1px solid #ccb58188;color:#e2c994;padding:8px 0;display:none}
    .loading.failed .bottle-mark:after{animation:none}
    .loading.failed button{display:inline-block}
    @keyframes tide{50%{transform:rotate(10deg) translateY(-3px)}}
    @media(max-width:760px){
      .masthead{left:23px;top:25px}h1{font-size:25px}.eyebrow{font-size:8px;letter-spacing:.2em}.subtitle{font-size:8px}
      .clock{right:21px;top:28px;gap:8px}.clock-orbit{width:29px;height:29px}.clock-orbit:after{transform:rotate(var(--day-angle)) translateY(-12px)}
      .bottom{left:20px;right:20px;bottom:max(23px,env(safe-area-inset-bottom));height:110px}
      .caption{position:absolute;bottom:79px;font-size:9px}.caption strong{display:none}.utilities{position:absolute;bottom:75px;right:0}.utilities button{width:29px;height:29px}
      .controls-wrap{width:100%;gap:13px}.controls{padding:6px}.controls .weather{min-width:116px;padding:0 8px}.controls button{min-width:33px}
      .storm-label{top:110px;font-size:9px}
    }
    @media(prefers-reduced-motion:reduce){.bottle-mark:after{animation:none}.interface,.loading{transition:none}}
  </style>

    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<body>
  <canvas id="sea" tabindex="0" aria-label="瓶中沧海三维微缩场景，拖动环视，滚轮缩放，按住空格掀起风暴"></canvas>
  <div class="interface">
    <header class="masthead">
      <p class="eyebrow">THE MARINER’S CABINET</p>
      <h1>瓶中沧海</h1>
      <p class="subtitle">A SEA, SEALED.</p>
    </header>
    <div class="clock" aria-label="瓶内时间">
      <div class="clock-orbit" aria-hidden="true"></div>
      <div class="clock-copy"><span id="period">黄昏</span><span id="time">17 : 42</span></div>
    </div>
    <div class="storm-label" aria-live="polite">风起 · 海潮将至</div>
    <footer class="bottom">
      <div class="caption"><strong id="sea-state">一方海，一段远航。</strong>拖动环视 · 滚轮靠近</div>
      <div class="controls-wrap">
        <div class="timeline" aria-label="选择时刻">
          <button data-hour="6" title="前往黎明">黎明</button>
          <button data-hour="12" title="前往正午">正午</button>
          <button data-hour="18" class="active" title="前往黄昏">黄昏</button>
          <button data-hour="0" title="前往子夜">子夜</button>
        </div>
        <div class="controls" role="group" aria-label="海洋与时间控制">
          <button class="weather" id="storm" aria-label="按住掀起风暴，松开恢复平静" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 13a4 4 0 0 1 .8-7.9A5.3 5.3 0 0 1 15 4.5 4.3 4.3 0 0 1 20 12"/><path d="m12 10-4 6h5l-3 6 7-9h-5l2-3"/></svg>
            <span>呼风唤雨</span><kbd>Space</kbd>
          </button>
          <span class="divider" aria-hidden="true"></span>
          <button class="speed" data-speed="1" aria-pressed="true" title="正常时间">×1</button>
          <button class="speed" data-speed="4" aria-pressed="false" title="四倍延时摄影">×4</button>
          <button class="speed" data-speed="12" aria-pressed="false" title="十二倍延时摄影">×12</button>
          <span class="divider" aria-hidden="true"></span>
          <button class="pause" id="pause" title="暂停" aria-label="暂停时间" aria-pressed="false"><svg id="pause-icon" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M2 1h2v10H2zm6 0h2v10H8z"/></svg></button>
        </div>
      </div>
      <div class="utilities">
        <button id="reset" title="回到初始视角" aria-label="回到初始视角"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M4 7a7 7 0 1 1-.5 5M4 2v5h5"/></svg></button>
        <button id="fullscreen" title="全屏" aria-label="切换全屏"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M3 7V3h4m6 0h4v4M3 13v4h4m6 0h4v-4"/></svg></button>
      </div>
    </footer>
  </div>
  <div class="loading" id="loading" role="status">
    <div class="loading-inner"><div class="bottle-mark" aria-hidden="true"></div><h2 id="loading-title">正在装下一片海</h2><p id="loading-copy">展开海图，等待第一缕海风。</p><button onclick="location.reload()">重新打开</button></div>
  </div>
  <script>
    window.showSeaError=function(message){
      const panel=document.getElementById('loading');
      panel.classList.remove('done');panel.classList.add('failed');
      document.getElementById('loading-title').textContent='海尚未启航';
      document.getElementById('loading-copy').textContent=message;
    };
    window.addEventListener('error',function(event){
      if(!window.seaReady) window.showSeaError('加载未能完成。请检查网络，并使用启用硬件加速的 Chrome 重新打开。');
    });
  </script>
  <script type="module">
  async function createSea(){
    const [
      THREE,{OrbitControls},{EffectComposer},{RenderPass},{UnrealBloomPass},
      {OutputPass},{ShaderPass},{Pass,FullScreenQuad},{mergeGeometries}
    ]=await Promise.all([
      import('three'),import('three/addons/controls/OrbitControls.js'),
      import('three/addons/postprocessing/EffectComposer.js'),import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'),import('three/addons/postprocessing/OutputPass.js'),
      import('three/addons/postprocessing/ShaderPass.js'),import('three/addons/postprocessing/Pass.js'),
      import('three/addons/utils/BufferGeometryUtils.js')
    ]);

    const TAU=Math.PI*2, CY=3.54, WATER=-.53, INNER=.065;
    const clamp=THREE.MathUtils.clamp, lerp=THREE.MathUtils.lerp;
    const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
    let seed=81273;
    const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
    const between=(a,b)=>a+(b-a)*random();
    const choose=a=>a[Math.floor(random()*a.length)];
    const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
    const color=c=>new THREE.Color(c);
    const dummy=new THREE.Object3D(),scratch=new THREE.Vector3(),up=V(0,1,0);
    const state={time:0,hour:17.7,speed:1,paused:false,storm:0,stormHeld:false,flash:0,nextFlash:2,
      night:0,daylight:1,lastInteraction:performance.now(),dragging:false,ratio:1.5,frameEMA:16.7,
      resizePending:false,qualityClock:0,whalePhase:-1,hidden:false};
    const U={
      time:{value:0},storm:{value:0},night:{value:0},flash:{value:0},
      inverseBottle:{value:new THREE.Matrix4()},water:{value:WATER+CY},
      ripple:{value:new THREE.Vector4(-3.8,-.35,-100,0)},
      sunColor:{value:color('#ffc47a')},islandCenter:{value:new THREE.Vector2(.85,-.15)},
      skyTop:{value:color('#527e95')},skyBottom:{value:color('#e9b17a')},
      ship:{value:new THREE.Vector4(0,0,0,0)},beacon:{value:new THREE.Vector4(1.1,CY+1.38,-.28,0)}
    };
    const canvas=document.getElementById('sea');
    const context=canvas.getContext('webgl2',{alpha:false,antialias:true,powerPreference:'high-performance'});
    if(!context) throw new Error('WebGL2 is unavailable');
    const renderer=new THREE.WebGLRenderer({canvas,context,antialias:true,alpha:false,powerPreference:'high-performance'});
    renderer.setSize(innerWidth,innerHeight);
    state.ratio=Math.min(devicePixelRatio,1.65);
    renderer.setPixelRatio(state.ratio);
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.06;
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    renderer.info.autoReset=false;
    const scene=new THREE.Scene();
    scene.background=color('#192c30');
    scene.fog=new THREE.FogExp2('#192c30',.024);
    const camera=new THREE.PerspectiveCamera(33,innerWidth/innerHeight,.12,110);
    const controls=new OrbitControls(camera,canvas);
    controls.target.set(-.12,3.00,0);
    controls.enableDamping=true;controls.dampingFactor=.055;controls.enablePan=false;
    controls.minPolarAngle=.30;controls.maxPolarAngle=1.48;
    controls.rotateSpeed=.47;controls.zoomSpeed=.65;controls.autoRotateSpeed=.30;
    controls.minDistance=10.1;controls.maxDistance=38;
    const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
    function resetCamera(){
      const distance=Math.max(18.9,8.45/(Math.tan(camera.fov*Math.PI/360)*camera.aspect));
      camera.position.copy(controls.target).add(V(.37,.30,.880).normalize().multiplyScalar(distance));
      controls.maxDistance=Math.max(38,distance*1.7);
      controls.update();
    }
    resetCamera();
    const inner=new THREE.Group();inner.position.y=CY;scene.add(inner);
    const bottleRig=new THREE.Group();bottleRig.position.y=CY;scene.add(bottleRig);
    const rigidInterior=new THREE.Group();bottleRig.add(rigidInterior);
    const glassScene=new THREE.Scene(),glassRig=new THREE.Group();glassScene.add(glassRig);
    const animatedFlags=[],palms=[],clouds=[],birds=[],buoys=[],boats=[],warmLights=[],warmMaterials=[];

    // The shell profile is shared by geometry, volume integration and fragment clipping.
    function radiusAt(x){
      if(x< -6.10||x>6.50)return 0;
      if(x< -4.70)return 2.64*Math.sqrt(Math.max(0,1-((x+4.70)/1.40)**2));
      return lerp(2.64,.79,smooth(2.70,5.10,x));
    }
    function bottomAt(x,z){return -Math.sqrt(Math.max(0,(radiusAt(x)-INNER)**2-z*z));}
    function isInside(x,y,z,margin=.08){const r=radiusAt(x)-margin;return x> -6.10+margin&&x<6.17&&r>0&&y*y+z*z<r*r;}
    const clipGLSL=`
      uniform mat4 uBottleInverse;
      varying vec3 vCabinetWorld;
      float bottleRadius(float x){
        if(x < -6.10 || x > 6.50) return 0.0;
        if(x < -4.70) return 2.64*sqrt(max(0.0,1.0-pow((x+4.70)/1.40,2.0)));
        return mix(2.64,0.79,smoothstep(2.70,5.10,x));
      }
      float bottleDistance(vec3 worldPosition){
        vec3 p=(uBottleInverse*vec4(worldPosition,1.0)).xyz;
        return max(max(-6.085-p.x,p.x-6.175),length(p.yz)-bottleRadius(p.x)+0.065);
      }
    `;
    const worldVertex=`
      vec4 cabinetPosition=vec4(transformed,1.0);
      #ifdef USE_INSTANCING
        cabinetPosition=instanceMatrix*cabinetPosition;
      #endif
      vCabinetWorld=(modelMatrix*cabinetPosition).xyz;
    `;
    function containMaterial(material,{underwater=true,vertex='',fragment='',uniforms={}}={}){
      material.onBeforeCompile=shader=>{
        Object.assign(shader.uniforms,{uBottleInverse:U.inverseBottle,uOceanTime:U.time,uOceanStorm:U.storm,
          uOceanNight:U.night,uWaterLevel:U.water,uLightning:U.flash},uniforms);
        shader.vertexShader='varying vec3 vCabinetWorld;\nuniform float uOceanTime;\nuniform float uOceanStorm;\n'+vertex+'\n'+shader.vertexShader;
        shader.vertexShader=shader.vertexShader.replace('#include <worldpos_vertex>','#include <worldpos_vertex>\n'+worldVertex);
        shader.fragmentShader=clipGLSL+'\nuniform float uOceanTime;\nuniform float uOceanStorm;\nuniform float uOceanNight;\nuniform float uWaterLevel;\nuniform float uLightning;\n'+fragment+'\n'+shader.fragmentShader;
        shader.fragmentShader=shader.fragmentShader.replace('#include <clipping_planes_fragment>',
          '#include <clipping_planes_fragment>\nif(bottleDistance(vCabinetWorld)>0.0)discard;');
        if(underwater) shader.fragmentShader=shader.fragmentShader.replace('#include <opaque_fragment>',`
          float wetDepth=max(0.0,uWaterLevel-vCabinetWorld.y);
          float wetFactor=1.0-exp(-wetDepth*0.15);
          float caustic=pow(max(0.0,sin(vCabinetWorld.x*13.0+sin(vCabinetWorld.z*9.0+uOceanTime))*
            sin(vCabinetWorld.z*15.0-sin(vCabinetWorld.x*7.0-uOceanTime*0.8))),7.0);
          outgoingLight=mix(outgoingLight,outgoingLight*vec3(0.42,0.86,0.92)+vec3(0.01,0.055,0.065),wetFactor);
          outgoingLight+=vec3(0.06,0.22,0.17)*caustic*step(0.025,wetDepth)*(1.0-uOceanNight*0.65);
          outgoingLight+=diffuseColor.rgb*uLightning*0.65;
          #include <opaque_fragment>
        `);
        material.userData.shader=shader;
        if(material.userData.extend)material.userData.extend(shader);
      };
      material.customProgramCacheKey=()=> 'contained-'+(underwater?'wet':'dry')+'-'+vertex+'-'+fragment+(material.userData.key||'');
      return material;
    }
    function standard(c,roughness=.75,metalness=0,inside=false){
      const material=new THREE.MeshStandardMaterial({color:c,roughness,metalness});
      return inside?containMaterial(material):material;
    }
    const MAT={
      voxel:containMaterial(new THREE.MeshStandardMaterial({color:0xffffff,roughness:.82,vertexColors:true})),
      wood:standard('#725039',.63),darkWood:standard('#322723',.7),brass:standard('#c9974e',.29,.78),
      patina:standard('#6e8d78',.58,.58),paper:standard('#cebd93',.95),cork:standard('#ad8355',.95),
      wax:standard('#812a29',.31),rope:standard('#b99d6c',.95),
      innerWood:standard('#8c603b',.78,0,true),innerBrass:standard('#cea464',.33,.7,true),
      iron:standard('#273e43',.73,.52,true),innerRope:standard('#55493a',.98,0,true),
      glassTrim:new THREE.MeshPhysicalMaterial({color:'#a6d2bd',roughness:.1,metalness:.15,transparent:true,opacity:.40,depthWrite:false}),
      foliage:containMaterial(new THREE.MeshStandardMaterial({color:0xffffff,roughness:.86,vertexColors:true})),
      cloud:containMaterial(new THREE.MeshStandardMaterial({color:'#fff5e0',roughness:1,vertexColors:true}),{underwater:false}),
      warm:containMaterial(new THREE.MeshStandardMaterial({color:'#ffdb8c',emissive:'#ffab39',emissiveIntensity:1.9,roughness:.35})),
      white:standard('#f6e8c4',.82,0,true)
    };
    warmMaterials.push(MAT.warm);
    const cubeGeometry=new THREE.BoxGeometry(1,1,1);
    const voxelGeometry=cubeGeometry.clone();
    const voxelColors=[];
    for(let i=0;i<voxelGeometry.attributes.position.count;i++){
      const ny=voxelGeometry.attributes.normal.getY(i),nz=voxelGeometry.attributes.normal.getZ(i);
      const light=ny>.5?1:ny<-.5?.69:nz>.5?.89:.81;
      voxelColors.push(light,light,light);
    }
    voxelGeometry.setAttribute('color',new THREE.Float32BufferAttribute(voxelColors,3));
    const cylinderGeometry=new THREE.CylinderGeometry(1,1,1,7,1);
    function mesh(geometry,material,parent,x=0,y=0,z=0){
      const m=new THREE.Mesh(geometry,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
    }
    function box(parent,material,x,y,z,sx,sy,sz){
      const m=mesh(cubeGeometry,material,parent,x,y,z);m.scale.set(sx,sy,sz);return m;
    }
    function cylinder(parent,material,x,y,z,rt,rb,h,segments=24){
      return mesh(new THREE.CylinderGeometry(rt,rb,h,segments,1),material,parent,x,y,z);
    }

          float grain=fract(sin(dot(gl_FragCoord.xy+floor(uTime*14.0),vec2(12.9898,78.233)))*43758.5453);
          c+=(grain-.5)*.0014;
          gl_FragColor=vec4(max(c,vec3(0.0)),1.0);
        }
      `
    });
    composer.addPass(finish);composer.addPass(new OutputPass());composer.setSize(innerWidth,innerHeight);
    glassRig.matrixAutoUpdate=false;
    const palettes=[
      {hour:0,top:color('#092238'),bottom:color('#265263'),sun:color('#b0c9d7')},
      {hour:6,top:color('#91b8bd'),bottom:color('#efba8c'),sun:color('#ffd19a')},
      {hour:12,top:color('#71acbd'),bottom:color('#c7dac9'),sun:color('#fff0c7')},
      {hour:18,top:color('#6d939c'),bottom:color('#dfa06f'),sun:color('#ffca8e')},
      {hour:24,top:color('#092238'),bottom:color('#265263'),sun:color('#b0c9d7')}
    ];
    const nightRoom=color('#162b33'),dayRoom=color('#2a3b38');
    const clearCloud=color('#fff4dc'),nightCloud=color('#698797'),stormCloud=color('#455661');
    const moonlightTint=color('#9ebdca'),dayHemisphere=color('#c9e4db'),nightHemisphere=color('#7cabc5');
    let sprayAccumulator=0,wakeAccumulator=0,stormSprayAccumulator=0;
    let previousNow=performance.now(),lastUIUpdate=-1000,contextLost=false;
    function updateBuoyancy(dt){
      shipPhysics.angle+=dt*(.047+state.storm*.012);
      const a=shipPhysics.angle,rx=3.30,rz=1.53-state.storm*.13;
      const x=-.60+Math.cos(a)*rx,z=Math.sin(a)*rz;
      const dx=-rx*Math.sin(a),dz=rz*Math.cos(a),yaw=Math.atan2(-dz,dx),c=Math.cos(yaw),s=Math.sin(yaw);
      const bowPort=waveAt(x+.86*c-.265*s,z-.86*s-.265*c);
      const bowStarboard=waveAt(x+.86*c+.265*s,z-.86*s+.265*c);
      const sternPort=waveAt(x-.86*c-.265*s,z+.86*s-.265*c);
      const sternStarboard=waveAt(x-.86*c+.265*s,z+.86*s+.265*c);
      const targetHeight=(bowPort+bowStarboard+sternPort+sternStarboard)*.25;
      const targetPitch=clamp(Math.atan2((bowPort+bowStarboard-sternPort-sternStarboard)*.5,1.72)*.86,-.14,.14);
      const targetRoll=clamp(-Math.atan2((bowStarboard+sternStarboard-bowPort-sternPort)*.5,.53)*.70,-.10,.10);
      shipPhysics.vy+=((targetHeight-shipPhysics.height)*34-shipPhysics.vy*7.0)*dt;
      shipPhysics.vp+=((targetPitch-shipPhysics.pitch)*26-shipPhysics.vp*6.8)*dt;
      shipPhysics.vr+=((targetRoll-shipPhysics.roll)*29-shipPhysics.vr*7.1)*dt;
      shipPhysics.height+=shipPhysics.vy*dt;shipPhysics.pitch+=shipPhysics.vp*dt;shipPhysics.roll+=shipPhysics.vr*dt;
      shipPhysics.yaw=yaw;shipCarrier.position.set(x,WATER+shipPhysics.height,z);shipCarrier.rotation.y=yaw;
      shipMotion.rotation.set(shipPhysics.roll,0,shipPhysics.pitch,'ZXY');
      U.ship.value.set(x,z,yaw,0);
    }
    function updateLighting(){
      const hour=state.hour,index=Math.min(3,Math.floor(hour/6)),p=palettes[index],q=palettes[index+1],f=smooth(0,1,(hour-p.hour)/6);
      U.skyTop.value.copy(p.top).lerp(q.top,f);U.skyBottom.value.copy(p.bottom).lerp(q.bottom,f);
      U.sunColor.value.copy(p.sun).lerp(q.sun,f);
      const angle=(hour-6)/24*TAU,sunElevation=Math.sin(angle);
      state.night=1-smooth(-.30,.06,sunElevation);state.daylight=1-state.night;
      U.night.value=state.night;
      keyLight.color.copy(U.sunColor.value).lerp(moonlightTint,state.night*.75);
      keyLight.intensity=(3.45+Math.max(0,sunElevation)*.6)*(1-state.night*.76)*(1-state.storm*.72);
      keyLight.position.set(Math.cos(angle)*7.0,8.0+Math.abs(sunElevation)*4.0,5.4);
      hemisphere.intensity=lerp(2.05,.73,state.night)*(1-state.storm*.38);
      hemisphere.color.copy(dayHemisphere).lerp(nightHemisphere,state.night);
      fillLight.intensity=lerp(1.20,1.13,state.night)*(1-state.storm*.35);
      roomLight.intensity=lerp(26,31,state.night);
      scene.background.copy(dayRoom).lerp(nightRoom,state.night*.85+state.storm*.1);
      scene.fog.color.copy(scene.background);
      MAT.cloud.color.copy(clearCloud).lerp(nightCloud,state.night*.72).lerp(stormCloud,state.storm*.88);
      MAT.cloud.emissive.setRGB(.07*state.flash,.09*state.flash,.115*state.flash);
      for(const entry of warmLights)entry.light.intensity=lerp(entry.day,entry.night,state.night);
      for(const material of warmMaterials)material.emissiveIntensity=lerp(material.userData.dayGlow??1.55,material.userData.nightGlow??3.9,state.night);
      cottageGlow.material.opacity=lerp(.10,.46,state.night);
      shipGlow.material.opacity=lerp(.12,.44,state.night);
      treasureGlows.forEach(g=>g.material.opacity=lerp(.33,.62,state.night));
      bloom.strength=.245+state.night*.105+state.storm*.045;
      renderer.toneMappingExposure=lerp(1.07,1.13,state.night)*(1-state.storm*.08);
      sunGroup.position.set(-.6+Math.cos(angle)*3.2,WATER+.35+Math.sin(angle)*1.65,-1.00);
      moonGroup.position.set(-.6+Math.cos(angle+Math.PI)*3.2,WATER+.35+Math.sin(angle+Math.PI)*1.65,-.96);
      sunGroup.quaternion.copy(camera.quaternion);moonGroup.quaternion.copy(camera.quaternion);
      sunMaterial.opacity=smooth(WATER+.10,WATER+.38,sunGroup.position.y)*(1-state.storm*.70);
      moonMaterial.opacity=smooth(WATER+.10,WATER+.38,moonGroup.position.y)*(1-state.storm*.66);
      sunGroup.visible=sunGroup.position.y>WATER+.10;
      moonGroup.visible=moonGroup.position.y>WATER+.10;
      sunHalo.material.opacity=sunMaterial.opacity*.40;
      moonHalo.material.opacity=moonMaterial.opacity*.22;
      stars.visible=state.night>.015;
    }
    function splashAt(x,z,strength=1,count=45){
      for(let i=0;i<count;i++){
        const a=i/count*TAU+between(-.1,.1),speed=between(.13,.51)*strength;
        spray.emit(x+Math.cos(a)*.13,WATER+waveAt(x,z)+.035,z+Math.sin(a)*.13,
          Math.cos(a)*speed,between(.36,.98)*strength,Math.sin(a)*speed,between(.024,.054),between(.65,1.25));
      }
      U.ripple.value.set(x,z,state.time,strength);
    }
    function updateLife(dt){
      const t=state.time,storm=state.storm;
      beamGroup.rotation.y=t*.43;
      U.beacon.value.w=beamGroup.rotation.y;
      for(const p of palms){
        p.crown.rotation.x=Math.sin(t*1.35+p.phase)*(.024+.10*storm);
        p.crown.rotation.z=Math.cos(t*1.16+p.phase)*(.025+.09*storm)+storm*.075;
        p.root.rotation.z=Math.sin(t*.89+p.phase)*storm*.028;
      }
      for(const cloud of clouds){
        cloud.group.position.set(cloud.x+Math.sin(t*.075+cloud.phase)*.12,cloud.y+Math.sin(t*.14+cloud.phase)*.006,cloud.z+Math.cos(t*.084+cloud.phase)*.031);
        cloud.group.visible=!cloud.stormOnly||storm>.025;
        if(cloud.stormOnly){
          cloud.material.opacity=smooth(.025,.58,storm)*.96;
          cloud.material.color.copy(MAT.cloud.color);cloud.material.emissive.copy(MAT.cloud.emissive);
        }
      }
      for(const b of birds){
        const a=t*.175+b.phase,rx=b.radius,rz=.86;
        b.group.position.set(-.80+Math.cos(a)*rx,b.height+Math.sin(a*2.0+b.phase)*.023,Math.sin(a)*rz);
        b.group.rotation.set(Math.sin(a)*.09,Math.atan2(-Math.cos(a)*rz,-Math.sin(a)*rx),Math.sin(a*2)*.035,'YXZ');
        for(const wing of b.wings)wing.group.rotation.x=wing.side*(.16+Math.sin(t*5.2+b.phase)*(.29+storm*.08));
      }
      for(let i=0;i<fishCount;i++){
        const data=fishData[i],a=t*.18+data.group*TAU/3;
        const cx=-.6+Math.cos(a)*3.38,cz=Math.sin(a)*1.33;
        const x=cx+data.offset.x+Math.sin(t*1.5+data.phase)*.035,z=cz+data.offset.z;
        const y=-1.31+Math.sin(a*1.7+data.group)*.18+data.offset.y+Math.sin(t*2+data.phase)*.023;
        dummy.position.set(x,y,z);
        dummy.rotation.set(0,Math.atan2(-Math.cos(a)*1.33,-Math.sin(a)*3.38)+Math.sin(t*5.1+data.phase)*.07,Math.cos(t*1.8+data.phase)*.035);
        dummy.scale.setScalar(data.size);dummy.updateMatrix();fish.setMatrixAt(i,dummy.matrix);
      }
      fish.instanceMatrix.needsUpdate=true;
      for(const b of buoys){
        b.group.position.y=WATER+waveAt(b.x,b.z)+.012;
        b.group.rotation.x=-(waveAt(b.x,b.z+.08)-waveAt(b.x,b.z-.08))*.9;
        b.group.rotation.z=(waveAt(b.x+.08,b.z)-waveAt(b.x-.08,b.z))*.9;
      }
      for(const b of boats){
        b.group.position.y=WATER+waveAt(b.x,b.z)+.012;
        b.group.rotation.set(Math.sin(t*1.3+b.phase)*.025*(1+storm),b.yaw+Math.sin(t*.38)*.018,
          (waveAt(b.x+.18,b.z)-waveAt(b.x-.18,b.z))*.75);
      }
      for(const crab of crabs){
        crab.group.position.x=crab.x+Math.sin(t*.34+crab.phase)*.018;
        crab.group.position.z=crab.z+Math.cos(t*.40+crab.phase)*.012;
        crab.group.position.y=crab.y+Math.abs(Math.sin(t*5+crab.phase))*.003;
      }
      for(const flag of animatedFlags){
        const p=flag.mesh.geometry.attributes.position;
        for(let i=0;i<p.count;i++){
          const x=flag.base[i*3],y=flag.base[i*3+1],free=clamp(-x/flag.width,0,1);
          p.setZ(i,Math.sin(t*4.1+x*18+flag.phase)*(.019+storm*.035)*free);
          p.setY(i,y+Math.sin(t*3.2+x*14+flag.phase)*.008*free);
        }
        p.needsUpdate=true;flag.mesh.geometry.computeVertexNormals();
      }
      const cycle=(t+24)%32,duration=5.7;
      if(cycle<duration){
        const p=cycle/duration;
        whale.position.set(-3.83+(p-.5)*.94,WATER-.56+Math.sin(p*Math.PI)*1.45,-.36);
        whale.rotation.set(Math.sin(p*Math.PI)*.13,-.11,.90-1.8*p);
        if(state.whalePhase<.14&&p>=.14&&dt>0)splashAt(whale.position.x-.15,whale.position.z,.54,22);
        if(state.whalePhase<.88&&p>=.88&&dt>0)splashAt(whale.position.x+.24,whale.position.z,1.10,62);
        state.whalePhase=p;
      }else{
        whale.position.set(-3.83+Math.sin(t*.27)*.17,-1.12+Math.sin(t*.9)*.055,-.38+Math.sin(t*.23)*.10);
        whale.rotation.set(.025*Math.sin(t),-.10+Math.sin(t*.3)*.08,.028*Math.sin(t*1.2));
        state.whalePhase=-1;
      }
      whaleTail.rotation.z=Math.sin(t*3.2)*.15;
      if(dt>0){
        const yaw=shipPhysics.yaw,fx=Math.cos(yaw),fz=-Math.sin(yaw),sx=-fz,sz=fx;
        const x=shipCarrier.position.x,z=shipCarrier.position.z;
        sprayAccumulator+=dt*(15+storm*74);wakeAccumulator+=dt*(28+storm*28);stormSprayAccumulator+=dt*storm*100;
        while(sprayAccumulator>=1){
          sprayAccumulator--;
          const side=random()>.5?1:-1,bx=x+fx*1.08+sx*.075*side,bz=z+fz*1.08+sz*.075*side;
          spray.emit(bx,WATER+waveAt(bx,bz)+.02,bz,fx*.15+sx*side*between(.07,.23),between(.20,.42)+storm*.50,
            fz*.15+sz*side*between(.07,.23),between(.018,.035)+storm*.008,between(.50,.92));
        }
        while(wakeAccumulator>=1){
          wakeAccumulator--;
          const side=between(-.23,.23),bx=x-fx*1.055+sx*side,bz=z-fz*1.055+sz*side;
          spray.emit(bx,WATER+.03,bz,-fx*.06+sx*side*.28,0,-fz*.06+sz*side*.28,between(.030,.068),between(1.4,2.7),true);
        }
        while(stormSprayAccumulator>=1){
          stormSprayAccumulator--;
          const x=between(-4.8,3.7),z=between(-2.1,2.1),h=waveAt(x,z);
          if(h<.028||Math.hypot((x-U.islandCenter.value.x)/.93,(z-U.islandCenter.value.y)/.76)<1)continue;
          spray.emit(x,WATER+h+.025,z,between(.11,.40),between(.24,.72),between(-.14,.16),between(.022,.043),between(.44,.88));
        }
      }
      spray.update(dt);
      rain.visible=storm>.025;
    }
    function updateBottle(){
      const t=state.time,s=state.storm;
      const pitch=Math.sin(t*3.15)*.017*s;
      bottleRig.rotation.set((Math.sin(t*2.75)*.048+Math.sin(t*4.31)*.019)*s,Math.sin(t*1.8)*.002*s,pitch);
      // The lift follows the lower cradle contact; the liquid keeps its own gravity frame.
      bottleRig.position.set(0,CY+Math.abs(Math.sin(pitch))*3.95+.003*s,0);
      tagGroup.rotation.z=-.14+Math.sin(t*2.75+.6)*s*.065;
      bottleRig.updateMatrixWorld(true);
      U.inverseBottle.value.copy(bottleRig.matrixWorld).invert();
      glassRig.matrix.copy(bottleRig.matrixWorld);glassRig.matrixWorldNeedsUpdate=true;
      island.getWorldPosition(scratch);U.islandCenter.value.set(scratch.x,scratch.z);
      beaconLight.getWorldPosition(scratch);U.beacon.value.x=scratch.x;U.beacon.value.y=scratch.y;U.beacon.value.z=scratch.z;
    }
    function updateWeather(){
      if(!state.paused&&state.storm>.43&&state.time>state.nextFlash){
        strikeLightning();state.nextFlash=state.time+between(1.7,4.6);
      }
      const age=state.time-(state.flashStart??-100);
      state.flash=age<.48?clamp(Math.exp(-age*19)+.70*Math.exp(-Math.pow((age-.18)/.032,2)),0,1)*state.storm:0;
      U.flash.value=state.flash;flashLight.intensity=state.flash*27;
      lightning.visible=state.flash>.008;
    }
    function updateInterface(now){
      if(now-lastUIUpdate<180)return;lastUIUpdate=now;
      const h=state.hour,hours=Math.floor(h),minutes=Math.floor((h-hours)*60);
      document.getElementById('time').textContent=String(hours).padStart(2,'0')+' : '+String(minutes).padStart(2,'0');
      const phase=Math.floor(((h+3)%24)/6),periods=['子夜','黎明','正午','黄昏'];
      document.getElementById('period').textContent=periods[phase];
      document.querySelector('.clock-orbit').style.setProperty('--day-angle',(h/24*360)+'deg');
      document.querySelectorAll('.timeline button').forEach(button=>button.classList.toggle('active',Number(button.dataset.hour)===phase*6));
      document.getElementById('sea-state').textContent=state.storm>.3?'风过桅梢，潮生瓶中。':state.night>.65?'灯火为远航留一扇窗。':'一方海，一段远航。';
      document.body.classList.toggle('storm',state.stormHeld||state.storm>.35);
    }
    function resizeRenderer(changeCamera=false){
      camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
      renderer.setPixelRatio(state.ratio);renderer.setSize(innerWidth,innerHeight);
      composer.setPixelRatio(state.ratio);composer.setSize(innerWidth,innerHeight);
      glassUniforms.uResolution.value.set(canvas.width,canvas.height);pointScale.value=canvas.height;
      if(changeCamera)resetCamera();
    }
    const stormButton=document.getElementById('storm'),stormSources=new Set();
    const interact=()=>{state.lastInteraction=performance.now();};
    function setStormSource(source,pressed){
      pressed?stormSources.add(source):stormSources.delete(source);
      state.stormHeld=stormSources.size>0;stormButton.setAttribute('aria-pressed',String(state.stormHeld));interact();
    }
    function releaseStorm(){
      stormSources.clear();state.stormHeld=false;stormButton.setAttribute('aria-pressed','false');interact();
    }
    stormButton.addEventListener('pointerdown',event=>{
      event.preventDefault();stormButton.setPointerCapture(event.pointerId);setStormSource('pointer',true);
    });
    for(const type of['pointerup','pointercancel','lostpointercapture'])stormButton.addEventListener(type,()=>setStormSource('pointer',false));
    window.addEventListener('keydown',event=>{
      if(event.code==='Space'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
        event.preventDefault();if(!event.repeat)setStormSource('keyboard',true);
      }
    });
    window.addEventListener('keyup',event=>{if(event.code==='Space'){event.preventDefault();setStormSource('keyboard',false);}});
    window.addEventListener('blur',releaseStorm);
    function updatePauseButton(){
      const pause=document.getElementById('pause');
      pause.setAttribute('aria-pressed',String(state.paused));pause.setAttribute('aria-label',state.paused?'继续时间':'暂停时间');pause.title=state.paused?'继续':'暂停';
      document.getElementById('pause-icon').innerHTML=state.paused?'<path d="M3 1.2 11 6 3 10.8z"/>':'<path d="M2 1h2v10H2zm6 0h2v10H8z"/>';
    }
    document.getElementById('pause').addEventListener('click',()=>{state.paused=!state.paused;updatePauseButton();interact();});
    document.querySelectorAll('[data-speed]').forEach(button=>button.addEventListener('click',()=>{
      state.speed=Number(button.dataset.speed);state.paused=false;updatePauseButton();
      document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));interact();
    }));
    document.querySelectorAll('[data-hour]').forEach(button=>button.addEventListener('click',()=>{state.hour=Number(button.dataset.hour);lastUIUpdate=-1000;interact();}));
    document.getElementById('reset').addEventListener('click',()=>{resetCamera();interact();});
    document.getElementById('fullscreen').addEventListener('click',async()=>{
      try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}
      catch(error){console.warn('Fullscreen unavailable:',error.message);}
      interact();
    });
    document.addEventListener('fullscreenchange',()=>{
      const button=document.getElementById('fullscreen');button.title=document.fullscreenElement?'退出全屏':'全屏';
      button.setAttribute('aria-label',document.fullscreenElement?'退出全屏':'切换全屏');
    });
    controls.addEventListener('start',()=>{state.dragging=true;interact();});
    controls.addEventListener('end',()=>{state.dragging=false;interact();});
    window.addEventListener('resize',()=>{state.resizePending=true;});
    document.addEventListener('visibilitychange',()=>{state.hidden=document.hidden;previousNow=performance.now();if(state.hidden)releaseStorm();});
    canvas.addEventListener('webglcontextlost',event=>{
      event.preventDefault();contextLost=true;releaseStorm();
      window.showSeaError('图形上下文正在恢复，场景恢复后会自动重新装载。');
    });
    canvas.addEventListener('webglcontextrestored',()=>location.reload());
    resizeRenderer();
    updateBuoyancy(0);updateBottle();updateWeather();updateLighting();updateLife(0);updateInterface(performance.now());
    function animate(now){
      requestAnimationFrame(animate);
      if(contextLost||state.hidden){previousNow=now;return;}
      const elapsed=(now-previousNow)/1000;previousNow=now;
      const realDt=clamp(elapsed,0,.05);
      if(state.resizePending){state.resizePending=false;resizeRenderer(innerWidth<760);}
      if(elapsed>.001)state.frameEMA=lerp(state.frameEMA,Math.min(elapsed*1000,80),.018);
      const dt=state.paused?0:realDt*state.speed;
      if(dt>0){
        const steps=Math.ceil(dt/.021),h=dt/steps;
        for(let i=0;i<steps;i++){
          state.time+=h;state.hour=(state.hour+h*.10)%24;
          state.storm=lerp(state.storm,state.stormHeld?1:0,1-Math.exp(-h*(state.stormHeld?2.3:1.3)));
          updateBuoyancy(h);
        }
      }
      U.time.value=state.time;U.storm.value=state.storm;
      controls.autoRotate=!reducedMotion&&!state.paused&&!state.dragging&&!state.stormHeld&&now-state.lastInteraction>5500;
      controls.update(realDt);
      updateBottle();updateWeather();updateLighting();updateLife(dt);updateInterface(now);
      renderer.info.reset();composer.render(realDt);
      if(now-state.qualityClock>5000){
        state.qualityClock=now;
        const maximum=Math.min(devicePixelRatio,1.65);
        if(state.frameEMA>19.5&&state.ratio>Math.min(1,maximum)+.01){state.ratio=Math.max(Math.min(1,maximum),state.ratio-.12);resizeRenderer();}
        else if(state.frameEMA<17.2&&state.ratio<maximum-.05){state.ratio=Math.min(maximum,state.ratio+.07);resizeRenderer();}
      }
      if(!window.seaReady){window.seaReady=true;document.getElementById('loading').classList.add('done');}
    }
    requestAnimationFrame(animate);
  }
  createSea().catch(error=>{
    console.error(error);
    window.showSeaError(error.message==='WebGL2 is unavailable'
      ?'此作品需要 WebGL 2。请在 Chrome 中启用硬件加速后重新打开。'
      :'加载未能完成。请检查网络是否可访问 jsDelivr，然后重新打开。');
  });
  </script>
