<!DOCTYPE html>
<!--
DIRECTION CONTRACT
THESIS         把它当成一件被摄影的实物，而不是一个圆形的时钟组件。所有视觉预算花在
               「烟熏渐层表盘 + 立体时标 + 双色斜切指针」这三处真实制表语言上；
               拒绝深黑底 + 霓虹辉光 + 发光圆环的默认做法。
OWN-WORLD      午夜蓝 fumé 盘（中心亮、边缘沉，放射拉丝）+ 铑白立体时标 + 单一漆橙计时秒针；
               机身为抛光钢的冷灰阶。整页只有一个暖色，且只给计时秒针。
STORY          先认出这是一块表，再发现秒针是连续扫掠的，然后从三个子盘依次读出
               计时、月相、昼夜，最后在右侧面板拿到可复制的精确数值。
FIRST VIEWPORT 表居左偏中、占据主要面积并投下接触阴影；右侧是窄的读数与控制列；
               计时按钮做在表壳 2 点与 4 点位置，是真的可按的。
SIGNATURE      6 点位的月相盘：真实的双月旋转盘藏在弧形窗后，转角由 Meeus 相位角算出，
               不是贴一张月亮图。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>子午 ZIWU · 天文计时腕表</title>
<style>
/* ==========================================================================
   子午 ZIWU — 天文计时腕表
   原生实现：无库、无框架、无 CDN、无图片、无 SVG
   ========================================================================== */

:root{
  /* 环境 */
  --bg-0:#17171a;
  --bg-1:#1e1e22;
  --bg-2:#26262b;
  --bg-3:#31313a;
  --hair:rgba(233,232,228,.13);
  --hair-2:rgba(233,232,228,.26);

  --fg:#edeae4;
  --fg-2:#b4b2ab;
  --fg-3:#86847e;

  /* 表盘 fumé */
  --dial-c:#4d6f8d;
  --dial-m:#2b445b;
  --dial-e:#12243a;
  --dial-o:#08111d;
  --print:#f2f6fa;
  --print-2:#b7c8d8;

  /* 金属 */
  --steel-hi:#e6ebf0;
  --steel:#9ea8b3;
  --steel-lo:#5b636d;
  --steel-dk:#33383f;

  --lacquer:#ff7a2f;   /* 唯一暖色：计时秒针 / 运行态 */
  --lume:#c9e8d8;

  --r-sm:4px; --r-md:8px; --r-lg:14px;

  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",
         ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; overflow-x:clip; }
html{ color-scheme:dark; }

body{
  min-height:100dvh;
  font-family:var(--font);
  font-size:16px;
  line-height:1.6;
  color:var(--fg);
  background:
    radial-gradient(120% 80% at 30% 0%, #2a2a30 0%, transparent 58%),
    radial-gradient(90% 60% at 78% 100%, #212127 0%, transparent 60%),
    var(--bg-0);
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,p,figure,dl,dd,dt,ul{ margin:0; padding:0; }
ul{ list-style:none; }

:focus-visible{
  outline:2px solid var(--lacquer);
  outline-offset:3px;
  border-radius:3px;
}

.u-mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.u-sr{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0;
}

/* ==========================================================================
   页面骨架
   ========================================================================== */
.page{
  min-height:100dvh;
  display:grid;
  grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);
  gap:clamp(1.5rem,4vw,4rem);
  align-items:center;
  padding:clamp(1.25rem,4vw,3.5rem);
  max-width:1500px;
  margin-inline:auto;
}

.stage{
  display:grid;
  place-items:center;
  position:relative;
}
/* 接触阴影：让表像放在台面上 */
.stage::after{
  content:"";
  position:absolute;
  left:50%; translate:-50% 0;
  bottom:2%;
  width:62%; height:5%;
  border-radius:50%;
  background:radial-gradient(closest-side, rgba(0,0,0,.66), transparent 76%);
  filter:blur(10px);
  pointer-events:none;
}

/* ==========================================================================
   表壳
   ========================================================================== */
.watch{
  container-type:size;
  position:relative;
  width:min(88vw,540px);
  aspect-ratio:1;
}

/* 表耳 */
.lug{
  position:absolute;
  left:50%; translate:-50% 0;
  width:26cqw; height:15cqw;
  background:linear-gradient(96deg,var(--steel-dk),var(--steel-lo) 24%,var(--steel-hi) 46%,var(--steel) 62%,var(--steel-dk));
  z-index:0;
}
.lug--top{ top:-6cqw; clip-path:polygon(10% 100%,0% 22%,16% 0%,84% 0%,100% 22%,90% 100%); }
.lug--bot{ bottom:-6cqw; clip-path:polygon(10% 0%,0% 78%,16% 100%,84% 100%,100% 78%,90% 0%); }

/* 冠与按钮（做在壳侧，真的可按） */
.crown{
  position:absolute;
  right:-4.4cqw; top:50%; translate:0 -50%;
  width:5cqw; height:11cqw;
  border-radius:1cqw;
  background:
    repeating-linear-gradient(0deg, var(--steel-dk) 0 .5cqw, var(--steel-hi) .5cqw 1cqw),
    var(--steel);
  box-shadow:inset -.3cqw 0 .6cqw rgba(0,0,0,.5);
  z-index:0;
}
.pusher{
  position:absolute;
  right:-3.6cqw;
  width:4.2cqw; height:7.4cqw;
  padding:0;
  border:0;
  border-radius:.8cqw;
  cursor:pointer;
  background:linear-gradient(180deg,var(--steel-hi),var(--steel) 40%,var(--steel-lo));
  box-shadow:inset -.25cqw 0 .5cqw rgba(0,0,0,.45), 0 .2cqw .5cqw rgba(0,0,0,.4);
  transition:translate .09s var(--ease), filter .16s var(--ease);
  z-index:0;
}
.pusher::after{
  content:"";
  position:absolute; inset:1cqw .8cqw;
  border-radius:.4cqw;
  background:linear-gradient(180deg,rgba(255,255,255,.4),transparent);
}
.pusher--a{ top:22cqw; }
.pusher--b{ bottom:22cqw; }
.pusher:hover{ filter:brightness(1.12); }
.pusher:active{ translate:-1.1cqw 0; }
.pusher[aria-disabled="true"]{ filter:brightness(.62) saturate(.4); cursor:not-allowed; }
.pusher:focus-visible{ outline-offset:2px; }

/* 表圈 */
.bezel{
  position:absolute; inset:0;
  border-radius:50%;
  background:
    repeating-conic-gradient(from 0deg,
      rgba(255,255,255,.10) 0deg .6deg,
      rgba(0,0,0,.14) .6deg 1.4deg),
    conic-gradient(from 210deg,
      var(--steel-hi) 0deg, var(--steel) 42deg, var(--steel-dk) 96deg,
      var(--steel-lo) 150deg, var(--steel-hi) 196deg, var(--steel) 250deg,
      var(--steel-dk) 300deg, var(--steel-hi) 360deg);
  box-shadow:
    0 2cqw 4cqw rgba(0,0,0,.55),
    0 .4cqw 1.2cqw rgba(0,0,0,.5),
    inset 0 0 0 .5cqw rgba(255,255,255,.10);
  z-index:1;
}
/* 表圈内斜边 */
.bezel::after{
  content:"";
  position:absolute; inset:5.2cqw;
  border-radius:50%;
  background:conic-gradient(from 30deg,
    var(--steel-dk), var(--steel-lo) 30%, var(--steel-hi) 52%, var(--steel-lo) 74%, var(--steel-dk));
  box-shadow:inset 0 0 1cqw rgba(0,0,0,.6);
}

/* ==========================================================================
   表盘
   ========================================================================== */
.dial{
  position:absolute;
  inset:7.4cqw;
  border-radius:50%;
  overflow:hidden;
  z-index:2;
  background:
    /* 高光偏上，模拟斜射光 */
    radial-gradient(58% 42% at 46% 26%, rgba(255,255,255,.13), transparent 70%),
    /* 太阳放射拉丝 */
    repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(255,255,255,.055) 0deg .34deg,
      rgba(0,0,0,.055) .34deg .76deg),
    /* fumé：中心亮 → 边缘沉 */
    radial-gradient(circle at 50% 41%,
      var(--dial-c) 0%, var(--dial-m) 40%, var(--dial-e) 72%, var(--dial-o) 100%);
  box-shadow:inset 0 0 3cqw rgba(0,0,0,.55);
}

/* 分钟轨：60 格 + 5 分长格 */
.track{
  position:absolute; inset:0;
  background:repeating-conic-gradient(from 0deg,
    rgba(242,246,250,.66) 0deg .45deg, transparent .45deg 6deg);
  -webkit-mask:radial-gradient(circle, transparent 0 37.5%, #000 37.5% 41.5%, transparent 41.5%);
          mask:radial-gradient(circle, transparent 0 37.5%, #000 37.5% 41.5%, transparent 41.5%);
}
.track--5{
  background:repeating-conic-gradient(from 0deg,
    rgba(242,246,250,.92) 0deg .9deg, transparent .9deg 30deg);
  -webkit-mask:radial-gradient(circle, transparent 0 35.5%, #000 35.5% 41.5%, transparent 41.5%);
          mask:radial-gradient(circle, transparent 0 35.5%, #000 35.5% 41.5%, transparent 41.5%);
}

/* 立体时标：两半不同亮度 = 斜切面 */
.idx{
  position:absolute;
  left:50%; top:50%;
  width:2.2cqw; height:7cqw;
  translate:-50% -50%;
  transform-origin:50% 50%;
  border-radius:.3cqw;
  overflow:hidden;
  box-shadow:0 .2cqw .5cqw rgba(0,0,0,.5);
}
.idx::before,.idx::after{
  content:""; position:absolute; top:0; bottom:0; width:50%;
}
.idx::before{ left:0;  background:linear-gradient(180deg,var(--steel-hi),var(--steel)); }
.idx::after { right:0; background:linear-gradient(180deg,var(--steel-lo),var(--steel-dk)); }
/* 12 点双标 */
.idx--12{ width:5.4cqw; }
.idx--12::before{ width:44%; left:0; }
.idx--12::after { width:44%; right:0; }
.idx--12 i{
  position:absolute; left:44%; right:44%; top:0; bottom:0;
  background:var(--dial-e);
}

/* 印刷字 */
.print{
  position:absolute;
  left:50%; translate:-50% 0;
  text-align:center;
  color:var(--print);
  z-index:4;
  pointer-events:none;
}
.print--brand{
  top:25cqw;
  font-size:4.1cqw;
  font-weight:600;
  letter-spacing:.42em;
  text-indent:.42em;
  text-shadow:0 .12cqw .2cqw rgba(0,0,0,.5);
}
.print--sub{
  top:31.4cqw;
  font-size:1.85cqw;
  letter-spacing:.3em;
  text-indent:.3em;
  color:var(--print-2);
  font-weight:500;
}

/* ==========================================================================
   子表盘（通用）
   ========================================================================== */
.sub{
  position:absolute;
  width:21cqw; aspect-ratio:1;
  border-radius:50%;
  left:50%; top:50%;
  translate:-50% -50%;
  z-index:3;
  /* 凹陷盘：内圈同心纹 + 内阴影 */
  background:
    repeating-radial-gradient(circle at 50% 50%,
      rgba(255,255,255,.05) 0 .32cqw,
      rgba(0,0,0,.06) .32cqw .64cqw),
    radial-gradient(circle at 50% 38%, rgba(255,255,255,.08), transparent 66%);
  box-shadow:
    inset 0 0 0 .28cqw rgba(255,255,255,.14),
    inset 0 .5cqw 1.4cqw rgba(0,0,0,.55);
}
.sub--chrono{ margin-left:23cqw; }              /* 3 点 */
.sub--moon  { margin-top:23cqw; }               /* 6 点 */
.sub--sun   { margin-left:-23cqw; }             /* 9 点 */

.sub__label{
  position:absolute;
  left:50%; translate:-50% 0;
  top:66%;
  font-size:1.5cqw;
  letter-spacing:.16em;
  color:var(--print-2);
  white-space:nowrap;
}
.sub__ticks{
  position:absolute; inset:0;
  background:repeating-conic-gradient(from 0deg,
    rgba(242,246,250,.6) 0deg 1deg, transparent 1deg 30deg);
  -webkit-mask:radial-gradient(circle, transparent 0 38%, #000 38% 45%, transparent 45%);
          mask:radial-gradient(circle, transparent 0 38%, #000 38% 45%, transparent 45%);
}
.sub__ticks--fine{
  background:repeating-conic-gradient(from 0deg,
    rgba(242,246,250,.34) 0deg .6deg, transparent .6deg 6deg);
  -webkit-mask:radial-gradient(circle, transparent 0 41%, #000 41% 45%, transparent 45%);
          mask:radial-gradient(circle, transparent 0 41%, #000 41% 45%, transparent 45%);
}
.sub__num{
  position:absolute;
  left:50%; top:50%;
  font-size:1.9cqw;
  font-weight:600;
  color:var(--print);
  translate:-50% -50%;
  font-family:var(--mono);
}

/* 子盘指针 */
.subhand{
  position:absolute;
  left:50%; bottom:50%;
  transform-origin:50% 100%;
  border-radius:1cqw;
  z-index:5;
}
.subhand--sec{
  width:.5cqw; height:8.2cqw;
  translate:-50% 0;
  background:linear-gradient(180deg,var(--steel-hi),var(--steel));
}
.subhand--min{
  width:.7cqw; height:5.6cqw;
  translate:-50% 0;
  background:linear-gradient(180deg,var(--lacquer),#b8501c);
}
.subhand--sun{
  width:.62cqw; height:7.6cqw;
  translate:-50% 0;
  background:linear-gradient(180deg,var(--steel-hi),var(--steel-lo));
}
.subcap{
  position:absolute;
  left:50%; top:50%;
  width:1.5cqw; aspect-ratio:1;
  translate:-50% -50%;
  border-radius:50%;
  background:radial-gradient(circle at 34% 30%,var(--steel-hi),var(--steel-lo));
  z-index:6;
}

/* ---- 9 点：昼夜 / 日出日落 ---- */
.sun__ring{
  position:absolute; inset:8%;
  border-radius:50%;
  /* 由 JS 写入 conic-gradient：昼弧 / 夜弧 */
  background:conic-gradient(from 0deg, #2c4459 0deg 360deg);
  box-shadow:inset 0 0 .8cqw rgba(0,0,0,.5);
}
.sun__mark{
  position:absolute;
  left:50%; top:50%;
  width:.42cqw; height:9.6cqw;
  translate:-50% -100%;
  transform-origin:50% 100%;
  background:var(--lume);
  opacity:.85;
  border-radius:1cqw;
}
.sun__mark::after{
  content:"";
  position:absolute;
  left:50%; top:-.2cqw;
  width:1.5cqw; aspect-ratio:1;
  translate:-50% 0;
  border-radius:50%;
  background:transparent;
  border:.28cqw solid var(--lume);
}
.sun__mark--set::after{ background:var(--lume); border-color:var(--lume); }

/* ---- 6 点：月相 ---- */
.moon__win{
  position:absolute;
  left:50%; top:16%;
  width:15cqw; height:7.4cqw;
  translate:-50% 0;
  overflow:hidden;
  border-radius:50% 50% 42% 42% / 74% 74% 26% 26%;
  background:linear-gradient(180deg,#050c18,#0a1526);
  box-shadow:inset 0 0 0 .22cqw rgba(255,255,255,.2), inset 0 .3cqw .8cqw rgba(0,0,0,.7);
}
/* 星空 */
.moon__win::before{
  content:"";
  position:absolute; inset:0;
  background-image:
    radial-gradient(.3cqw .3cqw at 14% 34%, #ffe9b0,transparent),
    radial-gradient(.22cqw .22cqw at 32% 66%, #ffe9b0,transparent),
    radial-gradient(.26cqw .26cqw at 68% 28%, #ffe9b0,transparent),
    radial-gradient(.2cqw .2cqw  at 86% 58%, #ffe9b0,transparent),
    radial-gradient(.24cqw .24cqw at 52% 78%, #ffe9b0,transparent);
  z-index:0;
}
/* 双月转盘：一圈 = 两个朔望月。水平居中由 JS 的 transform 一并负责，
   此处不再单独设 translate，避免两处位移叠加 */
.moon__disc{
  position:absolute;
  left:50%; top:6%;
  width:26cqw; aspect-ratio:1;
  transform:translateX(-50%);
  z-index:1;
}
.moon__body{
  position:absolute;
  left:50%; translate:-50% 0;
  width:6.4cqw; aspect-ratio:1;
  border-radius:50%;
  background:
    radial-gradient(.7cqw .7cqw at 62% 38%, rgba(160,146,110,.5),transparent 70%),
    radial-gradient(.5cqw .5cqw at 36% 62%, rgba(160,146,110,.45),transparent 70%),
    radial-gradient(circle at 36% 32%, #fff8e2, #e8d9a8 62%, #c3ae76);
}
.moon__body--a{ top:0; }
.moon__body--b{ bottom:0; }
/* 遮住转盘两侧，形成经典弧形窗 */
.moon__cloud{
  position:absolute;
  top:-12%;
  width:11cqw; aspect-ratio:1;
  border-radius:50%;
  background:var(--dial-e);
  z-index:2;
  box-shadow:0 0 .4cqw rgba(0,0,0,.5);
}
.moon__cloud--l{ left:-6.2cqw; }
.moon__cloud--r{ right:-6.2cqw; }

/* ==========================================================================
   日期窗（4:30 位）
   ========================================================================== */
.datewin{
  position:absolute;
  left:50%; top:50%;
  translate:calc(-50% + 17cqw) calc(-50% + 17cqw);
  width:8.4cqw; height:6.2cqw;
  display:grid; place-items:center;
  border-radius:.6cqw;
  z-index:4;
  background:linear-gradient(180deg,#f4f1e9,#ddd8cc);
  color:#14212f;
  font-family:var(--mono);
  font-size:3.5cqw;
  font-weight:700;
  letter-spacing:-.02em;
  box-shadow:
    0 0 0 .3cqw var(--steel-hi),
    0 0 0 .55cqw var(--steel-lo),
    inset 0 .3cqw .6cqw rgba(0,0,0,.28);
}

/* ==========================================================================
   中央指针
   ========================================================================== */
.hand{
  position:absolute;
  left:50%; bottom:50%;
  transform-origin:50% 100%;
  z-index:7;
  filter:drop-shadow(.35cqw .55cqw .5cqw rgba(0,0,0,.5));
}
/* 剑形针：左右两半亮度不同 = 中脊斜面 */
.hand--hour{
  width:4.4cqw; height:22cqw;
  translate:-50% 0;
  clip-path:polygon(50% 0%, 100% 22%, 62% 100%, 38% 100%, 0% 22%);
  background:linear-gradient(90deg,
    var(--steel-hi) 0 48%, var(--steel-lo) 52% 100%);
}
.hand--min{
  width:3.4cqw; height:31cqw;
  translate:-50% 0;
  clip-path:polygon(50% 0%, 100% 16%, 62% 100%, 38% 100%, 0% 16%);
  background:linear-gradient(90deg,
    var(--steel-hi) 0 48%, var(--steel-lo) 52% 100%);
}
/* 夜光条 */
.hand--hour::after,.hand--min::after{
  content:"";
  position:absolute;
  left:50%; translate:-50% 0;
  top:22%; bottom:14%;
  width:34%;
  border-radius:1cqw;
  background:linear-gradient(180deg,var(--lume),#8fbfa9);
  opacity:.55;
}
.hand--sec{
  width:1cqw; height:35cqw;
  translate:-50% 0;
  background:linear-gradient(180deg,var(--print) 0 82%, var(--print-2));
  border-radius:1cqw;
  z-index:8;
}
/* 秒针尾配重 */
.hand--sec::after{
  content:"";
  position:absolute;
  left:50%; translate:-50% 0;
  bottom:-7cqw;
  width:2.4cqw; height:7cqw;
  border-radius:1.2cqw;
  background:linear-gradient(180deg,var(--print-2),var(--steel));
}
.cap{
  position:absolute;
  left:50%; top:50%;
  width:3.4cqw; aspect-ratio:1;
  translate:-50% -50%;
  border-radius:50%;
  background:radial-gradient(circle at 34% 30%,var(--steel-hi),var(--steel) 50%,var(--steel-dk));
  box-shadow:0 .2cqw .5cqw rgba(0,0,0,.6);
  z-index:9;
}

/* 蓝宝石反光：一道低透明度斜带，不做成大块高光 */
.crystal{
  position:absolute; inset:7.4cqw;
  border-radius:50%;
  z-index:10;
  pointer-events:none;
  background:linear-gradient(128deg,
    rgba(255,255,255,.10) 0 16%,
    rgba(255,255,255,.028) 16% 30%,
    transparent 30% 74%,
    rgba(255,255,255,.045) 74% 84%,
    transparent 84%);
  box-shadow:inset 0 0 2cqw rgba(255,255,255,.06);
}

/* ==========================================================================
   右侧读数与控制
   ========================================================================== */
.panel{
  display:flex;
  flex-direction:column;
  gap:clamp(1rem,2vw,1.5rem);
  min-width:0;
}

.brandline{
  display:flex;
  align-items:baseline;
  gap:.8ch;
  padding-bottom:.9rem;
  border-bottom:1px solid var(--hair);
}
.brandline h1{ font-size:1.35rem; font-weight:640; letter-spacing:-.01em; }
.brandline span{
  font-size:.75rem; letter-spacing:.2em; text-transform:uppercase; color:var(--fg-3);
}

.card{
  background:var(--bg-1);
  border:1px solid var(--hair);
  border-radius:var(--r-lg);
  padding:clamp(.9rem,2vw,1.25rem);
}
.card h2{
  font-size:.6875rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--fg-3);
  font-weight:600;
  margin-bottom:.75rem;
}

.readout{
  font-family:var(--mono);
  font-variant-numeric:tabular-nums;
  font-size:clamp(1.75rem,4.4vw,2.5rem);
  font-weight:600;
  letter-spacing:-.02em;
  line-height:1.1;
}
.readout small{
  font-size:.42em;
  color:var(--fg-3);
  font-weight:500;
  letter-spacing:.06em;
  margin-left:.6ch;
}
.readout--chrono[data-running="true"]{ color:var(--lacquer); }

.rows{ display:grid; gap:0; }
.row{
  display:grid;
  grid-template-columns:minmax(0,7.5em) minmax(0,1fr);
  gap:.75rem;
  align-items:baseline;
  padding:.55rem 0;
  border-top:1px solid var(--hair);
}
.row:first-child{ border-top:0; padding-top:0; }
.row dt{ font-size:.75rem; color:var(--fg-3); letter-spacing:.06em; }
.row dd{ font-size:.9375rem; font-family:var(--mono); font-variant-numeric:tabular-nums; }

/* 城市切换 */
.seg{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:.4rem;
}
.seg button{
  min-height:48px;
  padding:.4rem .7rem;
  border:1px solid var(--hair-2);
  border-radius:var(--r-md);
  background:var(--bg-2);
  color:var(--fg-2);
  font:inherit;
  font-size:.875rem;
  cursor:pointer;
  text-align:left;
  line-height:1.25;
  transition:background-color .16s var(--ease), color .16s var(--ease), border-color .16s var(--ease);
}
.seg button b{ display:block; font-weight:600; color:inherit; }
.seg button i{
  display:block; font-style:normal; font-size:.6875rem;
  color:var(--fg-3); font-family:var(--mono); letter-spacing:.02em;
}
.seg button:hover{ background:var(--bg-3); color:var(--fg); }
.seg button:active{ background:var(--bg-2); }
.seg button[aria-pressed="true"]{
  background:var(--fg);
  color:#16161a;
  border-color:var(--fg);
}
.seg button[aria-pressed="true"] i{ color:#4c4c54; }
.seg button[disabled]{ opacity:.45; cursor:not-allowed; }

/* 计时控制 */
.chrono-ctl{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:.5rem;
  margin-top:.85rem;
}
.btn{
  min-height:48px;
  display:inline-flex; align-items:center; justify-content:center;
  gap:.6ch;
  padding:0 1rem;
  border:1px solid var(--hair-2);
  border-radius:var(--r-md);
  background:var(--bg-2);
  color:var(--fg);
  font:inherit; font-size:.9375rem; font-weight:560;
  cursor:pointer;
  transition:background-color .16s var(--ease), border-color .16s var(--ease), translate .08s var(--ease);
}
.btn:hover{ background:var(--bg-3); }
.btn:active{ translate:0 1px; }
.btn--go{ background:var(--lacquer); border-color:var(--lacquer); color:#1a0d04; font-weight:660; }
.btn--go:hover{ background:#ff8f4d; border-color:#ff8f4d; }
.btn--go:focus-visible{ outline-color:var(--fg); }
.btn[aria-disabled="true"], .btn[disabled]{
  opacity:.42; cursor:not-allowed; pointer-events:none;
}

.laps{
  margin-top:.85rem;
  max-height:9.5rem;
  overflow-y:auto;
  overscroll-behavior:contain;
  border-top:1px solid var(--hair);
}
.laps li{
  display:flex; justify-content:space-between; gap:1rem;
  padding:.38rem 0;
  border-bottom:1px solid var(--hair);
  font-family:var(--mono);
  font-variant-numeric:tabular-nums;
  font-size:.875rem;
}
.laps li span:first-child{ color:var(--fg-3); }
.laps__empty{
  padding:.5rem 0;
  font-size:.8125rem;
  color:var(--fg-3);
  font-family:var(--font);
}

.note{
  font-size:.75rem;
  line-height:1.65;
  color:var(--fg-3);
  text-wrap:pretty;
}

/* ==========================================================================
   动效与降级
   ========================================================================== */
@media (prefers-reduced-motion:reduce){
  /* 秒针改跳秒由 JS 完成；此处只关掉装饰动效并放缓过渡 */
  .pusher,.btn,.seg button{ transition-duration:.01ms; }
  .crystal{ background:linear-gradient(128deg, rgba(255,255,255,.06) 0 20%, transparent 20%); }
}

/* ==========================================================================
   响应式
   ========================================================================== */
@media (max-width:1000px){
  .page{
    grid-template-columns:minmax(0,1fr);
    gap:2rem;
    padding-block:2rem;
  }
  .stage{ order:1; }
  .panel{ order:2; }
  .watch{ width:min(84vw,440px); }
}
@media (max-width:420px){
  .watch{ width:min(80vw,320px); }
  .seg{ grid-template-columns:minmax(0,1fr); }
  .row{ grid-template-columns:minmax(0,1fr); gap:.1rem; }
}
</style>
</head>
<body>

<div class="page">

  <!-- ==================== 表 ==================== -->
  <div class="stage">
    <div class="watch">

      <div class="lug lug--top" aria-hidden="true"></div>
      <div class="lug lug--bot" aria-hidden="true"></div>

      <button class="pusher pusher--a" id="pusherA" type="button"
              aria-describedby="chronoState">
        <span class="u-sr">计时起停按钮</span>
      </button>
      <button class="pusher pusher--b" id="pusherB" type="button"
              aria-describedby="chronoState">
        <span class="u-sr">计圈与归零按钮</span>
      </button>
      <div class="crown" aria-hidden="true"></div>

      <div class="bezel" aria-hidden="true"></div>

      <div class="dial">
        <div class="track" aria-hidden="true"></div>
        <div class="track track--5" aria-hidden="true"></div>
        <div id="indices" aria-hidden="true"></div>

        <div class="print print--brand" aria-hidden="true">子午</div>
        <div class="print print--sub" aria-hidden="true">ASTRONOMIQUE</div>

        <!-- 3 点：计时 -->
        <div class="sub sub--chrono" id="subChrono" role="img"

          <div class="sub__ticks--fine sub__ticks" aria-hidden="true"></div>
          <div class="sub__ticks" aria-hidden="true"></div>
          <span class="sub__label" aria-hidden="true">CHRONO</span>
          <div class="subhand subhand--min" id="hChronoMin" aria-hidden="true"></div>
          <div class="subhand subhand--sec" id="hChronoSec" aria-hidden="true"></div>
          <div class="subcap" aria-hidden="true"></div>
        </div>

        <!-- 9 点：昼夜 / 日出日落 -->
        <div class="sub sub--sun" id="subSun" role="img"
             aria-label="昼夜与日出日落子盘">
          <div class="sun__ring" id="sunRing" aria-hidden="true"></div>
          <div class="sun__mark sun__mark--rise" id="markRise" aria-hidden="true"></div>
          <div class="sun__mark sun__mark--set"  id="markSet"  aria-hidden="true"></div>
          <span class="sub__label" aria-hidden="true" id="sunLabel">北京</span>
          <div class="subhand subhand--sun" id="hSun" aria-hidden="true"></div>
          <div class="subcap" aria-hidden="true"></div>
        </div>

        <!-- 6 点：月相 -->
        <div class="sub sub--moon" id="subMoon" role="img"
             aria-label="月相子盘">
          <div class="moon__win" aria-hidden="true">
            <div class="moon__disc" id="moonDisc">
              <div class="moon__body moon__body--a"></div>
              <div class="moon__body moon__body--b"></div>
            </div>
            <div class="moon__cloud moon__cloud--l"></div>
            <div class="moon__cloud moon__cloud--r"></div>
          </div>
          <span class="sub__label" aria-hidden="true" style="top:74%">MOON</span>
        </div>

        <!-- 日期窗 -->
        <div class="datewin" id="dateWin" role="img" aria-label="日期窗">1</div>

        <!-- 中央指针 -->
        <div class="hand hand--hour" id="hHour" aria-hidden="true"></div>
        <div class="hand hand--min"  id="hMin"  aria-hidden="true"></div>
        <div class="hand hand--sec"  id="hSec"  aria-hidden="true"></div>
        <div class="cap" aria-hidden="true"></div>
      </div>

      <div class="crystal" aria-hidden="true"></div>
    </div>
  </div>

  <!-- ==================== 面板 ==================== -->
  <div class="panel">

    <div class="brandline">
      <h1>子午 天文计时</h1>
      <span>ZIWU</span>
    </div>

    <!-- 本地时间 -->
    <section class="card" aria-labelledby="t-time">
      <h2 id="t-time">本地时间</h2>
      <div class="readout" id="digital" aria-live="off">--:--:--</div>
      <dl class="rows" style="margin-top:.9rem">
        <div class="row">
          <dt>日期</dt><dd id="dDate">—</dd>
        </div>
        <div class="row">
          <dt>本月天数</dt><dd id="dMonthLen">—</dd>
        </div>
        <div class="row">
          <dt>年份</dt><dd id="dLeap">—</dd>
        </div>
      </dl>
    </section>

    <!-- 计时 -->
    <section class="card" aria-labelledby="t-chrono">
      <h2 id="t-chrono">计时码表</h2>
      <div class="readout readout--chrono" id="chronoRead" data-running="false"
           aria-live="off">00:00.00</div>
      <p class="u-sr" id="chronoState" role="status" aria-live="polite">计时已归零</p>

      <div class="chrono-ctl">
        <button class="btn btn--go" id="btnGo" type="button">开始</button>
        <button class="btn" id="btnLap" type="button" aria-disabled="true">计圈</button>
      </div>

      <ul class="laps" id="lapList" aria-label="计圈记录">
        <li class="laps__empty">尚无计圈记录。计时运行时按「计圈」记录分段。</li>
      </ul>
    </section>

    <!-- 天文 -->
    <section class="card" aria-labelledby="t-astro">
      <h2 id="t-astro">昼夜与月相</h2>

      <div class="seg" id="citySeg" role="group" aria-label="选择城市"></div>

      <dl class="rows" style="margin-top:.9rem">
        <div class="row"><dt>当地时间</dt><dd id="aLocal">—</dd></div>
        <div class="row"><dt>日出</dt><dd id="aRise">—</dd></div>
        <div class="row"><dt>日落</dt><dd id="aSet">—</dd></div>
        <div class="row"><dt>昼长</dt><dd id="aLen">—</dd></div>
        <div class="row"><dt>当前</dt><dd id="aState">—</dd></div>
        <div class="row"><dt>月龄</dt><dd id="aAge">—</dd></div>
        <div class="row"><dt>月面照明</dt><dd id="aIllum">—</dd></div>
        <div class="row"><dt>月相</dt><dd id="aPhase">—</dd></div>
      </dl>

      <p class="note" style="margin-top:.85rem">
        日出日落按所选城市的经纬度用日出方程现场计算，并换算到该城市时区显示；
        月相由 Meeus《天文算法》第 48 章的相位角公式求得。
      </p>
    </section>

  </div>
</div>

<script>
(function () {
  'use strict';

  /* ======================================================================
     0. 工具
     ====================================================================== */
  var RAD = Math.PI / 180;
  var SYNODIC = 29.530588853;           // 平均朔望月长度（天）

  function $(id) { return document.getElementById(id); }
  function pad(n, w) { return String(Math.floor(n)).padStart(w || 2, '0'); }
  function norm360(x) { return ((x % 360) + 360) % 360; }

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* 儒略日：以 UTC 计。JS 时间戳本身就是 UTC 毫秒，直接换算即可 */
  function toJD(ms) { return ms / 86400000 + 2440587.5; }
  function fromJD(jd) { return new Date((jd - 2440587.5) * 86400000); }

  /* 大小月与闰年 —— 不依赖 Date 的溢出行为，显式实现 */
  function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
  function daysInMonth(y, m /* 1-12 */) {
    var t = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    return (m === 2 && isLeap(y)) ? 29 : t[m - 1];
  }

  /* ======================================================================
     1. 月相 —— Meeus, Astronomical Algorithms, ch.48
        返回 { illum 0..1, phase 0..1(0=朔), age 天, name }
        精度：照明比误差 ~0.001，月龄误差远小于 1 天
     ====================================================================== */
  function moonPhase(ms) {
    var T = (toJD(ms) - 2451545.0) / 36525;

    // 日月平均距角
    var D = 297.8501921 + 445267.1114034 * T - 0.0018819 * T * T
          + T * T * T / 545868 - T * T * T * T / 113065000;
    // 太阳平近点角
    var M = 357.5291092 + 35999.0502909 * T - 0.0001536 * T * T
          + T * T * T / 24490000;
    // 月球平近点角
    var Mp = 134.9633964 + 477198.8675055 * T + 0.0087414 * T * T
           + T * T * T / 69699 - T * T * T * T / 14712000;

    D = norm360(D); M = norm360(M); Mp = norm360(Mp);

    // 相位角 i（日-月-地夹角），0°=满月，180°=新月
    var i = 180 - D
          - 6.289 * Math.sin(Mp * RAD)
          + 2.100 * Math.sin(M * RAD)
          - 1.274 * Math.sin((2 * D - Mp) * RAD)
          - 0.658 * Math.sin(2 * D * RAD)
          - 0.214 * Math.sin(2 * Mp * RAD)
          - 0.110 * Math.sin(D * RAD);

    var illum = (1 + Math.cos(i * RAD)) / 2;

    // 用平距角判断盈亏：D∈(0,180) 为盈
    var waxing = Math.sin(D * RAD) > 0;
    var iAbs = Math.abs(norm360(i + 180) - 180);      // 折回 0..180
    var phase = waxing ? (180 - iAbs) / 360 : (180 + iAbs) / 360;
    phase = ((phase % 1) + 1) % 1;

    return {
      illum: illum,
      phase: phase,
      age: phase * SYNODIC,
      name: phaseName(phase)
    };
  }

  function phaseName(p) {
    if (p < 0.0213 || p >= 0.9787) return '新月';
    if (p < 0.2287) return '娥眉月';
    if (p < 0.2713) return '上弦月';
    if (p < 0.4787) return '盈凸月';
    if (p < 0.5213) return '满月';
    if (p < 0.7287) return '亏凸月';
    if (p < 0.7713) return '下弦月';
    return '残月';
  }

  /* ======================================================================
     2. 日出日落 —— 日出方程（精度约 ±2 分钟）
        lat 北正，lon 东正。返回 UTC 的 Date，或极昼/极夜标记
     ====================================================================== */
  function sunTimes(ms, lat, lon) {
    var jd = toJD(ms);
    var lw = -lon;                                   // 西经为正
    var n = Math.round(jd - 2451545.0 - 0.0009 - lw / 360);
    var jNoonApprox = 2451545.0 + 0.0009 + lw / 360 + n;

    var M = norm360(357.5291 + 0.98560028 * (jNoonApprox - 2451545.0));
    var C = 1.9148 * Math.sin(M * RAD)
          + 0.0200 * Math.sin(2 * M * RAD)
          + 0.0003 * Math.sin(3 * M * RAD);
    var lambda = norm360(M + C + 180 + 102.9372);

    var jTransit = jNoonApprox
                 + 0.0053 * Math.sin(M * RAD)
                 - 0.0069 * Math.sin(2 * lambda * RAD);

    var delta = Math.asin(Math.sin(lambda * RAD) * Math.sin(23.4397 * RAD));

    var cosOmega = (Math.sin(-0.833 * RAD) - Math.sin(lat * RAD) * Math.sin(delta))
                 / (Math.cos(lat * RAD) * Math.cos(delta));

    if (cosOmega > 1)  return { polar: 'night', transit: fromJD(jTransit) };
    if (cosOmega < -1) return { polar: 'day',   transit: fromJD(jTransit) };

    var omega = Math.acos(cosOmega) / RAD;
    return {
      polar: null,
      rise: fromJD(jTransit - omega / 360),
      set:  fromJD(jTransit + omega / 360),
      transit: fromJD(jTransit)
    };
  }

  /* 取某个 Date 在指定时区里的「小时（含小数）」和 HH:MM 文本 */
  function tzParts(date, tz) {
    var f = new Intl.DateTimeFormat('zh-CN', {
      timeZone: tz, hour12: false,
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    var o = {};
    f.formatToParts(date).forEach(function (p) { o[p.type] = p.value; });
    var h = parseInt(o.hour, 10) % 24;
    var m = parseInt(o.minute, 10);
    var s = parseInt(o.second, 10);
    return { h: h, m: m, s: s, hf: h + m / 60 + s / 3600, text: pad(h) + ':' + pad(m) };
  }

  /* ======================================================================
     3. 城市预设
     ====================================================================== */
  var CITIES = [
    { name: '北京',       en: '39.90°N 116.41°E', lat: 39.9042,  lon: 116.4074, tz: 'Asia/Shanghai' },
    { name: '乌鲁木齐',   en: '43.83°N 87.62°E',  lat: 43.8256,  lon: 87.6168,  tz: 'Asia/Shanghai' },
    { name: '悉尼',       en: '33.87°S 151.21°E', lat: -33.8688, lon: 151.2093, tz: 'Australia/Sydney' },
    { name: '雷克雅未克', en: '64.15°N 21.94°W',  lat: 64.1466,  lon: -21.9426, tz: 'Atlantic/Reykjavik' }
  ];
  var cityIndex = 0;

  /* ======================================================================
     4. 生成时标
     ====================================================================== */
  (function buildIndices() {
    var host = $('indices');
    var skip = { 3: 1, 6: 1, 9: 1 };                 // 让位给子盘
    for (var h = 0; h < 12; h++) {
      if (skip[h]) continue;
      var el = document.createElement('div');
      el.className = 'idx' + (h === 0 ? ' idx--12' : '');
      if (h === 0) el.innerHTML = '<i></i>';
      el.style.transform = 'rotate(' + (h * 30) + 'deg) translateY(-33cqw)';
      host.appendChild(el);
    }
  })();

  /* ======================================================================
     5. 计时码表状态机
        idle ──A──> running ──A──> paused ──A──> running
                       │                  │
                       └──B── 计圈        └──B── 归零
        B 在 idle 下禁用；任意顺序点击都落在上述迁移内
     ====================================================================== */
  var chrono = { state: 'idle', acc: 0, startedAt: 0, laps: [], lastLap: 0 };

  function chronoElapsed(now) {
    return chrono.state === 'running' ? chrono.acc + (now - chrono.startedAt) : chrono.acc;
  }

  function fmtChrono(msTotal) {
    var cs = Math.floor(msTotal / 10) % 100;
    var s  = Math.floor(msTotal / 1000) % 60;
    var m  = Math.floor(msTotal / 60000);
    return pad(m) + ':' + pad(s) + '.' + pad(cs);
  }

  function announce(msg) { $('chronoState').textContent = msg; }

  function syncChronoUI() {
    var go = $('btnGo'), lap = $('btnLap');
    var pa = $('pusherA'), pb = $('pusherB');

    if (chrono.state === 'idle') {
      go.textContent = '开始';
      go.classList.add('btn--go');
      lap.textContent = '计圈';
      lap.setAttribute('aria-disabled', 'true');
      pb.setAttribute('aria-disabled', 'true');
    } else if (chrono.state === 'running') {
      go.textContent = '暂停';
      go.classList.remove('btn--go');
      lap.textContent = '计圈';
      lap.setAttribute('aria-disabled', 'false');
      pb.setAttribute('aria-disabled', 'false');
    } else {
      go.textContent = '继续';
      go.classList.add('btn--go');
      lap.textContent = '归零';
      lap.setAttribute('aria-disabled', 'false');
      pb.setAttribute('aria-disabled', 'false');
    }
    pa.setAttribute('aria-label', go.textContent + '计时');
    pb.setAttribute('aria-label', lap.textContent);
    $('chronoRead').dataset.running = (chrono.state === 'running');
  }

  function toggleRun() {
    var now = Date.now();
    if (chrono.state === 'running') {
      chrono.acc += now - chrono.startedAt;
      chrono.startedAt = 0;
      chrono.state = 'paused';
      announce('计时已暂停，' + fmtChrono(chrono.acc));
    } else {
      chrono.startedAt = now;
      chrono.state = 'running';
      announce(chrono.acc === 0 ? '计时已开始' : '计时已继续');
    }
    syncChronoUI();
  }

  function lapOrReset() {
    if (chrono.state === 'idle') return;             // 防御：不可达，但保留
    if (chrono.state === 'running') {
      var t = chronoElapsed(Date.now());
      var split = t - chrono.lastLap;
      chrono.lastLap = t;
      chrono.laps.push({ total: t, split: split });
      renderLaps();
      announce('第 ' + chrono.laps.length + ' 圈，分段 ' + fmtChrono(split));
    } else {
      chrono.acc = 0; chrono.startedAt = 0; chrono.lastLap = 0;
      chrono.laps = []; chrono.state = 'idle';
      renderLaps();
      announce('计时已归零');
      syncChronoUI();
    }
  }

  function renderLaps() {
    var ul = $('lapList');
    ul.textContent = '';
    if (!chrono.laps.length) {
      var li = document.createElement('li');
      li.className = 'laps__empty';
      li.textContent = '尚无计圈记录。计时运行时按「计圈」记录分段。';
      ul.appendChild(li);
      return;
    }
    for (var i = chrono.laps.length - 1; i >= 0; i--) {
      var l = chrono.laps[i];
      var row = document.createElement('li');
      var a = document.createElement('span');
      a.textContent = '第 ' + (i + 1) + ' 圈  +' + fmtChrono(l.split);
      var b = document.createElement('span');
      b.textContent = fmtChrono(l.total);
      row.appendChild(a); row.appendChild(b);
      ul.appendChild(row);
    }
  }

  $('btnGo').addEventListener('click', toggleRun);
  $('pusherA').addEventListener('click', toggleRun);
  $('btnLap').addEventListener('click', lapOrReset);
  $('pusherB').addEventListener('click', lapOrReset);
  syncChronoUI();

  /* ======================================================================
     6. 城市选择器
     ====================================================================== */
  (function buildCities() {
    var host = $('citySeg');
    CITIES.forEach(function (c, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-pressed', String(i === cityIndex));
      b.innerHTML = '<b></b><i></i>';
      b.querySelector('b').textContent = c.name;
      b.querySelector('i').textContent = c.en;
      b.addEventListener('click', function () {
        cityIndex = i;
        Array.prototype.forEach.call(host.children, function (el, j) {
          el.setAttribute('aria-pressed', String(j === i));
        });
        $('sunLabel').textContent = c.name;
        slowTick(Date.now(), true);
      });
      host.appendChild(b);
    });
  })();

  /* ======================================================================
     7. 渲染
        —— 所有角度都由当前时间戳直接推出，不做增量累加，
           因此长时间运行不漂移；标签页切回时第一帧就是正确值。
     ====================================================================== */
  var el = {
    hHour: $('hHour'), hMin: $('hMin'), hSec: $('hSec'),
    cSec: $('hChronoSec'), cMin: $('hChronoMin'),
    hSun: $('hSun'), moonDisc: $('moonDisc'),
    dateWin: $('dateWin'), digital: $('digital'), chronoRead: $('chronoRead')
  };

  function setRot(node, deg) { node.style.transform = 'rotate(' + deg + 'deg)'; }

  var lastSlow = -1;

  function fastTick(now) {
    var d = new Date(now);

    var secF = d.getSeconds() + d.getMilliseconds() / 1000;
    if (reduceMotion.matches) secF = Math.floor(secF);     // 降级：跳秒
    var minF = d.getMinutes() + secF / 60;
    var hrF  = (d.getHours() % 12) + minF / 60;

    setRot(el.hSec,  secF * 6);
    setRot(el.hMin,  minF * 6);
    setRot(el.hHour, hrF * 30);

    // 计时子盘：长针 60 秒一圈，短针 30 分一圈
    var e = chronoElapsed(now);
    var eSec = e / 1000;
    if (reduceMotion.matches) eSec = Math.floor(eSec);
    setRot(el.cSec, (eSec % 60) * 6);
    setRot(el.cMin, ((eSec / 60) % 30) * 12);
    el.chronoRead.textContent = fmtChrono(e);
  }

  function slowTick(now, force) {
    var d = new Date(now);
    var key = d.getMinutes();
    if (!force && key === lastSlow) {
      // 秒级仍需刷新的部分
      el.digital.innerHTML = pad(d.getHours()) + ':' + pad(d.getMinutes()) +
        ':' + pad(d.getSeconds()) + '<small>本机时区</small>';
      return;
    }
    lastSlow = key;

    /* ---- 时间 / 日期 ---- */
    el.digital.innerHTML = pad(d.getHours()) + ':' + pad(d.getMinutes()) +
      ':' + pad(d.getSeconds()) + '<small>本机时区</small>';

    var y = d.getFullYear(), mo = d.getMonth() + 1, day = d.getDate();
    var dim = daysInMonth(y, mo);
    el.dateWin.textContent = String(day);
    el.dateWin.setAttribute('aria-label',
      '日期窗：' + mo + ' 月 ' + day + ' 日，本月共 ' + dim + ' 天');
    $('dDate').textContent = y + '-' + pad(mo) + '-' + pad(day);
    $('dMonthLen').textContent = dim + ' 天（' + (dim === 31 ? '大月' : dim === 30 ? '小月' : '二月') + '）';
    $('dLeap').textContent = y + (isLeap(y) ? ' 闰年' : ' 平年');

    /* ---- 月相 ---- */
    var mp = moonPhase(now);
    // 双月转盘：整圈 = 两个朔望月；满月(phase=.5)时转角为 0，此时 A 月正对视窗
    var discAngle = norm360(mp.phase * 180 - 90);
    el.moonDisc.style.transform = 'translateX(-50%) rotate(' + discAngle + 'deg)';
    $('aAge').textContent = mp.age.toFixed(1) + ' 天';
    $('aIllum').textContent = (mp.illum * 100).toFixed(1) + ' %';
    $('aPhase').textContent = mp.name;
    $('subMoon').setAttribute('aria-label',
      '月相子盘：' + mp.name + '，月龄 ' + mp.age.toFixed(1) +
      ' 天，月面照明 ' + (mp.illum * 100).toFixed(0) + '%');

    /* ---- 昼夜 / 日出日落 ---- */
    var c = CITIES[cityIndex];
    var st = sunTimes(now, c.lat, c.lon);
    var loc = tzParts(d, c.tz);
    $('aLocal').textContent = loc.text + '（' + c.tz + '）';

    // 24 小时盘：正午在顶部，角度 = (小时 - 12) × 15°
    var handAngle = (loc.hf - 12) * 15;
    setRot(el.hSun, handAngle);

    var ring = $('sunRing'), mr = $('markRise'), msk = $('markSet');
    var dayCol = 'rgba(126,178,214,.92)', nightCol = '#0c1b2b';

    if (st.polar) {
      var polarDay = st.polar === 'day';
      ring.style.background = polarDay ? dayCol : nightCol;
      mr.style.display = msk.style.display = 'none';
      $('aRise').textContent = polarDay ? '极昼（今日不落）' : '极夜（今日不出）';
      $('aSet').textContent  = polarDay ? '极昼（今日不落）' : '极夜（今日不出）';
      $('aLen').textContent  = polarDay ? '24 小时 00 分' : '0 小时 00 分';
      $('aState').textContent = polarDay ? '白昼' : '黑夜';
      $('subSun').setAttribute('aria-label',
        c.name + ' 昼夜子盘：' + (polarDay ? '极昼' : '极夜'));
    } else {
      mr.style.display = msk.style.display = '';
      var rise = tzParts(st.rise, c.tz);
      var set  = tzParts(st.set,  c.tz);
      var aRise = (rise.hf - 12) * 15;
      var aSet  = (set.hf  - 12) * 15;

      setRot(mr, aRise);
      setRot(msk, aSet);

      // 昼弧自日出到日落顺时针；正午处于 0°，故日出角为负、日落角为正
      var s0 = norm360(aRise), s1 = norm360(aSet);
      ring.style.background =
        'conic-gradient(from 0deg,' +
        dayCol + ' 0deg ' + s1.toFixed(2) + 'deg,' +
        nightCol + ' ' + s1.toFixed(2) + 'deg ' + s0.toFixed(2) + 'deg,' +
        dayCol + ' ' + s0.toFixed(2) + 'deg 360deg)';

      var lenMs = st.set - st.rise;
      var lh = Math.floor(lenMs / 3600000);
      var lm = Math.round((lenMs % 3600000) / 60000);
      var isDay = (now >= st.rise.getTime() && now < st.set.getTime());

      $('aRise').textContent = rise.text;
      $('aSet').textContent  = set.text;
      $('aLen').textContent  = lh + ' 小时 ' + pad(lm) + ' 分';
      $('aState').textContent = isDay ? '白昼' : '夜间';
      $('subSun').setAttribute('aria-label',
        c.name + ' 昼夜子盘：日出 ' + rise.text + '，日落 ' + set.text +
        '，当前' + (isDay ? '白昼' : '夜间'));
    }

    $('subChrono').setAttribute('aria-label',
      '计时子盘，当前 ' + fmtChrono(chronoElapsed(now)));
  }

  /* ---- 主循环：每帧从系统时钟重新求解，天然无漂移 ---- */
  var lastSecondStamp = -1;
  function loop() {
    var now = Date.now();
    fastTick(now);
    var sec = Math.floor(now / 1000);
    if (sec !== lastSecondStamp) { lastSecondStamp = sec; slowTick(now, false); }
    requestAnimationFrame(loop);
  }

  /* ---- 切回标签页：立即强制重算一次，不等下一帧的节流 ---- */
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      var now = Date.now();
      lastSlow = -1; lastSecondStamp = -1;
      fastTick(now);
      slowTick(now, true);
    }
  });
  window.addEventListener('focus', function () {
    var now = Date.now();
    lastSlow = -1;
    fastTick(now); slowTick(now, true);
  });

  /* 用户中途切换动效偏好时立即生效 */
  if (reduceMotion.addEventListener) {
    reduceMotion.addEventListener('change', function () { fastTick(Date.now()); });
  }

  slowTick(Date.now(), true);
  loop();
})();
</script>

</body>
</html>
