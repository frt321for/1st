<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>祖龙巡北境 · 秦始皇骑北极熊</title>
<style>
:root{
  --night-1:#0b1026;--night-2:#141b3c;--aurora-1:#5ef2b0;--aurora-2:#4fd8e8;
  --robe:#1c1626;--vermilion:#a63a2b;--gold:#d4b06a;--snow:#eef4fa;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:radial-gradient(1300px 800px at 50% 18%, #101735, #070b1c 70%);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
}
/* ---------- 舞台 ---------- */
.stage{
  position:relative;width:min(96vw,1240px);aspect-ratio:16/9;max-height:92vh;
  border-radius:14px;overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.75), 0 0 0 1px rgba(140,160,220,.12);
}
.stage svg{position:absolute;inset:0;width:100%;height:100%}

/* ---------- 星与月 ---------- */
.stars span{
  position:absolute;width:2.5px;height:2.5px;border-radius:50%;background:#dfe8ff;
  opacity:.25;animation:twinkle var(--d,3s) ease-in-out infinite alternate;
  animation-delay:var(--dl,0s);
}
@keyframes twinkle{from{opacity:.15;transform:scale(.8)}to{opacity:.9;transform:scale(1.15)}}

/* ---------- 极光 ---------- */
.aurora{filter:blur(16px);mix-blend-mode:screen;opacity:.6}
.aurora.a1{animation:aur1 13s ease-in-out infinite alternate}
.aurora.a2{animation:aur2 17s ease-in-out infinite alternate;opacity:.45}
.aurora.a3{animation:aur1 21s ease-in-out infinite alternate-reverse;opacity:.35}
@keyframes aur1{
  from{transform:translateY(-16px) scaleY(1) skewX(0deg)}
  to{transform:translateY(22px) scaleY(1.25) skewX(-4deg)}
}
@keyframes aur2{
  from{transform:translateY(18px) scaleY(1.1)}
  to{transform:translateY(-22px) scaleY(.9) skewX(5deg)}
}

/* ---------- 三层视差滚动（两份拼接 → 无缝循环） ---------- */
.scroll-far{animation:scrollX 30s linear infinite}
.scroll-mid{animation:scrollX 16s linear infinite}
.scroll-near{animation:scrollX 7.5s linear infinite}
@keyframes scrollX{from{transform:translateX(0)}to{transform:translateX(-1200px)}}

/* ---------- 熊步态 ---------- */
.bear-bob{animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(6px)}}
.leg{transform-box:fill-box;transform-origin:50% 8%}
.leg.fl{animation:gaitA 1.8s ease-in-out infinite}
.leg.fr{animation:gaitB 1.8s ease-in-out infinite}
.leg.bl{animation:gaitB 1.8s ease-in-out infinite;animation-delay:-.25s}
.leg.br{animation:gaitA 1.8s ease-in-out infinite;animation-delay:-.25s}
@keyframes gaitA{0%{transform:rotate(15deg)}50%{transform:rotate(-17deg)}100%{transform:rotate(15deg)}}
@keyframes gaitB{0%{transform:rotate(-17deg)}50%{transform:rotate(15deg)}100%{transform:rotate(-17deg)}}
.head-nod{transform-box:fill-box;transform-origin:70% 80%;animation:nod 1.8s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-2.4deg)}}
.tail-wag{transform-box:fill-box;transform-origin:0% 50%;animation:wag 1.8s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}

/* ---------- 帝王 ---------- */
.pendant{transform-box:fill-box;transform-origin:50% 0%;animation:sway 1.8s ease-in-out infinite}
.pendant.p2{animation-delay:-.45s}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.robe-tail{transform-box:fill-box;transform-origin:0% 20%;animation:tail 2.4s ease-in-out infinite alternate}
@keyframes tail{from{transform:skewY(-2.5deg) scaleX(.97)}to{transform:skewY(3deg) scaleX(1.03)}}
.sleeve{transform-box:fill-box;transform-origin:80% 10%;animation:sleeve 1.8s ease-in-out infinite}
@keyframes sleeve{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-3.5deg)}}

/* ---------- 旗帜 ---------- */
.flag{transform-box:fill-box;transform-origin:0% 50%;animation:flagwave 1.15s ease-in-out infinite}
@keyframes flagwave{
  0%,100%{transform:skewY(-3.5deg) scaleX(1)}
  50%{transform:skewY(4deg) scaleX(.96)}
}
.pole-top{animation:pole 1.8s ease-in-out infinite}
@keyframes pole{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}

/* ---------- 白气 ---------- */
.breath{transform-box:fill-box;transform-origin:0% 50%;animation:breath 3.4s ease-out infinite;opacity:0}
.breath.b2{animation-delay:1.7s}
@keyframes breath{
  0%{opacity:0;transform:translate(0,0) scale(.4)}
  18%{opacity:.75}
  100%{opacity:0;transform:translate(-70px,-26px) scale(2.1)}
}

/* ---------- 飘雪 ---------- */
.snow span{
  position:absolute;top:-3vh;border-radius:50%;background:#fff;
  left:var(--x);width:var(--s);height:var(--s);opacity:var(--o,.8);
  animation:fall var(--t) linear infinite;animation-delay:var(--dl);
  filter:blur(var(--b,0px));
}
@keyframes fall{
  from{transform:translate(0,-4vh)}
  to{transform:translate(var(--dx,20px),108vh)}
}

/* ---------- 题字 ---------- */
.inscribe{
  position:absolute;left:clamp(14px,3vw,40px);top:clamp(12px,3vh,30px);z-index:6;
  writing-mode:vertical-rl;display:flex;gap:14px;pointer-events:none;
}
.inscribe .t1{
  font-family:"STKaiti","KaiTi","SimSun",serif;font-size:clamp(20px,3.2vmin,32px);
  letter-spacing:.5em;color:#e9edf8;text-shadow:0 0 18px rgba(90,140,255,.45);
}
.inscribe .t2{font-size:clamp(9px,1.3vmin,12px);letter-spacing:.4em;color:#7f8db8;margin-top:8px}
.inscribe .seal{
  writing-mode:horizontal-tb;margin-top:14px;width:34px;height:34px;background:var(--vermilion);
  color:#f6ecd8;font-size:12px;font-family:"STKaiti","KaiTi",serif;border-radius:4px;
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;
  transform:rotate(-3deg);box-shadow:0 0 10px rgba(166,58,43,.5);
}
.caption{
  position:absolute;bottom:10px;left:0;right:0;text-align:center;z-index:6;
  font-size:10px;letter-spacing:.34em;color:#6f7ba3;pointer-events:none;
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important}
}
</style>
</head>
<body>

<div class="stage" role="img" aria-label="动画：秦始皇头戴冕旒、身着玄色冕服，骑在一只缓步北行的白色北极熊背上，穿越极光下的雪原，身后旌旗猎猎，雪花飘落。">

  <!-- 星空与极光、雪（HTML 层） -->

    <span style="left:72%;top:11%;--d:2.4s;--dl:.3s"></span><span style="left:80%;top:26%;--d:2.9s;--dl:.9s"></span>

  <svg viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>

        <stop offset="0" stop-color="rgba(94,242,176,0)"/><stop offset=".4" stop-color="rgba(94,242,176,.85)"/>

      <linearGradient id="snowG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e8f0f9"/><stop offset="1" stop-color="#b9cade"/>

        <path fill="#232c55" d="M0,505 L120,458 L240,500 L380,448 L520,502 L660,462 L800,506 L940,470 L1080,510 L1200,478 L1200,540 L0,540 Z" opacity=".9"/>

    <!-- 天空 -->

    <!-- 极光 -->

    <g class="aurora a2"><path d="M-80,130 C200,240 420,80 700,190 C920,262 1080,120 1280,200" stroke="url(#aur2)" stroke-width="44" fill="none" stroke-linecap="round"/></g>

    <!-- ============ 主角：北极熊 + 始皇 ============ -->
    <g transform="translate(0,-6)">
      <g class="bear-bob">

        <!-- 后侧腿（画在身体后面） -->

          <!-- 冕冠：冠卷 + 冠板 + 垂旒 -->

          <path d="M20,172 L96,168 L98,184 L22,188 Z" fill="#1a1420"/>

          <!-- 前垂旒（眼前）与后垂旒 -->

            <line x1="0" y1="0" x2="0" y2="46" stroke="#cfc4a6" stroke-width="1.4"/>
